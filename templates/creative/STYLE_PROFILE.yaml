schema_version: 1
style:
  id: kohami-everyday-editorial-v1
  status: USER_SELECTED_MODEL_DIRECTION_WITH_SOFT_POSE_REFERENCES_PENDING_REVIEW
  purpose: Consistent editorial product photography for KOHAMI apparel and accessories.
  direction: >-
    Photorealistic Japanese sweet everyday-fashion editorial photography with an unstaged,
    warm, lived-in feeling. Use the selected KOHAMI identity master as the face and hair
    anchor when the chosen local workflow accepts image references. Keep the garment clearly
    visible while preserving the model's natural, candid presence.
  palette:
    neutrals: [warm-white, oatmeal, ivory, taupe, soft-gray]
    accents: [muted-rose, sage, soft-olive, slate-blue]
    avoid: [neon, hard-saturated-backgrounds, strong-color-casts]
  lighting:
    source: Soft window daylight or a large diffused studio source.
    contrast: Low to moderate, with gentle natural shadows and neutral white balance.
    skin: Visible natural texture, subtle asymmetry and a few flyaway hairs; no plastic smoothing or heavy retouching.
  environment:
    preferred: Simple light home or small studio with restrained wood or subtle foliage.
    avoid: Busy props, visible text, logos, watermarks, unrelated products, artificial luxury sets.
  composition:
    product_cards: Square or near-square; show enough body to judge garment silhouette and details.
    hero: Wide landscape crop with model and clothing on the right and clear space on the left for real UI text.
    framing: Keep garment neckline, sleeves, hem and relevant accessory details inside the frame.
    count: One adult model, one outfit, one photograph per output.
  pose_and_styling:
    pose: One candid in-between action with a small genuine expression; vary gaze and posture without changing identity.
    styling: Sweet adult Japanese everyday womenswear; follow product references and avoid school uniforms or minor cues.
  model:
    character_profile: templates/creative/CHARACTER_PROFILE.yaml
    invariants: Keep the same model identity, apparent age, hair color/length/fringe, skin tone and facial proportions.
  product_fidelity:
    source_of_truth: Supplied product photo and catalog source data.
    preserve: [silhouette, neckline, sleeve-length, hem, buttons, seams, pattern, fabric-appearance, color]
    reject_if: Product details drift enough to change the customer's understanding of the item.
  prohibited:
    - Collages, contact sheets, split panels, anime or illustration insets, duplicate people or multiple outfits in one output.
    - Text, labels, logos, watermarks, fake prices, invented product claims or UI elements.
    - Identity drift, cropped key garment details, extra fingers, malformed hands, or props obscuring the item.
  execution:
    model_key: z-image-turbo
    model_name: Tongyi-MAI Z-Image-Turbo
    runtime: ComfyUI Desktop
    runtime_version: 0.42.5
    aips_model_profile: z-image-turbo
    aips_model_id: z-image-turbo
    workflow_topology: z_image_split_loader
    workflow_template: AIPS 0.83.0 COMFYUI_Z_IMAGE_TURBO_API.json
    local_only: true
    auto_fallback: false
    weight_download: false
    readiness: PREFLIGHT_READY_THREE_SUPPLEMENTAL_RUNS_COMPLETE_MASTER_SELECTED_IDENTITY_LOCK_UNVERIFIED
    preflight_verified_at: 2026-10-24
    preflight_scope: Live ComfyUI model catalog and fixed Z-Image-Turbo workflow; three supplemental text-only inferences observed on Apple MPS.
    prompting_guidance: docs/agents/model-image-generation.md
    prompt_upsampler: not_used
    prompt_version: kohami-zimage-kohami-model-identity-pack-v1
    license: Apache-2.0; follow Tongyi-MAI Z-Image-Turbo model card.
    provenance_requirements: templates/creative/CHARACTER_ARTWORK_MANIFEST.yaml
  review:
    required_for_each_image: [identity, garment-fidelity, composition, anatomy, color, framing]
    acceptance: A critical identity or garment-fidelity error rejects that image.
    current_identity_lock: NOT_VERIFIED; active text-to-image workflow cannot receive the identity master.
  policy_reference: docs/agents/model-image-generation.md
