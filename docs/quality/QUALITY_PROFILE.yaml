version: 1
id: kohami-local-mock-core
status: READY_FOR_REVIEW
scope: local_complete_mock_core
classification:
  baseline: Q2
  rationale: 即使外部交易皆mock，會員與後台仍有授權、持久化及併發完整性要求。
  security_assurance: SAL2_PROPOSED
  reliability_impact: local_dataset_integrity
  production_profile: DEFERRED
authority:
  accepted: [ASP.NET_Core, .NET_10, Vue_3, Nuxt_SSR, Microsoft_SQL_Server, all_commerce_adapters_mock, local_only]
  proposed: [本檔新增門檻, 本機部署與身份細節, 工時估算]
  evidence_state: NOT_EXECUTED
assumptions:
  - 只有合成商品與帳號／訂單，不收集正式資料、不公開對外。
  - 核心商店不依賴換裝完成；素材與正式營運另驗收。
  - 量測記錄實際硬體、版本、fixture、網路、樣本及冷／熱啟動，不混為正式SLA。
dimensions:
  performance:
    priority: medium
    criteria:
      - id: Q-01
        status: DEFERRED_OPTION
        target: 本機服務可用不以 LCP／INP／CLS 數值門檻判定；既有 2.5s／200ms／0.1 僅作未來效能優化候選，不是已採服務承諾或正式 SLA。
        method: 僅採用本機深度效能選配後，固定裝置／viewport、fixture、快取、網路、樣本及期間分開量測；field INP 不以 lab 或 Event Timing 代理代替。
      - id: Q-02
        status: DEFERRED_OPTION
        target: 本機讀取 API P95 500ms 為未採用的工程候選，不是目前門檻。
        method: 僅採用本機深度效能選配後，固定資料集與併發條件分開量測商品讀取、查單與寫入；錯誤不能當成功樣本。
  security:
    priority: high
    criteria:
      - id: Q-03
        target: 會員/guest/四角色完整正反向授權、帳密驗證、撤權及CSRF；無真付款資料、本人照片、AI或第三方商務呼叫。
        method: 各敏感OP的401/403/跨資源404、舊session、重放、scope不符、CSRF及受控mock入口測試；網路與日誌檢查。
  usability:
    priority: high
    criteria:
      - id: Q-04
        target: 新提案：核心流程以WCAG2.2 AA為驗收目標；逐項適用性及例外人工評估，不能以自動掃描宣稱完整符合。
        method: 桌面鍵盤旅程、焦點、對比、label、錯誤、live region、200%縮放/400%reflow；responsive viewport 只驗布局。iPhone Safari／VoiceOver 實機人工旅程列於選配，不列本機核心完成門檻；限時保留另查WCAG timing要求。自動檢查不代表完整符合WCAG AA。
      - id: Q-05
        target: zh-TW/ja/en核心畫面及狀態完整；切語系保留SKU/cart/operation，全部交易結果明示mock。
        method: SCR-01–09核心範圍及DEMO-01–12端到端，文字校對，SSR HTML與noindex檢查。
  reliability:
    priority: high
    criteria:
      - id: Q-06
        target: 最後一件20個並行checkout只能一筆承諾；多SKU原子性；退款併發不超額；所有原操作重送至少10次只有一次有效效果。
        method: 真SQL整合、不同process/worker、重複亂序adapter事件、未知額度及撤權中途場景。
      - id: Q-07
        target: 必要：程序重啟後保留未決付款／退款／outbox 狀態且不重複副作用。獨立備份還原與 cutoff 對帳為選配。
        method: 對受影響 worker／API 執行專用合成資料 restart 驗證；獨立還原只在採用對應選配後執行。
  maintainability:
    priority: medium
    criteria:
      - id: Q-08
        target: 旅程→OP→DOM→DEMO/Q追蹤；候選OpenAPI完整、operationId唯一、enum一致、成功與錯誤範例可驗證。
        method: 契約解析、編譯、產品contract tests及變更影響核對；不以生成器成功代替驗收。
  resource_cost:
    priority: medium
    criteria:
      - id: Q-09
        status: DEFERRED_OPTION
        target: 本機深度資源剖析與 8GiB 記憶體候選不阻擋服務啟動；仍禁止未核准雲端／供應商費用。
        method: 僅採用本機深度效能選配後，固定 fixture 記錄 RSS、CPU、資料／圖片體積及啟動時間；不因單次觀測自行提高資源上限。
  delivery_time:
    priority: medium
    criteria:
      - id: Q-10
        target: M0–M4按可展示旅程交付，無承諾日曆截止；工時範圍見IMPLEMENTATION_PLAN。
        method: 每里程碑固定候選與驗收紀錄，完成M0後依SQL實證修訂估算。
tradeoffs:
  - 簡單單一核心＋持久化worker減少程序，但不降低SQL競爭、權限與重啟驗證。
  - mock降低外部資格/資金風險，不能證明正式金流/物流/發票或營運SLA。
  - 本機HTTPS與密碼驗證增加開發步驟，保留服務端角色、範圍與 session 撤銷檢查。
not_applicable:
  formal_availability_sla: 無公開正式服務，99.9%月可用性留正式營運觀測。
  real_shipping_support_sla: 無真實配送／客服工時，不能以fixture驗證營運達標。
  fitting_performance_release: 素材實證及換裝交付不在這批核心範圍，不刪除既有後續目標。
sources:
  - path: docs/planning/kohami/delivery/IMPLEMENTATION_PLAN.md
  - path: docs/proposals/kohami/04-demo-commerce-policy.md
  - url: https://www.w3.org/TR/WCAG22/
    verified_on: '2026-10-13'
    use: 提案可及性標準與逐項驗證來源，不聲稱已符合。
