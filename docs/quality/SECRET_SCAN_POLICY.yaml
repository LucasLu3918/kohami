# Snapshot of AIPS 0.83.0 strict policy; the bounded text limit alone is raised for the committed 4.5 MB evidence file.
# Scanner source SHA-256: aa544b71161506075e5aae15421eb94eb8b49509f3b49826fee77e9f9d36e703
# Source policy SHA-256: 1a03c493bc594143857157945229b9140d826e5be93f41b3db1f31a9294b2d5c
version: 1
policy_id: aips-secret-scan
limits:
  max_file_bytes: 8000000
generated_paths:
  - "**/.git/**"
  - "**/.venv/**"
  - "**/venv/**"
  - "**/node_modules/**"
  - "**/vendor/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/.next/**"
  - "**/.cache/**"
  - "**/.ruff_cache/**"
  - "**/.pytest_cache/**"
  - "**/target/**"
  - "**/__pycache__/**"
lockfiles:
  path_patterns:
    - "**/package-lock.json"
    - "**/yarn.lock"
    - "**/pnpm-lock.yaml"
    - "**/poetry.lock"
    - "**/Pipfile.lock"
    - "**/*.lock"
  disabled_detectors:
    - generic-secret-assignment
allowlist:
  - path: tools/native-operations/SqlProvision.cs
    detector: generic-secret-assignment
    fingerprint: ee3507ab580b3714
    reason: >-
      SQL Server CREATE LOGIN uses a dynamic DDL password token; this expression
      passes an ephemeral runtime password through QUOTENAME and is not a stored
      credential literal. The generic assignment detector classifies the SQL
      grammar as an assignment. Revalidate the source and fingerprint before
      expiry; do not broaden the path or detector scope.
    expires: "2027-01-19"
