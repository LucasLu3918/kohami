    - AssetRevision
    - Compatibility
  fitting.manage:
    roles:
    - Owner
    scopeKinds:
    - Dataset
    - AssetRevision
    - Compatibility
  asset.publish:
    roles:
    - Owner
    scopeKinds:
    - Dataset
    - AssetRevision
  asset.revoke:
    roles:
    - Owner
    scopeKinds:
    - Dataset
    - AssetRevision
existing_schema_targets:
  account:
  - GrantCreate
  - GrantRead
  - GrantScope
  account_root_fields:
  - x-role-permission-allowlist
  notes: 列名均存在，但必須逐欄位/條件分支整合資源範圍；不能只擴enum。
default_other_roles: DENY
grant_rules:
- Never self grant; subset of actor current grantable scope; finite interval.
- Dataset grant covers only actual resources in same Dataset; resource id remains
  exact.
- Unknown added permission or proof kind denied by unchanged original contracts.
session_version: Grant change rotates SecurityVersion and forces reauthentication;
  never promotes Member/stage to admin.
command_authorization:
  SubmitReview:
    permission: fitting.manage
    resourceKind: AssetRevision
  Approve:
    permission: asset.publish
    resourceKind: AssetRevision
  Reject:
    permission: fitting.manage
    resourceKind: AssetRevision
  Retire:
    permission: fitting.manage
    resourceKind: AssetRevision
  Suspend:
    permission: fitting.manage
    resourceKind: AssetRevision
  Resume:
    permission: asset.publish
    resourceKind: AssetRevision
  RevokeRights:
    permission: asset.revoke
    resourceKind: AssetRevision
blocked_until:
- Human adoption of owner-only permissions and resource mapping changes
- Bootstrap protected grant path assigned without self-grant bypass
- SQL current permission checks, version races, audit and restore verified
product_tests: NOT_EXECUTED
