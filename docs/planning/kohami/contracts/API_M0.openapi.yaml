x-owner-mfa-policy: OPTIONAL_FOR_OWNER; non-Owner administrative roles retain the accepted TOTP requirement.
x-mfa-method-decision: ACCEPTED_PASSWORD_TOTP_FOR_NON_OWNER; OWNER_OPTIONAL
