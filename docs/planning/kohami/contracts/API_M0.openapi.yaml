components:
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          minLength: 1
          maxLength: 60
        traceId: *id011
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - type
      - title
      - status
      - code
      - traceId
      examples:
      - type: demo_value
        title: demo_value
        status: 400
        code: demo_value
        traceId: demo_value
    CartItem:
      type: object
      additionalProperties: false
      properties:
        skuId: *id011
        quantity: &id013
          type: integer
          minimum: 1
          maximum: 2147483647
      required:
      - skuId
      - quantity
      examples:
      - skuId: demo_value
        quantity: 1
    CartItemRequest:
      type: object
      additionalProperties: false
      properties:
        quantity: *id013
      required:
      - quantity
      examples:
      - quantity: 1
    Cart:
      type: object
      additionalProperties: false
      properties:
        id: *id011
        mode:
          const: mock
        version: *id014
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
      required:
      - id
      - mode
      - version
      - items
      examples:
      - id: demo_value
        mode: mock
        version: demo_value
        items: []
    QuoteRequest:
      type: object
      additionalProperties: false
      properties:
        cartVersion: *id014
        deliveryMethod:
          enum:
          - mock_home
          - mock_pickup
        region:
          enum:
          - demo_supported
          - demo_unsupported
      required:
      - cartVersion
      - deliveryMethod
      - region
      examples:
      - cartVersion: demo_value
        deliveryMethod: mock_home
        region: demo_supported
    PriceSnapshot:
      type: object
      additionalProperties: false
      properties:
        currency:
          const: TWD
        merchandiseTwd: &id015
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        discountTwd: *id015
        shippingTwd: *id015
        totalTwd:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        feeVersion: *id011
        allocationVersion: *id011
      required:
      - currency
      - merchandiseTwd
      - discountTwd
      - shippingTwd
      - totalTwd
      - feeVersion
      - allocationVersion
      examples:
      - currency: TWD
        merchandiseTwd: 1000
        discountTwd: 100
        shippingTwd: 60
        totalTwd: 960
        feeVersion: fee_demo
        allocationVersion: alloc_demo
    Quote:
      type: object
      additionalProperties: false
      properties:
        id: *id011
        mode:
          const: mock
        expiresAt:
          type: string
          format: date-time
        snapshot:
          $ref: '#/components/schemas/PriceSnapshot'
      required:
      - id
      - mode
      - expiresAt
      - snapshot
      examples:
      - id: demo_value
        mode: mock
        expiresAt: '2026-10-13T03:41:59Z'
        snapshot:
          currency: TWD
          merchandiseTwd: 1000
          discountTwd: 100
          shippingTwd: 60
          totalTwd: 960
          feeVersion: fee_demo
          allocationVersion: alloc_demo
    CheckoutRequest:
      type: object
      additionalProperties: false
      properties:
        quoteId: *id011
        cartVersion: *id014
        contact:
          type: object
          additionalProperties: false
          properties:
            email:
              type: string
              format: email
              pattern: '@example\.test$'
              maxLength: 254
          required:
          - email
        delivery:
          type: object
          additionalProperties: false
          properties:
            method:
              enum:
              - mock_home
              - mock_pickup
            region:
              const: demo_supported
          required:
          - method
          - region
        confirmed:
          const: true
      required:
      - quoteId
      - cartVersion
      - contact
      - delivery
      - confirmed
      examples:
      - quoteId: demo_value
        cartVersion: demo_value
        contact:
          email: buyer@example.test
        delivery:
          method: mock_home
          region: demo_supported
        confirmed: true
    CheckoutCreated:
      type: object
      additionalProperties: false
      properties:
        checkoutId: *id011
        orderId: *id011
        mode:
          const: mock
        version: *id014
        expiresAt:
          type: string
          format: date-time
        snapshot:
          $ref: '#/components/schemas/PriceSnapshot'
        statusUrl:
          type: string
        capabilities:
          type: array
          items:
            enum:
            - checkout.read
            - checkout.pay
      required:
      - checkoutId
      - orderId
      - mode
      - version
      - expiresAt
      - snapshot
      - statusUrl
      - capabilities
      examples:
      - checkoutId: demo_value
        orderId: demo_value
        mode: mock
        version: demo_value
        expiresAt: '2026-10-13T03:41:59Z'
        snapshot:
          currency: TWD
          merchandiseTwd: 1000
          discountTwd: 100
          shippingTwd: 60
          totalTwd: 960
          feeVersion: fee_demo
          allocationVersion: alloc_demo
        statusUrl: demo_value
        capabilities: []
    CheckoutStatus:
      type: object
      additionalProperties: false
      properties:
        checkoutId: *id011
        mode:
          const: mock
        version: *id014
        orderState:
          enum:
          - AwaitingPayment
          - Confirmed
          - Cancelled
          - Expired
        paymentState:
          enum:
          - Created
          - Processing
          - Succeeded
          - Failed
          - Unknown
        compensationRequired:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        snapshot:
          $ref: '#/components/schemas/PriceSnapshot'
      required:
      - checkoutId
      - mode
      - version
      - orderState
      - paymentState
      - compensationRequired
      - expiresAt
      - snapshot
      examples:
      - checkoutId: demo_value
