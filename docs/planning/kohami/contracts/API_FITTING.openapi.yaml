          - Rendering
          - Ready
          - Failed
          - Expired
          - Revoked
        expiresAt:
          type: string
          format: date-time
        contentAvailable:
          type: boolean
        reasonCode:
          type: string
          enum:
          - NONE
          - RENDER_FAILED
          - RIGHTS_UNAVAILABLE
          - EXPIRED
          - FITTING_SUSPENDED
          - ASSET_MISSING
