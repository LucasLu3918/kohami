info:
  title: KOHAMI fitting/outfit/export supplemental proposal
  version: 0.1.0
  description: PROPOSED only. Fixed non-AI three-view reference; no canonical merge,
    real assets, rights assurance or executed product. Engine limits and identity
    additions unadopted.
servers:
- url: https://localhost:3000/api/v1
x-authority: PROPOSED
x-product-tests: NOT_EXECUTED
x-mfa-method-decision: ACCEPTED_PASSWORD_TOTP
x-input-baselines:
  docs/planning/kohami/contracts/API_M0.openapi.yaml: c3a6a1c86ca1631754ce3fd3c4ab0953d01b6cbd15d1c4a0db461a93dcb24fe2
  docs/planning/kohami/contracts/API_M1_M3.openapi.yaml: b5c8b08a885da7194b86723296d0205d59ff6de27271a28cc1e2dcfdea4be945
  docs/planning/kohami/contracts/API_TOTP_MFA.openapi.yaml: 8cf2fdf4e527a933b4b1c794d27e610cd7e6154781d8b315deac0a6369af52fc
