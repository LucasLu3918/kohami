components:
  schemas:
    Selection:
      type: object
      additionalProperties: false
      properties:
        avatarVariantId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
        bodyProfileRevisionId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
        skuId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
        avatarRevisionId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
        garmentRevisionId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
        alignmentRevisionId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
        compatibilityId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
        compatibilityVersion: *id001
        view: &id002
          type: string
          enum:
          - Front
          - Right
          - Back
      required:
      - avatarVariantId
      - bodyProfileRevisionId
      - skuId
      - avatarRevisionId
      - garmentRevisionId
      - alignmentRevisionId
      - compatibilityId
      - compatibilityVersion
      - view
      examples:
      - &id007
        avatarVariantId: avatar_female_a_demo
        bodyProfileRevisionId: body_demo_v1
        skuId: sku_demo_l
        avatarRevisionId: avatar_demo_v1
        garmentRevisionId: garment_demo_v1
        alignmentRevisionId: align_demo_v1
        compatibilityId: compat_demo
        compatibilityVersion: cv_demo_1
        view: Front
    ResolveInput:
      type: object
      additionalProperties: false
      properties:
        avatarVariantId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
        bodyProfileRevisionId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
        skuId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
        view: *id002
        clientSequence: &id003
          type: integer
          minimum: 0
          maximum: 9007199254740991
        requestNonce:
          type: string
          minLength: 16
          maxLength: 160
      required:
      - avatarVariantId
      - bodyProfileRevisionId
      - skuId
      - view
      - clientSequence
      - requestNonce
      examples:
      - &id009
        avatarVariantId: avatar_female_a_demo
        bodyProfileRevisionId: body_demo_v1
        skuId: sku_demo_l
        view: Front
        clientSequence: 2
        requestNonce: nonce_demo_binding_only
    ViewAsset:
      type: object
      additionalProperties: false
      properties:
        view: *id002
        assetId: &id011
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
      required:
      - view
      - assetId
      examples:
      - view: Front
        assetId: asset_front_demo
    RightsSummary:
      type: object
      additionalProperties: false
      properties:
        display:
          type: boolean
        transform:
          type: boolean
        download:
          type: boolean
      required:
      - display
      - transform
      - download
      examples:
      - &id004
        display: true
        transform: true
        download: false
    Reproduction:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - Reproducible
          - Unavailable
          - RightsUnavailable
          - ReplacementAvailable
        reasonCode: &id005
          type: string
          enum:
          - NONE
          - FITTING_SUSPENDED
          - UNSUPPORTED_COMBINATION
          - RIGHTS_UNAVAILABLE
          - ASSET_MISSING
          - ORIGINAL_UNAVAILABLE
        assets: &id006
          type: array
          items:
            $ref: '#/components/schemas/ViewAsset'
          maxItems: 3
        rights:
          $ref: '#/components/schemas/RightsSummary'
        replacementSelection:
          oneOf:
          - $ref: '#/components/schemas/Selection'
          - type: 'null'
        rightsEpoch: *id003
      required:
      - state
      - reasonCode
      - assets
      - rights
      - replacementSelection
      - rightsEpoch
      allOf:
      - if:
          properties:
            state:
              const: Reproducible
        then:
          properties:
            reasonCode:
              const: NONE
            assets:
              minItems: 3
              maxItems: 3
              allOf:
              - contains:
                  properties:
                    view:
                      const: Front
                  required:
                  - view
                minContains: 1
                maxContains: 1
              - contains:
                  properties:
                    view:
                      const: Right
                  required:
                  - view
                minContains: 1
                maxContains: 1
              - contains:
                  properties:
                    view:
                      const: Back
                  required:
                  - view
                minContains: 1
                maxContains: 1
            rights:
              properties:
                display:
                  const: true
            replacementSelection:
              type: 'null'
        else:
          properties:
            assets:
              maxItems: 0
            rights:
              properties:
                display:
                  const: false
                transform:
                  const: false
                download:
                  const: false
            reasonCode:
              not:
                const: NONE
      - if:
          properties:
            state:
              const: ReplacementAvailable
        then:
          properties:
            replacementSelection:
              $ref: '#/components/schemas/Selection'
            reasonCode:
              not:
                const: NONE
        else:
          properties:
            replacementSelection:
              type: 'null'
      examples:
      - &id012
        state: Reproducible
        reasonCode: NONE
        assets: &id008
        - view: Front
          assetId: asset_front_demo
        - view: Right
          assetId: asset_right_demo
        - view: Back
          assetId: asset_back_demo
        rights: *id004
        replacementSelection: null
        rightsEpoch: 1
    FittingAvailability:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - Supported
          - Unavailable
          - Unsupported
        reasonCode: *id005
        resolvedSelection:
          oneOf:
          - $ref: '#/components/schemas/Selection'
          - type: 'null'
        assets: *id006
        rights:
          $ref: '#/components/schemas/RightsSummary'
      required:
      - state
      - reasonCode
      - resolvedSelection
      - assets
      - rights
      allOf:
      - if:
          properties:
            state:
              const: Supported
        then:
          properties:
            reasonCode:
              const: NONE
            resolvedSelection:
              $ref: '#/components/schemas/Selection'
            assets:
              minItems: 3
              maxItems: 3
              allOf:
              - contains:
                  properties:
                    view:
                      const: Front
                  required:
                  - view
                minContains: 1
                maxContains: 1
              - contains:
                  properties:
                    view:
                      const: Right
                  required:
                  - view
                minContains: 1
                maxContains: 1
              - contains:
                  properties:
                    view:
                      const: Back
                  required:
                  - view
                minContains: 1
                maxContains: 1
            rights:
              properties:
                display:
                  const: true
        else:
          properties:
            assets:
              maxItems: 0
            resolvedSelection:
              type: 'null'
            rights:
              properties:
                display:
                  const: false
                transform:
                  const: false
                download:
                  const: false
            reasonCode:
              not:
                const: NONE
      examples:
      - &id010
        state: Supported
        reasonCode: NONE
        resolvedSelection: *id007
        assets: *id008
        rights: *id004
    ResolveResult:
      type: object
      additionalProperties: false
      properties:
        requested:
          $ref: '#/components/schemas/ResolveInput'
        clientSequence: *id003
        fitting:
          $ref: '#/components/schemas/FittingAvailability'
        productAvailability:
          type: string
          enum:
          - Purchasable
          - OutOfStock
          - Unavailable
        policyVersion: *id001
      required:
      - requested
      - clientSequence
      - fitting
      - productAvailability
      - policyVersion
      examples:
      - requested: *id009
        clientSequence: 2
        fitting: *id010
        productAvailability: OutOfStock
        policyVersion: demo_policy_unadopted
    Quota:
      type: object
      additionalProperties: false
      properties:
        configured:
          type: boolean
        policyVersion:
          type:
          - string
          - 'null'
          minLength: 1
        limit:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 9007199254740991
        count: *id003
      required:
      - configured
      - policyVersion
      - limit
      - count
      allOf:
      - if:
          properties:
            configured:
              const: false
        then:
          properties:
            limit:
              type: 'null'
            policyVersion:
              type: 'null'
        else:
          properties:
            limit:
