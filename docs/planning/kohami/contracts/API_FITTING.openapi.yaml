        view: *id002
        version: *id001
      required:
      - id
      - state
      - expiresAt
      - contentAvailable
      - reasonCode
      - rightsEpoch
      - view
      - version
      allOf:
      - if:
          properties:
            state:
              const: Ready
        then:
          properties:
            contentAvailable:
              const: true
            reasonCode:
              const: NONE
        else:
          properties:
            contentAvailable:
              const: false
      - if:
          properties:
            state:
              const: Revoked
        then:
          properties:
            reasonCode:
              enum:
              - RIGHTS_UNAVAILABLE
              - FITTING_SUSPENDED
              - ASSET_MISSING
      - if:
          properties:
            state:
              const: Expired
        then:
          properties:
            reasonCode:
              const: EXPIRED
      - if:
          properties:
            state:
              const: Failed
        then:
          properties:
            reasonCode:
              enum:
              - RENDER_FAILED
              - ASSET_MISSING
