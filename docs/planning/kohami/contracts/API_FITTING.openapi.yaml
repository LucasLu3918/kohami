  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: *id011
      description: Server識別；不能是本機path或任意URL。
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 300
      description: Antiforgery token；不得記錄secret。
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 300
      description: 同origin allowlist；跨域或無可信Origin拒絕。
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 100
      description: 作用域actor/browser＋dataset＋method/path；重送不延期限，先驗目前身份/權利。
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
      description: 對應資源GET ETag；與body expectedVersion同來源。
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
      description: ''
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 300
      description: 绑定actor/browser、dataset、filters／版本，非固定快照。
  responses:
    Error401:
      description: 有效身份不足
      headers:
        Cache-Control:
          schema:
            const: no-store
        Pragma:
          schema:
            const: no-cache
        X-Content-Type-Options:
          schema:
            const: nosniff
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error403:
      description: Origin/CSRF/權限不足
      headers:
        Cache-Control:
          schema:
            const: no-store
        Pragma:
          schema:
            const: no-cache
        X-Content-Type-Options:
          schema:
            const: nosniff
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error404:
      description: 不存在或跨actor，同形回應
      headers:
        Cache-Control:
          schema:
            const: no-store
        Pragma:
          schema:
            const: no-cache
        X-Content-Type-Options:
          schema:
            const: nosniff
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error409:
      description: 業務／權利／冪等／狀態衝突
      headers:
        Cache-Control:
          schema:
            const: no-store
        Pragma:
          schema:
            const: no-cache
        X-Content-Type-Options:
          schema:
            const: nosniff
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error410:
      description: 本actor匯出已過期或撤銷
      headers:
        Cache-Control:
          schema:
            const: no-store
        Pragma:
          schema:
            const: no-cache
        X-Content-Type-Options:
          schema:
            const: nosniff
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error412:
      description: 舊版本
      headers:
        Cache-Control:
          schema:
            const: no-store
        Pragma:
          schema:
            const: no-cache
        X-Content-Type-Options:
          schema:
            const: nosniff
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error422:
      description: 輸入不符
      headers:
        Cache-Control:
          schema:
            const: no-store
        Pragma:
          schema:
            const: no-cache
        X-Content-Type-Options:
          schema:
            const: nosniff
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error428:
      description: 缺必要版本前置
      headers:
        Cache-Control:
          schema:
            const: no-store
        Pragma:
          schema:
            const: no-cache
        X-Content-Type-Options:
          schema:
            const: nosniff
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error429:
      description: 限流
      headers:
        Cache-Control:
          schema:
            const: no-store
        Pragma:
          schema:
            const: no-cache
        X-Content-Type-Options:
          schema:
            const: nosniff
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: kohami.session
    FittingBrowserCookie:
      type: apiKey
      in: cookie
      name: kohami.fitting-browser
      description: 'Proposal: HttpOnly Secure SameSite Lax browser binding issued
        by GET /fitting/context; same browser identity as CSRF, not a member/admin
        authorization. Login/logout/actor changes rotate binding and invalidate old
        guest exports.'
