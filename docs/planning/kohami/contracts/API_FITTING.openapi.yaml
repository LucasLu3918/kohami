x-identity-overlay: docs/planning/kohami/fitting/FITTING_IDENTITY_OVERLAY.yaml
x-provisional-engineering:
  exportTtlSeconds: 300
  maxLongEdgePixels: 2048
  maxConcurrentPerActor: 1
  limitsAdopted: false
x-server-invariants:
- Current actor/browser+dataset authorization precedes every lookup/replay; no username/body
  ownership input.
- Current rights and revision gates before rendering and each byte delivery; old Ready
  not a bypass.
- Original saved selection immutable; replacement creates new resource and quota reservation
  atomically.
- Resolve does not allocate stock or change cart size; server validates complete view
  set and references.
- ETag/body expectedVersion target same aggregate; current state and evidence checked
  transactionally.
- Unknown identity overlay permissions/purposes denied; Owner role alone not permission.
- Current public resolve chooses only current Approved revisions; retired revisions
  only via explicit owned original outfit flow.
