openapi: 3.1.0
info:
  title: KOHAMI asset workflow supplemental proposal
  version: 0.1.0
  description: PROPOSED only; no product or actual PNG/rights/SQL execution. New resources
    Draft/Pending; new event union not active. Existing five APIs preserved.
servers:
- url: https://localhost:3000/api/v1
x-authority: PROPOSED
x-product-tests: NOT_EXECUTED
x-mfa-method-decision: ACCEPTED_PASSWORD_TOTP
x-identity-overlay-activation: BLOCKED_UNTIL_ADOPTION_CANONICAL_AND_RUNTIME_CHECKS
