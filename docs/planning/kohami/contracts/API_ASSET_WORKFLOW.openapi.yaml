  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: *id004
      description: Server識別；不能是本機path或任意URL。
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 300
      description: Antiforgery token；不得記錄secret。
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 300
      description: 同origin allowlist；跨域或無可信Origin拒絕。
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 100
      description: 作用域actor/browser＋dataset＋method/path；重送不延期限，先驗目前身份/權利。
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
      description: 對應資源GET ETag；與body expectedVersion同來源。
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
      description: ''
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 300
      description: 绑定actor/browser、dataset、filters／版本，非固定快照。
    View:
      name: view
      in: path
      required: true
      schema: *id008
      description: 固定三視圖slot；不接受其他路徑。
    RightsId:
      name: rightsId
      in: path
      required: true
      schema: *id004
      description: 必須屬path內AssetRevision；非獨立跨素材讀取。
    SourceHash:
      name: X-Source-SHA256
      in: header
      required: true
      schema: *id003
      description: client聲稱原始hash，server重新計算bytes，差異拒絕；不代替decode。
  responses:
    Error401:
      description: 有效身份不足
      headers:
        Cache-Control:
          schema:
            const: no-store
        Pragma:
          schema:
            const: no-cache
        X-Content-Type-Options:
          schema:
            const: nosniff
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error403:
      description: Origin/CSRF/權限不足
      headers:
        Cache-Control:
          schema:
            const: no-store
        Pragma:
          schema:
            const: no-cache
        X-Content-Type-Options:
          schema:
            const: nosniff
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error404:
      description: 不存在或跨actor，同形回應
      headers:
        Cache-Control:
          schema:
            const: no-store
        Pragma:
          schema:
            const: no-cache
        X-Content-Type-Options:
          schema:
            const: nosniff
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error409:
      description: 業務／權利／冪等／狀態衝突
      headers:
        Cache-Control:
          schema:
            const: no-store
        Pragma:
          schema:
            const: no-cache
        X-Content-Type-Options:
          schema:
            const: nosniff
      content:
