x-event-additions:
  AlignmentCandidateCreated: Alignment
  CompatibilityDraftCreated: Compatibility
  AssetRightsConfirmed: AssetRevision
x-engineering-limits-adopted: false
x-server-invariants:
- Original grant/proof enums unchanged; actual Owner/scoped grant/recent proof checked
  before lookup/replay.
- Policy configured; source/BodyProfile/preset/evidence IDs exist in same Dataset/allowlisted
  shared scope.
- Independent slot If-Match; parent Session Receiving/state lock, upload source hash
  and slot lineage validated before commit.
- Completion locks latest Session version and all slots; acceptance unique(dataset,session),
  immutable files, SQL/outbox boundary.
- Alignment candidate before garment import avoids circular references; Candidate
  not production approval.
- Rights only Pending on create; ConfirmActive requires review, valid interval and
  exact AssetRevision proof; terminal record never reactivated.
- Compatibility create Draft only; each expected reference version and identity checked
  atomically; publication separately reviews.
- WorkflowEvent additions blocked until canonical event registry and consumer integrations.
