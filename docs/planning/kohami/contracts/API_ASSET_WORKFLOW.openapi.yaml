            type: string
            enum:
            - Front
            - Right
            - Back
          minItems: 0
          maxItems: 3
          uniqueItems: true
        cleanupState:
          type: string
          enum:
          - NotRequired
          - Pending
          - Completed
          - Failed
      required:
      - id
      - state
      - version
      - rightsState
      - rights
      - evidenceReferences
      - views
      - cleanupState
      examples:
      - &id007
        id: asset_revision_demo
        state: Draft
        version: av_demo_1
        rightsState: Pending
        rights:
          display: false
          transform: false
          download: false
        evidenceReferences: []
        views: []
        cleanupState: NotRequired
    RightsSummary:
      type: object
