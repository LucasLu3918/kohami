            pattern: '[^A-Za-z0-9_-]'
        assetKind:
          type: string
          enum:
          - AvatarViewSet
          - GarmentViewSet
        avatarVariantId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
          not:
            pattern: '[^A-Za-z0-9_-]'
        bodyProfileRevisionId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
          not:
            pattern: '[^A-Za-z0-9_-]'
        skuId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
          not:
            pattern: '[^A-Za-z0-9_-]'
        alignmentRevisionId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
          not:
            pattern: '[^A-Za-z0-9_-]'
        sourceKind:
          type: string
          enum:
          - ArtistIllustration
          - LicensedModelAsset
          - MannequinCapture
        sourceEvidenceRefs:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[A-Za-z0-9_-]+$
            not:
              pattern: '[^A-Za-z0-9_-]'
          minItems: 1
          maxItems: 20
          uniqueItems: true
        rightsEvidenceRefs:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: ^[A-Za-z0-9_-]+$
            not:
              pattern: '[^A-Za-z0-9_-]'
          minItems: 1
          maxItems: 20
          uniqueItems: true
        nonAiAttestation:
          const: true
        files:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            properties:
              view:
                type: string
                enum:
                - Front
                - Right
                - Back
              slotId:
                type: string
                minLength: 1
                maxLength: 100
                pattern: ^[A-Za-z0-9_-]+$
                not:
                  pattern: '[^A-Za-z0-9_-]'
              declaredSourceSha256:
                type: string
                pattern: ^[a-f0-9]{64}$
                minLength: 64
                maxLength: 64
              declaredBytes:
                type: integer
                minimum: 1
                maximum: 10485760
              declaredWidth:
                type: integer
                minimum: 1
                maximum: 4096
              declaredHeight:
                type: integer
                minimum: 1
                maximum: 4096
              mediaType:
                const: image/png
            required:
            - view
            - slotId
            - declaredSourceSha256
            - declaredBytes
            - declaredWidth
            - declaredHeight
            - mediaType
          allOf:
          - contains:
              properties:
                view:
                  const: Front
              required:
              - view
            minContains: 1
            maxContains: 1
          - contains:
              properties:
                view:
                  const: Right
              required:
              - view
            minContains: 1
            maxContains: 1
          - contains:
              properties:
                view:
                  const: Back
              required:
              - view
            minContains: 1
            maxContains: 1
      required:
      - schemaVersion
      - importSessionId
      - assetKind
      - avatarVariantId
      - bodyProfileRevisionId
      - sourceKind
      - sourceEvidenceRefs
      - rightsEvidenceRefs
      - nonAiAttestation
      - files
