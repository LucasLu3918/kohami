x-server-invariants:
- Current Active user, effective grant, SecurityVersion and resource scope checked
  each request.
- Enrollment proof uses parent stage/session and its pending credential; recoveryVerified
  is server epoch, never client flag.
- TOTP matched step consumption is shared across flows and committed atomically with
  challenge and issuance state.
- Sensitive response lost means new issuance procedure, never read-back or secret
  replay.
- Recent proof binds session, purpose/resource and nonce; no cross-purpose authority.
