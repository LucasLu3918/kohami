components:
  schemas:
    Context:
      type: object
      additionalProperties: false
      properties:
        stage:
          type: string
          enum:
          - AdminPasswordVerified
          - AdminMfaVerified
          - RecoveryRebind
          - RebindRequired
        userId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
        mfaEnabled:
          type: boolean
        canEnroll:
          type: boolean
        canRecover:
          type: boolean
        challengeId:
          type:
          - string
          - 'null'
        challengeExpiresAt:
          type:
          - string
          - 'null'
          format: date-time
        expiresAt:
          type: string
          format: date-time
        version:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9_-]+$
        mode:
          const: mock
        requestNonce:
          type: string
          minLength: 16
          maxLength: 160
        recentProofs:
          type: array
          items:
            $ref: '#/components/schemas/RecentProof'
        recoveryVerified:
          type: boolean
        activeCredentialId:
          type:
          - string
          - 'null'
      required:
      - stage
      - userId
      - mfaEnabled
      - canEnroll
      - canRecover
      - challengeId
      - challengeExpiresAt
      - expiresAt
      - version
      - mode
      - requestNonce
      - recentProofs
      - recoveryVerified
      - activeCredentialId
      examples:
      - stage: AdminPasswordVerified
        userId: user_demo_owner
        mfaEnabled: true
        canEnroll: false
        canRecover: true
        challengeId: challenge_demo
        challengeExpiresAt: '2026-10-13T07:05:00Z'
        expiresAt: '2026-10-13T07:05:00Z'
        version: v1
        mode: mock
        requestNonce: nonce_demo_1234567890
        recentProofs: []
        recoveryVerified: false
        activeCredentialId: credential_demo
    EnrollmentRequest:
      type: object
      additionalProperties: false
      properties:
        requestNonce:
          type: string
          minLength: 16
          maxLength: 160
