      - name: X-CSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 4096
        description: 所有cookie寫入需antiforgery＋Origin檢查；proof不替代CSRF。
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
        description: Dataset＋stable actor/capability＋kind＋resource；同payload回原結果，授權仍每次驗。
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
          pattern: ^"[^" ]+"$
        description: 強ETag；需與expectedVersion一致；新資源route亦可能鎖原Order/SKU/dataset，依x-version-target。
      responses:
        '201':
          description: 成功；業務狀態依可信讀模型
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'Private/challenge/command: no-store；public read可有按dataset/locale/revision失效的cache。'
            ETag:
              schema:
                type: string
                pattern: ^"[^" ]+"$
              description: 強ETag含引號；body.version未加引號，聚合子狀態改變即更新。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          description: 身份不足
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                const: no-store
        '403':
          description: 權限／CSRF不足
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                const: no-store
        '404':
          description: 無資源或無scope的一致回應
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                const: no-store
        '422':
          description: 欄位錯誤
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                const: no-store
        '429':
          description: 限流
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                const: no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: 重試秒數；不允許重發Unknown金融command。
        '500':
          description: 安全內部錯誤
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                const: no-store
        '409':
          description: 業務／idempotency內容衝突
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
                const: no-store
        '412':
          description: 舊版本
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Cache-Control:
              schema:
