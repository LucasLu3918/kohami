openapi: 3.1.0
info:
  title: KOHAMI account and access supplemental proposal
  version: 0.1.0
  description: Account lifecycle and access grants PROPOSED; authentication hardening is optional. Supplemental
    scope; no canonical merged API or product execution.
servers:
- url: https://localhost:3000/api/v1
x-authority: PROPOSED
x-product-tests: OUT_OF_SCOPE_OPTION
x-role-permission-allowlist:
  Owner:
  - access.read
  - access.manage
  - user.read
  - user.manage
  - orders.read
  - refund.request
  - refund.execute
  - refund.check
  - shipment.manage
  - return.inspect
  - catalog.write
  - stock.adjust
  - shipping.configure
  - audit.read
  - reconciliation.read
  - reconciliation.run
  - reconciliation.check
  - reconciliation.resolve
  - reports.read
  - support.respond
  - data.handle
  - demo.control
  - demo.reset
  Merchandiser:
  - catalog.write
  - stock.adjust
  CustomerSupport:
  - orders.read
  - refund.request
  - refund.check
  - shipment.manage
  - return.inspect
  - support.respond
  - reconciliation.read
  Analyst:
  - reports.read
x-server-invariants:
- Current dataset/actor/permission/resource scope checked before business replay.
- Grant only subset of actor effective grantable scope; no self-grant; finite end
  time.
- Last Owner check serialized across dataset management changes.
- Public receipt does not reveal account/challenge/delivery existence.
- validFrom < validUntil; expectedAccessVersion and If-Match must resolve to same
  target access revision.
paths:
  /auth/account-context:
    get:
      operationId: getAccountBrowserContext
      x-trace-op: ACCT-03
      description: 建立/讀匿名Browser-bound nonce；不含Email/User/challenge existence，不能取得會員權。
      security:
      - {}
      x-authorization:
        stage: public
        businessIdempotency: false
      x-product-tests: OUT_OF_SCOPE_OPTION
      responses:
        '200':
          description: 成功，仍屬mock/提案
          headers:
            Cache-Control:
              schema:
                const: no-store
            Set-Cookie:
              schema:
                type: string
              description: 取得匿名Browser或清除管理/member/stage cookie；JSON不回rawcookie。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAccountContext'
        '401':
          description: 有效session不足
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: CSRF/Origin/角色不足
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 資源不存在或不可閱
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 業務/重送衝突或LAST_OWNER_PROTECTED
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: 舊版本
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 欄位或一般proof失敗
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: 必要header不足
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: 限流
          headers:
            Cache-Control:
              schema:
                const: no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 內部失敗
          headers:
            Cache-Control:
