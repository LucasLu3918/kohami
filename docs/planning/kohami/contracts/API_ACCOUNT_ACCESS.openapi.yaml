          type: string
          format: date-time
        mode:
          const: mock
      required:
      - requestNonce
      - expiresAt
      - mode
      examples:
      - requestNonce: nonce_demo_1234567890
        expiresAt: '2026-10-13T08:00:00Z'
        mode: mock
    UniformReceipt:
      type: object
      additionalProperties: false
      properties:
        accepted:
          const: true
        messageCode:
          const: REQUEST_ACCEPTED
      required:
      - accepted
      - messageCode
      examples:
      - accepted: true
        messageCode: REQUEST_ACCEPTED
    RegistrationRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          pattern: '@example\.test$'
        password:
          type: string
          minLength: 15
          maxLength: 256
          writeOnly: true
          x-sensitive: true
        privacyNoticeVersion:
          type: string
          minLength: 1
          maxLength: 160
        acknowledgedPrivacyNotice:
          const: true
        requestNonce:
          type: string
          minLength: 16
          maxLength: 160
      required:
      - email
      - password
      - privacyNoticeVersion
      - acknowledgedPrivacyNotice
      - requestNonce
      x-sensitive-schema: true
    VerificationResendRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          pattern: '@example\.test$'
        requestNonce:
          type: string
          minLength: 16
          maxLength: 160
      required:
      - email
      - requestNonce
      examples:
      - email: buyer@example.test
        requestNonce: nonce_demo_1234567890
    ContactProof:
