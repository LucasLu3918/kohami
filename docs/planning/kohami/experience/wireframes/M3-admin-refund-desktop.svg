<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title"><title id="title">M3管理退款線框，原商品部分退款425，Unknown保留553與其他收款補償獨立，無交易功能</title><style>text{font-family:"PingFang TC","Microsoft JhengHei",sans-serif}</style><rect width="100%" height="100%" fill="#FAF7F2"/><rect x="0" y="0" width="1440" height="42" rx="8" fill="#83334F" stroke="#83334F"/><text x="40" y="27" font-size="16" fill="white" font-weight="400">管理退款規劃線框 · 全流程 mock，無實際資金移動</text><text x="1040" y="27" font-size="14" fill="white" font-weight="400">Owner（示意）／需有效權限與近期 MFA</text><text x="40" y="98" font-size="29" fill="#262326" font-weight="600">KOHAMI / 營運後台</text><text x="40" y="150" font-size="23" fill="#262326" font-weight="600">案件 CASE-UNIT-A / 原單 DEMO-01</text><text x="40" y="180" font-size="16" fill="#5F5860" font-weight="400">原商品部分退貨 · 案件與金額由後端核對，不能直接改退款終態。</text><rect x="40" y="212" width="840" height="145" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><text x="64" y="247" font-size="18" fill="#262326" font-weight="600">原有效收款來源：collection_primary_demo</text><text x="64" y="285" font-size="15" fill="#5F5860" font-weight="400">已確認模擬實收</text><text x="64" y="326" font-size="25" fill="#83334F" font-weight="600">TWD 1,590</text><text x="263" y="285" font-size="15" fill="#5F5860" font-weight="400">已完成退款</text><text x="263" y="326" font-size="25" fill="#83334F" font-weight="600">TWD 552</text><text x="455" y="285" font-size="15" fill="#5F5860" font-weight="400">待確認保留</text><text x="455" y="326" font-size="25" fill="#83334F" font-weight="600">TWD 553</text><text x="649" y="285" font-size="15" fill="#5F5860" font-weight="400">來源剩餘額度</text><text x="649" y="326" font-size="25" fill="#83334F" font-weight="600">TWD 485</text><text x="40" y="398" font-size="21" fill="#262326" font-weight="600">原商品單位與退款占用</text><rect x="40" y="417" width="840" height="217" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><text x="64" y="450" font-size="15" fill="#5F5860" font-weight="400">原單位 / SKU</text><text x="420" y="450" font-size="15" fill="#5F5860" font-weight="400">原實付</text><text x="570" y="450" font-size="15" fill="#5F5860" font-weight="400">狀態</text><text x="741" y="450" font-size="15" fill="#5F5860" font-weight="400">本次選取</text><text x="64" y="495" font-size="16" fill="#262326" font-weight="400">A-0 / 柔織上衣 奶油白 M</text><text x="420" y="495" font-size="16" fill="#262326" font-weight="400">TWD 425</text><text x="570" y="495" font-size="16" fill="#5F5860" font-weight="400">未占用</text><text x="741" y="495" font-size="16" fill="#262326" font-weight="400">✓ 1 件</text><text x="64" y="542" font-size="16" fill="#262326" font-weight="400">B-0 / 日常針織衫 灰色 M</text><text x="420" y="542" font-size="16" fill="#262326" font-weight="400">TWD 552</text><text x="570" y="542" font-size="16" fill="#5F5860" font-weight="400">已完成退款</text><text x="741" y="542" font-size="16" fill="#262326" font-weight="400">不可再退</text><text x="64" y="589" font-size="16" fill="#262326" font-weight="400">B-1 / 日常針織衫 灰色 M</text><text x="420" y="589" font-size="16" fill="#262326" font-weight="400">TWD 553</text><text x="570" y="589" font-size="16" fill="#83334F" font-weight="400">退款待確認</text><text x="741" y="589" font-size="16" fill="#262326" font-weight="400">不可再退</text><rect x="40" y="658" width="840" height="106" rx="8" fill="#F6EDF1" stroke="#B68899"/><text x="64" y="691" font-size="19" fill="#83334F" font-weight="600">剩餘 485 不等於本案件可任意退 485。</text><text x="64" y="723" font-size="16" fill="#262326" font-weight="400">本次只選 A-0：425；原運費 60 尚未退，但此部分退貨案不含運費退款資格。</text><text x="64" y="748" font-size="14" fill="#5F5860" font-weight="400">退款完成不自動回補庫存；退回驗收與憑證調整另外處理。</text><text x="40" y="809" font-size="17" fill="#262326" font-weight="600">原因（合成範例）</text><rect x="40" y="826" width="840" height="74" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><text x="64" y="870" font-size="17" fill="#262326" font-weight="400">已受理 A-0 的部分退貨；其他原單位與待確認退款保持原狀態。</text><rect x="916" y="212" width="484" height="485" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><text x="940" y="250" font-size="25" fill="#262326" font-weight="600">本次確認</text><text x="940" y="292" font-size="17" fill="#262326" font-weight="400">來源：原商品退款</text><text x="940" y="326" font-size="17" fill="#262326" font-weight="400">品項：A-0 × 1</text><text x="940" y="360" font-size="17" fill="#262326" font-weight="400">原運費：本次不退</text><text x="940" y="408" font-size="35" fill="#83334F" font-weight="600">TWD 425</text><text x="940" y="445" font-size="16" fill="#5F5860" font-weight="400">確認後先顯示模擬退款處理中。</text><text x="940" y="473" font-size="16" fill="#5F5860" font-weight="400">未知結果保留額度，不另建一筆。</text><rect x="940" y="503" width="436" height="58" rx="8" fill="#83334F" stroke="#83334F"/><text x="1088" y="539" font-size="19" fill="white" font-weight="400">確認模擬退款</text><text x="940" y="595" font-size="16" fill="#83334F" font-weight="400">近期 MFA 過期：先重新驗證。</text><text x="940" y="624" font-size="16" fill="#5F5860" font-weight="400">此線框不代表 MFA 已實作。</text><text x="940" y="653" font-size="16" fill="#5F5860" font-weight="400">前端按鈕不能取代後端授權。</text><rect x="916" y="721" width="484" height="179" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><text x="940" y="759" font-size="20" fill="#262326" font-weight="600">其他來源獨立核對</text><text x="940" y="792" font-size="16" fill="#262326" font-weight="400">額外收款 1,590 → 已模擬補償 1,590</text><text x="940" y="822" font-size="16" fill="#5F5860" font-weight="400">未消耗原商品退款單位／庫存。</text><text x="940" y="853" font-size="15" fill="#5F5860" font-weight="400">同收款來源的重複通知不算多收一筆。</text><text x="940" y="878" font-size="15" fill="#5F5860" font-weight="400">補償案件不能改寫原商品憑證。</text><text x="40" y="947" font-size="15" fill="#83334F" font-weight="400">SCR-09C · 靜態提案；付款、退款、庫存、憑證與案件結案各自有可驗證狀態。</text></svg>