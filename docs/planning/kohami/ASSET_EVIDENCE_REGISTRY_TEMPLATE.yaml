guards:
- Reference and nonAiAttestation are not proof or approval.
- Website fitting grants do not authorize private evidence content.
- Cross-dataset and escaping filesystem references rejected.
- Review binds exact versions and actual hashes; Unknown is not Pass.
- Invalidation gates before asynchronous fanout; unreadable authority denies delivery.
- Supersession preserves lawful originals; terminal exports do not revive.
- Restore requires objects, key dependencies and post-cutoff ledger.
