<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title"><title id="title">M1桌面商品線框；合成商品，選定SKU後的狀態，非完成網站</title><style>text{font-family:'PingFang TC','Microsoft JhengHei',sans-serif;fill:#262326} .muted{fill:#5F5860} .accent{fill:#83334F} .white{fill:white} .label{font-size:15px} .small{font-size:13px} .body{font-size:18px} .bold{font-weight:600}</style><rect width="100%" height="100%" fill="#FAF7F2"/><rect x="0" y="0" width="1440" height="42" rx="0" fill="#83334F" stroke="#83334F"/><text x="70" y="27" font-size="16" class="white">規劃線框 · 展示環境，無實際交易</text><text x="1085" y="27" font-size="14" class="white">M1 / SCR-03 / DESKTOP</text><text x="70" y="102" font-size="32" class="bold">KOHAMI</text><text x="335" y="100" font-size="18" class="">商品</text><text x="410" y="100" font-size="18" class="">尺寸與說明</text><text x="1080" y="100" font-size="16" class="">繁中  /  日本語  /  EN</text><text x="1320" y="100" font-size="16" class="">購物車</text><path d="M70,127H1370" stroke="#D8D0D5"/><text x="70" y="166" font-size="15" class="muted">商品  /  上衣  /  柔織上衣（示意）</text><rect x="70" y="200" width="660" height="520" rx="8" fill="#EAE5E8" stroke="#D8D0D5"/><text x="240" y="443" font-size="34" class="muted">商品素材占位</text><text x="236" y="480" font-size="18" class="muted">非實物照片 · 無已驗證換裝素材</text><rect x="70" y="740" width="140" height="85" rx="8" fill="#EAE5E8" stroke="#D8D0D5"/><text x="103" y="787" font-size="16" class="muted">示意縮圖</text><rect x="222" y="740" width="140" height="85" rx="8" fill="#EAE5E8" stroke="#D8D0D5"/><text x="255" y="787" font-size="16" class="muted">示意縮圖</text><rect x="374" y="740" width="140" height="85" rx="8" fill="#EAE5E8" stroke="#D8D0D5"/><text x="407" y="787" font-size="16" class="muted">示意縮圖</text><rect x="526" y="740" width="140" height="85" rx="8" fill="#EAE5E8" stroke="#D8D0D5"/><text x="559" y="787" font-size="16" class="muted">示意縮圖</text><text x="780" y="227" font-size="14" class="accent">合成商品 / SKU 已由使用者明確選定</text><text x="780" y="278" font-size="34" class="bold">柔織上衣（示意）</text><text x="780" y="326" font-size="28" class="bold">TWD 500</text><text x="780" y="365" font-size="16" class="muted">價格與量測為合成資料，非正式販售條件。</text><path d="M780,388H1370" stroke="#D8D0D5"/><text x="780" y="426" font-size="17" class="bold">顏色</text><rect x="780" y="448" width="132" height="48" rx="8" fill="#F3E8ED" stroke="#83334F"/><text x="800" y="478" font-size="17" class="accent">奶油白</text><text x="780" y="535" font-size="17" class="bold">衣服尺碼</text><rect x="780" y="553" width="80" height="48" rx="8" fill="#83334F" stroke="#83334F"/><text x="812" y="584" font-size="18" class="white">M</text><rect x="876" y="553" width="105" height="48" rx="8" fill="#F0EEEE" stroke="#D8D0D5"/><text x="900" y="584" font-size="17" class="muted">L 缺貨</text><text x="780" y="639" font-size="17" class="">已選：奶油白 / M　 ·　示意可售庫存 3</text><text x="780" y="676" font-size="17" class="accent">查看尺寸與量測 →</text><rect x="780" y="700" width="590" height="56" rx="8" fill="#83334F" stroke="#83334F"/><text x="994" y="735" font-size="19" class="white">加入購物車（線框）</text><text x="780" y="791" font-size="16" class="muted">購物車不保留庫存；結帳會重新確認價格與數量。</text><rect x="70" y="854" width="1300" height="88" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><text x="94" y="887" font-size="19" class="bold">換裝素材尚未驗證</text><text x="94" y="919" font-size="16" class="muted">保留商品資訊與尺寸資料入口；不因示意圖片成功載入就公告換裝資格。</text><text x="780" y="916" font-size="15" class="accent">這是選定後狀態；初次進入不自選尺碼。</text></svg>