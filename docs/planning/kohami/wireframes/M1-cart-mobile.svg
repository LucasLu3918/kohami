<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1180" viewBox="0 0 390 1180" role="img" aria-labelledby="title"><title id="title">M1手機購物車線框；三個合成商品單位，總額1590，無交易功能</title><style>text{font-family:'PingFang TC','Microsoft JhengHei',sans-serif;fill:#262326} .muted{fill:#5F5860} .accent{fill:#83334F} .white{fill:white} .label{font-size:15px} .small{font-size:13px} .body{font-size:18px} .bold{font-weight:600}</style><rect width="100%" height="100%" fill="#FAF7F2"/><rect x="0" y="0" width="390" height="45" rx="0" fill="#83334F" stroke="#83334F"/><text x="16" y="28" font-size="15" class="white">規劃線框 · 展示環境，無實際交易</text><text x="16" y="93" font-size="28" class="bold">KOHAMI</text><text x="281" y="92" font-size="15" class="">繁中 ▾</text><path d="M16,114H374" stroke="#D8D0D5"/><text x="16" y="158" font-size="30" class="bold">購物車</text><text x="16" y="188" font-size="15" class="muted">尚未保留庫存；結帳會再次確認。</text><rect x="16" y="215" width="358" height="161" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><rect x="30" y="233" width="86" height="104" rx="8" fill="#EAE5E8" stroke="#D8D0D5"/><text x="43" y="290" font-size="16" class="muted">占位圖</text><text x="131" y="247" font-size="17" class="bold">柔織上衣（示意）</text><text x="131" y="278" font-size="15" class="muted">奶油白 / M</text><rect x="131" y="296" width="103" height="36" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><text x="143" y="320" font-size="15" class="">數量 1</text><text x="245" y="320" font-size="15" class="accent">移除</text><text x="131" y="358" font-size="18" class="bold">TWD 500</text><rect x="16" y="395" width="358" height="161" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><rect x="30" y="413" width="86" height="104" rx="8" fill="#EAE5E8" stroke="#D8D0D5"/><text x="43" y="470" font-size="16" class="muted">占位圖</text><text x="131" y="427" font-size="17" class="bold">日常針織衫（示意）</text><text x="131" y="458" font-size="15" class="muted">灰色 / M</text><rect x="131" y="476" width="103" height="36" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><text x="143" y="500" font-size="15" class="">數量 2</text><text x="245" y="500" font-size="15" class="accent">移除</text><text x="131" y="538" font-size="18" class="bold">TWD 1,300</text><text x="16" y="590" font-size="16" class="bold">單一示意優惠碼</text><rect x="16" y="607" width="249" height="47" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><text x="30" y="637" font-size="17" class="">DEMO15</text><rect x="275" y="607" width="99" height="47" rx="8" fill="#F3E8ED" stroke="#83334F"/><text x="301" y="637" font-size="17" class="accent">套用</text><text x="16" y="684" font-size="16" class="">模擬配送：宅配 / 示意支援區域</text><text x="16" y="713" font-size="14" class="muted">商品與運費為合成資料，非正式報價。</text><rect x="16" y="737" width="358" height="226" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><text x="32" y="773" font-size="17" class="">商品小計</text><text x="238" y="773" font-size="17" class="">TWD 1,800</text><text x="32" y="810" font-size="17" class="">示意優惠</text><text x="238" y="810" font-size="17" class="accent">− TWD 270</text><text x="32" y="847" font-size="17" class="">示意運費</text><text x="238" y="847" font-size="17" class="">TWD 60</text><path d="M32,869H358" stroke="#D8D0D5"/><text x="32" y="910" font-size="21" class="bold">合計</text><text x="236" y="910" font-size="21" class="bold">TWD 1,590</text><text x="32" y="944" font-size="13" class="muted">原單位分攤與費用版本由伺服器保存。</text><rect x="16" y="986" width="358" height="55" rx="8" fill="#83334F" stroke="#83334F"/><text x="130" y="1021" font-size="18" class="white">確認費用（線框）</text><text x="16" y="1072" font-size="15" class="muted">費用或庫存變動時保留購物車，</text><text x="16" y="1096" font-size="15" class="muted">重新報價，不替顧客自動接受新總額。</text><text x="16" y="1150" font-size="13" class="accent">M1 / SCR-04A · 靜態規劃，按鈕不執行交易</text></svg>