  - docs/README.md
  summary: 'Issue 21 invoice and refund adjustments: close only the accepted local
    mock DEMO receipt/refund adjustment acceptance gaps, keep tax-effect none and
    customer ownership, document/verify Issue 21 and advance plan.'
  risk_class: private_leaf
inputs:
- Existing customer-owned Order and /receipts response; no API contract change.
outputs:
- Storefront renders the server-provided DEMO receipt and adjustment IDs, states, and TWD amounts.
- Issue 21 verification and plan state reflect the demonstrated local mock scope.
data:
- No persistence/schema/migration change. Existing Commerce SQL acceptance evidence is referenced, not rerun.
events: []
consumers:
- apps/storefront/app/pages/index.vue receipt query/render path (reviewed, unchanged).
- src/Modules/Commerce/Presentation/CommerceEndpoints.cs GET /orders/{id}/receipts (reviewed, unchanged).
security_boundaries:
- Existing order-owner authorization and demo_m0 dataset scoping; no authorization behavior change.
invariants:
- Demo receipts and adjustments remain mode=mock with taxEffect=none.
- Refund adjustment amount follows the succeeded refund; adjustment retry cannot execute the refund again.
- The customer sees only their order's receipt/adjustment data.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Acceptance and documentation only; runtime API/data/event behavior is unchanged.
tests:
- Targeted Playwright acceptance with synthetic API responses; no SQL or external provider.
- Storefront typecheck.
- Existing Issue 20 dedicated Commerce SQL harness evidence covers refund/adjustment independence, Unknown retry, and single adjustment; not rerun for this UI-only change.
