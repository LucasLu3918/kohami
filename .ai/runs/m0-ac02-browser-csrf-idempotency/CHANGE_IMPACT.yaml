  summary: 'M0-AC02: preserve anonymous command identity and cart idempotency across
    Browser ID and CSRF rotation; add source-bound browser/API/SQL acceptance and
    update status and evidence'
  risk_class: security_boundary
inputs:
- Same-origin POST /api/v1/carts with CSRF token and Idempotency-Key.
- Signed kohami.command cookie issued by GET /api/v1/auth/csrf; stable for 30 days independently of Browser ID and antiforgery cookie rotation.
outputs:
- Replay of the original createCart response and cart access after Browser ID/CSRF rotation.
- Invalid CSRF token or Origin remains 403 CSRF_INVALID and writes no idempotency record.
data:
- Existing m0commerce.Idempotency Actor now uses the stable command actor for createCart.
- Existing m0commerce.Documents Cart OwnerId uses that same command actor; no schema or fixture changes.
events: []
consumers:
- Nuxt same-origin API proxy continues forwarding cookies and request headers without contract changes.
- Commerce cart/current and cart owner authorization resolve the stable command actor, with Browser ID compatibility fallback when command cookie is absent.
- Issue06 dedicated-fixture acceptance runner and browser acceptance.
security_boundaries:
- kohami.command is signed, HttpOnly, Secure under HTTPS, SameSite=Lax and has a 30-day expiry; it identifies an anonymous command actor but grants access only to that actor's cart.
- Antiforgery token and same-origin Origin checks remain required for state-changing cart requests.
invariants:
- Same command actor, scope, idempotency key, and request hash replay the original cart response across Browser ID/CSRF rotation.
- A wrong CSRF token or Origin cannot create cart/idempotency writes.
- Rotating Browser ID does not revoke access to an existing cart owned by the stable command actor.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - No public route, request/response shape, schema, or existing cookie contract is removed; a signed HttpOnly command cookie is added.
  - Existing carts owned by Browser ID remain readable through the compatibility fallback when kohami.command is absent.
tests:
- Playwright M0-AC02 acceptance proves lost-response replay after Browser/CSRF rotation, cart read access, and token/Origin rejection.
- Dedicated Issue06 SQL fixture verifies exactly one cart/idempotency row, no rows for rejected requests, and exact synthetic cleanup plus Maintenance restoration.
- API and Commerce Release builds, storefront typecheck, Python compilation, and runner regression tests.
- Full Commerce harness limitation is recorded: existing sku_demo_01 fixture stock is zero while its catalog isolation assertion expects InStock; no fixture reset or inventory mutation was performed.
observability:
- Runner reports each acceptance phase and SQL verification/cleanup result; synthetic evidence and fixture-window state are private ephemeral files removed during teardown.
documentation:
- Update M0-AC02 status and architecture verification with exact acceptance evidence, TDD red/green, cleanup, and full-suite limitation.
- Refresh affected Project Intelligence sources and index; preserve partial repository-wide Impact Graph coverage because traversal stopped on retrieval_index_stale.
