  summary: Remove Owner/TOTP manual and native OS trust/user-presence confirmation,
    and isolated database restore/cutoff reconciliation, from overall local core/Foundation/M4
    acceptance gates. Preserve security/runtime contracts and historical evidence;
    classify both as optional improvements in options documentation. Update all current
    planning, acceptance, readiness, status and Issue 06 closure surfaces consistently.
