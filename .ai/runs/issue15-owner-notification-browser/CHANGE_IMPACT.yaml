  summary: Finish the Issue 15 assigned-owner in-app notification browser acceptance
    on an isolated dedicated SQL fixture. A committed notification implementation
    already exists. Fix the dedicated-fixture endpoint range check and expose only
    bounded Native machine reason codes; retain the frontend acceptance correction.
    Update the issue, verification record and current plan only after the browser
    journey passes. Preserve ManualOnly scheduling, dataset-scoped reconciliation.resolve
    authorization, user-owned dirty .ai content, and all non-target working-tree changes.
    No production schema, external notifications, scheduling or financial-state changes.
  risk_class: api_contract
inputs:
- Dedicated, marked localhost SQL fixture with synthetic active session and scoped
  read/resolve grants.
- Current reconciliation case report, assignment response, and assigned-owner notification
  API.
outputs:
- Playwright evidence for a reconciliation finding assignment and the current assignee's
  in-app notification.
- Updated Issue 15 and architecture verification records if browser acceptance passes.
data:
- Synthetic records and grants exist only in the disposable marked fixture; fixture
  cleanup is exact-project scoped.
events: []
consumers:
- Issue 15 manual reconciliation runner, Commerce fixture grant helper, and Playwright
  browser scenario.
- Storefront assignment workbench and in-app notification list.
security_boundaries:
- User assignment is scoped to the dedicated `kohami_local` fixture and synthetic session.
- Only the currently assigned actor with active `reconciliation.resolve` may query
  the in-app notification.
- No credentials, real-user identifiers, or notification payloads are written into
  tracked evidence.
invariants:
- Notification creation remains atomic and idempotent with the existing assignment
  behavior.
- Daily schedule remains disabled; no email, external channel, or financial-state
  mutation is added.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - This continuation adds fixture authorization and browser evidence only; committed
    API behavior is unchanged.
tests:
- npm run typecheck in apps/storefront.
- dotnet build tools/native-operations/Native.csproj -c Release --no-restore -m:1
  -nr:false -p:UseSharedCompilation=false -v:minimal.
- dotnet build tests/Commerce/Commerce.Tests.csproj -c Release --no-restore -m:1 -nr:false
  -p:UseSharedCompilation=false -v:minimal.
- python3 -m py_compile scripts/foundation/run-issue06-aftercare-acceptance.py.
- Dedicated Issue 15 fixture and Playwright browser acceptance.
observability: []
documentation:
