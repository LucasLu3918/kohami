invariants:
- Do not alter commerce, payment, authorization, API, or data behavior.
- Keep 640/320 CSS viewport equivalent evidence distinct from native Chrome zoom.
- iPhone Safari and VoiceOver remain excluded and in the option list.
compatibility:
  api_breaking: false
  migration_required: false
