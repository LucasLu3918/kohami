- path: apps/storefront/app/pages/index.vue
  description: Home and cart controls plus shared display colors.
- path: apps/storefront/app/pages/policies.vue
  description: Public policy page navigation and focus colors.
- path: apps/storefront/app/pages/support.vue
  description: Public support page navigation and primary action.
- path: apps/storefront/app/pages/cart.vue
  description: Cart controls and component colors.
- path: apps/storefront/app/pages/checkout/[id].vue
  description: Read-only checkout result controls.
- path: apps/storefront/app/pages/account.vue
  description: Member account and order controls.
outputs:
