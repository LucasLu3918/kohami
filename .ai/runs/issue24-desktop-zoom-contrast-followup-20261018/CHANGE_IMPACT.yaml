version: 1
change:
  id: issue24-desktop-zoom-contrast-followup-20261018
  target:
  - Verify desktop viewport-equivalent reflow and sample non-text control contrast across Issue24 core routes.
  target_paths:
  - apps/storefront/tests/issue24-zoom-core-pages.spec.ts
  - apps/storefront/app/pages/index.vue
  - apps/storefront/app/pages/policies.vue
  - apps/storefront/app/pages/support.vue
  - apps/storefront/app/pages/cart.vue
  - apps/storefront/app/pages/checkout/[id].vue
  - apps/storefront/app/pages/account.vue
  - docs/issues/kohami/24-core-mobile-accessibility-performance.md
  summary: 'Issue24 acceptance follow-up only: rerun desktop cart/checkout/member-orders
    640/320/160 CSS viewport reflow using the existing synthetic fixture through HTTP
    localhost, and sample visible non-text control colors across storefront core routes.
    No application behavior change; update the Issue24 acceptance record to distinguish
    passed viewport evidence from incomplete native zoom/full WCAG evidence. Keep
    iPhone/VoiceOver excluded.'
  risk_class: private_leaf
