tests:
- command: npx playwright test tests/issue24-zoom-core-pages.spec.ts --config=.issue24-local-http.config.ts --headed --reporter=line --trace=off
  result: PASS 1/1 in headed Chrome with existing synthetic API stubs at 640, 320, and 160 CSS px. Temporary config used http://localhost:3000 because both active local preview services speak HTTP; the checked-in config targets HTTPS and failed with ERR_SSL_PROTOCOL_ERROR.
- command: npx playwright test tests/issue24-contrast-probe.spec.ts --config=.issue24-local-http.config.ts --headed --reporter=line --trace=off
  result: PASS 1/1; sampled visible control colors on zh-TW home, policies, support, cart, checkout result, and account routes. Primary fill 10.26:1, secondary fill 7.76:1, native input border 4.54:1, skip-link fill 14.36:1, focus color 6.49:1 on page background and 6.87:1 on white. This is a CSS color sample, not a complete WCAG 2.2 audit; dynamic/disabled states and keyboard-forced focus were not all tested. Decorative card borders #b0a7a0 and #ddd5d0 on white are 2.36:1 and 1.45:1 respectively and are not relied on to identify interactive controls.
