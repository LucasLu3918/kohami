inputs:
- Commerce checkout expected version and server-owned quote total
- Authenticated member identity from existing security resolver
- Strict TLS runtime connection profile for localhost SQL port 14349
outputs:
- Wallet current-balance read scoped to authenticated member
- Wallet debit result and updated checkout/order state
- Native authority connection target derived from exact runtime SQL profile
data:
- 0013_member_wallet_ledger adds synthetic-balance projection and append-only wallet ledger
- Existing Checkout, Order, Reservation, Collection, RefundUnits, and generic CommerceDocument records
events:
- Existing Commerce outbox/state persistence inside the checkout transaction
consumers:
- POST /checkouts/{id}/payment-attempts
- GET /wallet/current
- Existing Storefront startMockPayment in apps/storefront/app/pages/index.vue
- Existing order, refund, reconciliation, readiness consumers manually inspected
security_boundaries:
- Member reads only their own wallet; guest checkout remains the existing mock payment path
- m0_api may read wallet state and execute debit procedure, with no direct balance write or funding API
- Native SQL operations must inherit a validated dedicated loopback endpoint and strict certificate pin
invariants:
- Debit, ledger, reservation consumption, collection, payment document, and order state change share one SQL transaction
- Insufficient balance does not authorize a negative balance
- Wallet refund is rejected until a wallet-specific refund flow exists
