version: 1

change:
  id: issue02-aftercare-e2e
  target: [Issue 02 aftercare acceptance]
  target_paths:
    - tools/native-operations/packages.lock.json
    - docs/issues/kohami/02-fulfillment-aftercare-invoice-rules.md
    - docs/architecture/VERIFICATION.md
    - docs/planning/kohami/M0_IMPLEMENTATION_STATUS.yaml
  summary: Complete the already-implemented Issue 02 real API/SQL aftercare acceptance using a disposable loopback-only synthetic fixture; reconcile a stale Native project dependency lock if required to build the runner; update acceptance evidence only after observed results.
  risk_class: security_boundary

inputs:
  - scripts/m0/provision-issue02-fixture.py
  - scripts/m0/run-issue02-acceptance.py
  - tools/native-operations/DevelopmentFixtureBootstrap.cs
  - tools/native-operations/DevelopmentFixtureBootstrap.sql
  - apps/storefront/tests/issue02-api-aftercare.spec.ts
  - infra/m0/compose.yaml
  - docs/issues/kohami/02-fulfillment-aftercare-invoice-rules.md
  - docs/architecture/VERIFICATION.md
outputs:
  - tools/native-operations/packages.lock.json (only if force-evaluated restore confirms the existing project reference is missing)
  - docs/issues/kohami/02-fulfillment-aftercare-invoice-rules.md (observed acceptance results)
  - docs/architecture/VERIFICATION.md (observed acceptance results)
  - docs/planning/kohami/M0_IMPLEMENTATION_STATUS.yaml (observed acceptance results)
data:
  - .local/m0 (mode-0600 private credentials and disposable SQL TLS materials; never commit or display)
  - localhost:14336 KohamiM0 dedicated demo_m0 SQL fixture, created fresh and removed by the acceptance lifecycle
  - synthetic Issue 02 Owner, order, shipment, return, inspection, refund and audit rows only
events:
  - Existing local HTTPS API requests from the Issue 02 Playwright journey; no provider events or external calls
consumers:
  - apps/api and apps/worker started only by the Issue 02 acceptance runner
  - apps/storefront/tests/issue02-api-aftercare.spec.ts
  - Commerce SQL persistence and authorization boundary
security_boundaries:
  - Development-only, interactive bootstrap is restricted to the dedicated localhost:14336 fixture and demo_m0 dataset.
  - Use a real local authenticator proof; keep the seed, activation code, synthetic Owner password and TOTP codes in the local terminal only.
  - Runner must validate the pinned SQL certificate/config, free ports and owned Compose project; teardown only its owned Compose volumes and private fixture directory.
  - No production Owner/native authority, real payment, refund, shipping, tax provider or external deployment.
invariants:
  - Use fresh synthetic SQL data; do not reset KohamiTest, display fixtures or any unowned Compose project.
  - Failed bootstrap must leave Owner absent and bootstrap/maintenance state unchanged; failed attempts discard the in-memory seed.
  - Acceptance success requires the real API/SQL Playwright test to finish, post-journey verification to pass, and disposable fixture teardown to succeed.
  - Distinguish mock checkout/refund evidence from real provider settlement and overall M0 completion.

compatibility:
  api_breaking: false
  migration_required: false
  reasons:
    - No product API, schema, event, runtime behavior or migration changes are planned; the only possible non-document change is generated package-lock metadata matching an existing project reference.

tests:
  - npm run typecheck (apps/storefront)
  - dotnet build apps/api/Api.csproj -c Release --no-restore
  - dotnet build tools/native-operations/Native.csproj -c Release --no-restore
  - dotnet build tests/Commerce/Commerce.Tests.csproj -c Release --no-restore
  - python3 scripts/m0/provision-issue02-fixture.py
  - M0_DEV_FIXTURE_BOOTSTRAP=1 DOTNET_ENVIRONMENT=Development dotnet tools/native-operations/bin/Release/net10.0/Native.dll development-fixture-bootstrap .local/m0/fixture-private.json (interactive, local TOTP proof)
  - python3 scripts/m0/run-issue02-acceptance.py (interactive hidden local credentials and TOTP proofs)
observability:
  - Acceptance runner's fixed safe failure-stage labels only; do not read or persist raw auth prompts or codes.
  - Record PASS/NOT_EXECUTED and fixture teardown outcome in the canonical issue, verification and M0 status documents.
documentation:
  - docs/issues/kohami/02-fulfillment-aftercare-invoice-rules.md
  - docs/architecture/VERIFICATION.md
  - docs/planning/kohami/M0_IMPLEMENTATION_STATUS.yaml

