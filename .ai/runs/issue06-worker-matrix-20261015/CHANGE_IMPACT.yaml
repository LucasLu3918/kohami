change:
  id: issue06-worker-matrix-20261015
  target:
  - tests/Commerce/WorkerRecoveryMatrix.cs
  - tests/Commerce/Program.cs
  - docs/architecture/VERIFICATION.md
  - docs/issues/kohami/06-commerce-technology-quality-baseline.md
  - docs/planning/kohami/delivery/IMPLEMENTATION_PLAN.md
  - docs/planning/kohami/delivery/LOCAL_DEMO_RUNBOOK.md
  - docs/planning/kohami/delivery/technical-baseline/IMPLEMENTATION_STATUS.yaml
  summary: Complete dedicated synthetic SQL worker crash/restart and failure replay
    matrix; document verified limits and clean handoff.
  risk_class: private_leaf
inputs:
- Existing MockWorker lease claim/fence behavior and Issue06 dedicated SQL fixture.
- Validation plan worker cut points: committed NotStarted work, expired Started work,
    post-settlement receipt notification, and Unknown outcome.
outputs:
- Re-runnable Commerce worker recovery matrix with exact SQL state assertions and
  synthetic row cleanup.
- Candidate-bound verification record and handoff instructions.
data:
- Synthetic Checkout, Order, PaymentAttempt, DemoReceipt, Jobs, Collections, and Inbox
  rows under kohami_local.
- No fixture reset or modification outside IDs generated by each test run.
events:
- Payment job ID is also the applied Inbox EventId; teardown checks and removes that
  exact event.
- Receipt delivery remains a distinct job after payment settlement and may resume
  under a higher lease fence.
consumers:
- tests/Commerce/Program.cs invokes WorkerRecoveryMatrix as part of the dedicated
  SQL harness.
- Issue06 status, validation ledger, runbook, and implementation plan consume the
  resulting evidence and limits.
security_boundaries:
- Test runs require the explicitly provisioned localhost Issue06 SQL fixture and use
  synthetic IDs only.
- No provider credentials, browser session, Owner TOTP, native OS confirmation, or
  restore/cutoff authority is exercised.
invariants:
- An unexpired Started lease is not stolen; expired Started jobs are claimed by at
  most one competing worker.
- Fence increments reject stale completion; completed or Unknown operations are not
  re-executed as new money operations.
- Payment settlement, Inbox application, collection, and receipt creation remain single-application;
  receipt notification replay does not reapply payment.
- Teardown removes all test-owned Jobs, Inbox events, Collections, and Documents;
  the fixture remains available.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Test-harness and documentation changes only; production Worker, SQL schema, and
    runtime contracts remain unchanged.
tests:
- Commerce Release build.
- Dedicated Issue06 SQL Commerce harness including the worker crash/restart matrix.
- Existing runner regression and architecture checks selected by the implementation
  plan.
observability:
- Each scenario emits fixed PASS assertions; teardown asserts zero rows for the generated
  synthetic identifiers. The mock adapter does not simulate killing a process inside
  an external provider call; real provider sandbox and independent restore/cutoff
  are out of scope.
documentation:
- Verification ledger, Issue06 ticket, implementation plan, local demo runbook, and
  implementation status.
