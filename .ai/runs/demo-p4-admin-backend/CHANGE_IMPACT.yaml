  target:
  - src/Modules/IdentityAccess/Infrastructure/Legacy/SecurityRules.cs
  - src/Modules/IdentityAccess/Presentation/SecurityEndpoints.cs
  - src/Modules/Catalog/Infrastructure/CatalogEndpoints.cs
  - src/Modules/Catalog/Infrastructure/Legacy/CatalogService.cs
  - src/Modules/Catalog/README.md
  - src/Modules/IdentityAccess/Infrastructure/Persistence/CatalogAdminReadMigration.sql
