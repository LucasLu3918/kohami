version: 1
change:
  id: issue24-zoom-core-pages
  target:
  - Desktop zoom/reflow acceptance evidence for the cart, checkout result, and authenticated member-order page.
  target_paths:
  - apps/storefront/app/pages/cart.vue
  - apps/storefront/app/pages/checkout/[id].vue
  - apps/storefront/app/pages/account.vue
  - apps/storefront/app/components/commerce/MemberOrderList.vue
  - apps/storefront/tests/issue24-zoom-core-pages.spec.ts
  - docs/issues/kohami/24-core-mobile-accessibility-performance.md
  - docs/architecture/VERIFICATION.md
  summary: Complete Issue 24 desktop zoom/reflow acceptance for cart, checkout and
    member orders using synthetic browser fixtures. Verify readable content and no
    horizontal overflow at native Chrome 200% and 400% zoom where possible, plus equivalent
    640px/320px CSS viewport regression checks. Exclude physical iPhone and VoiceOver.
  risk_class: private_leaf
inputs:
- path: apps/storefront/app/pages/cart.vue
  description: Cart layout and current rendered product/quote information.
- path: apps/storefront/app/pages/checkout/[id].vue
  description: Read-only checkout result layout and synthetic status response.
- path: apps/storefront/app/pages/account.vue
  description: Authenticated member order layout, including MemberOrderList.
outputs:
- kind: acceptance evidence
  description: No horizontal page overflow and visible, readable primary content at 640px and 320px CSS viewport widths, corresponding to desktop 200% and 400% reflow checks at a 1280px base viewport.
data:
- Synthetic route-stub cart, checkout status, member session, and order data only; no API, SQL, account, or payment service access.
events: []
consumers:
- path: apps/storefront/app/components/commerce/MemberOrderList.vue
  status: rendered by apps/storefront/app/pages/account.vue.
- path: apps/storefront/app/composables/useCommerceCart.ts
  status: cart data and quote behavior consumed by apps/storefront/app/pages/cart.vue.
- path: apps/storefront/tests/issue16-member-orders.spec.ts
  status: existing synthetic member session/order fixture pattern.
- path: apps/storefront/tests/issue24-checkout-keyboard.spec.ts
  status: existing synthetic checkout status fixture pattern.
security_boundaries:
- Tests use route stubs and synthetic values; do not send requests to API/SQL/payment providers or modify persistent fixture data.
invariants:
- Do not change commerce, checkout, member ownership, authorization, or payment behavior.
- A 320px CSS viewport is the 400% reflow equivalent at a 1280px desktop viewport; report viewport automation separately from manual Chrome native zoom.
- iPhone and VoiceOver remain excluded from this acceptance.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Verification test and acceptance documentation only; no production contract or data changes.
