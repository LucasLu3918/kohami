  result: The project Chrome channel could not launch under this macOS sandbox; rerun with an isolated temporary config and cached Headless Chromium. PASS 1/1 for 640px/320px CSS viewport reflow across cart, checkout result, and authenticated member orders, using synthetic API route stubs only.
- command: npx playwright test tests/issue24-zoom-core-pages.spec.ts --config=/private/tmp/kohami-issue24-zoom.playwright.config.mjs --reporter=line --trace=off
