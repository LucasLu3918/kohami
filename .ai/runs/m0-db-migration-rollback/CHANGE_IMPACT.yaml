- Dedicated fixture target config, strict TLS pin, and fixture marker
outputs:
- Versioned migration history with SHA-256 source hashes and UTC application time
- Fail-closed diagnostics for legacy databases without an adopted baseline and for checksum drift
- Dated build and dedicated-fixture acceptance evidence with explicit limits
data:
- Database-local schema migration history
- Migration DDL/DML runs in a SQL transaction; failed migration leaves no effects or history row
events: []
consumers:
- Native SQL provisioning
- Native local migration command
- Native synthetic and dedicated SQL acceptance checks
security_boundaries:
- Migration command accepts only the existing local SQL endpoint or bounded localhost dedicated fixture endpoint
- Dedicated acceptance verifies fixture marker and strict TLS before any test DDL
invariants:
- Existing non-versioned databases are not auto-baselined or modified
- Migrations apply in stable ascending order and each migration is atomic
- Applied migration checksums are immutable; drift fails closed
compatibility:
  api_breaking: false
  migration_required: true
  reasons:
  - Provisioning changes from one-shot raw SQL application to a version ledger for newly created databases.
  - Existing databases without a verified ledger remain untouched and require explicit baseline adoption work.
tests:
- tests/Native/Program.cs static migration ordering, identity, and checksum invariants
- tests/Native/Program.cs dedicated synthetic SQL upgrade/replay/failure-rollback acceptance
observability:
