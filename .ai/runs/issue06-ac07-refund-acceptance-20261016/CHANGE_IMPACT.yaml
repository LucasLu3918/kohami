  risk_class: security_boundary
  summary: Add local mock Foundation-AC07 refund acceptance to the existing Commerce service harness.
    Preserve production API/schema. Cover line/source/shipping reservation concurrency,
    explicit pre-dispatch denial release, Unknown retention/query, and revocation after Started.
inputs:
- Foundation-AC07 acceptance in READINESS.md and refund source, unit, shipping, Unknown, and revocation rules in AFTERCARE_REFUND_PLAN.md.
- Existing CommerceService.Refund/CheckRefund, MockWorker dispatch authorization and RefundResult, dedicated kohami_local SQL fixture.
outputs:
- Source-bound local mock SQL evidence for refund amount/unit/shipping limits, same-unit concurrency, Unknown retention and original-operation resolution, definite pre-dispatch failure release, and post-Started result tracking after revocation.
- Updated verification log, per-case status, and reproducible runbook command with mock/provider limitations.
data:
- Dedicated synthetic kohami_local documents, collection ledger rows, refund unit slots, jobs, inbox, grants, and idempotency rows created by the acceptance harness and removed by teardown.
- No fixture reset, schema migration, or changes to retained records.
events:
- Synthetic mock refund result and trusted result lookup only; no provider network calls or real funds.
consumers:
- CommerceService.Refund and CheckRefund.
- MockWorker refund dispatch, pre-dispatch grant denial, and refund result application.
- SQL RefundCase/RefundOperation documents, Collections, RefundUnits, Jobs, Inbox, and scoped grant state.
security_boundaries:
- Dedicated localhost SQL database and kohami_local dataset only; synthetic actor and operation identifiers.
- Worker checks current scoped grant before Started; a Started operation is system-tracked after revocation without using the revoked actor to dispatch new work.
- Test harness uses dedicated migrator access only for seed, observation, and deterministic cleanup.
invariants:
- Completed plus Pending refund amounts never exceed the original collection; product refunds use original unit allocations and cannot refund an allocated unit twice.
- Original shipping can be reserved at most once and cannot exceed the captured ShippingPaid value.
- Unknown preserves amount, unit, and shipping reservations until a trusted result for that same operation resolves it.
- A job denied before Started is Blocked and releases reservations only because non-dispatch is established; Started work is not treated as unexecuted.
- Revocation after Started does not lose or re-dispatch the in-flight operation; the trusted result updates the same operation once.
- Same-line competitors serialize to at most one refund per original unit; distinct eligible lines may proceed only within source amount and shipping caps.
compatibility:
  api_breaking: null
  migration_required: null
  reasons: []
tests:
- Commerce Release build.
- Dedicated Commerce SQL harness on the pinned synthetic fixture.
- Refund acceptance race, ledger/slot assertions, worker revocation continuation, and teardown checks.
- Full harness regression for concurrent deadline/cancel 409/412 optimistic-concurrency outcomes.
