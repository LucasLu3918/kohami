version: 1
change:
  id: storefront-girly-design-20261023
  target:
    - Establish a Japanese women's fashion boutique mood with rose-tinted paper, quiet editorial typography, and berry actions.
    - Improve home-to-catalog flow and align shared storefront and product detail styling.
    - Preserve Taiwan-market TWD mock commerce, all locales, API behavior, and product data.
  target_paths:
    - DESIGN.md
    - UX-CONTRACT.md
    - apps/storefront/app/app.vue
    - apps/storefront/app/components/storefront/StorefrontHeader.vue
    - apps/storefront/app/components/storefront/StorefrontHero.vue
    - apps/storefront/app/components/catalog/ProductDiscovery.vue
    - apps/storefront/app/components/catalog/ProductCard.vue
    - apps/storefront/app/pages/products/[slug].vue
  summary: Refresh the KOHAMI public storefront visual identity and shopping discovery
    surfaces toward a Japanese, feminine boutique mood inspired by grail.bz, while
    keeping Taiwanese market assumptions, zh-TW/ja/en localization, product API contracts,
    and commerce behavior unchanged. Include the existing uncommitted homepage/catalog
    changes, shared design tokens, DESIGN.md, home, header, product discovery/cards,
    and product detail visual consistency.
  risk_class: docs_style_test
inputs:
  - path: DESIGN.md
    description: Accepted KOHAMI visual identity, localization, and token mapping.
  - path: UX-CONTRACT.md
    description: Canonical storefront search, SKU, catalog, and transaction behavior.
  - path: docs/planning/kohami/product/PRODUCT_PLAN.md
    description: Taiwan-first Japanese-fashion product and audience context.
  - path: docs/planning/kohami/experience/VISUAL_SYSTEM.md
    description: GRL reference research and existing visual proposals; not an adopted brand contract.
  - path: apps/storefront/app/pages/index.vue
    description: Home route owns localized catalog search/filter state and product actions.
  - path: apps/storefront/app/pages/products/[slug].vue
    description: Product detail owns the selected SKU, displayed price and stock, and add-to-cart action.
outputs:
  - kind: design system
    description: Rose/berry semantic tokens mapped from DESIGN.md to app.vue.
  - kind: storefront layout
    description: Seasonal hero, catalog filters, product cards, and product detail share visual language.
  - kind: interaction states
    description: Focus, hover, disabled, reduced-motion, loading, and transaction behavior remain explicit.
