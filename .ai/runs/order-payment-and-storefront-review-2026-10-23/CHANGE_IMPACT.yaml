inputs:
- Member-authenticated GET /api/v1/orders response, including orderState and existing paymentSummary projection
- Existing mock demo-api order summary projection
- Current locale and account route visibility/focus lifecycle
- Existing storefront palette and typography declarations in scoped Vue styles
outputs:
- Order card displays server payment state and confirmed collection distinctly from order state
- Pay link appears only for AwaitingPayment plus Created/Failed with no collected amount or compensation
- Account order list revalidates on each route entry and when the page returns to the foreground
- Shared CSS variables establish common color, type, focus, and scrollbar baselines used across storefront and admin page styles
data:
- Read-only order state and payment summary remain in memory; no SQL or client persistence changes
- No order/payment events, API schema, external calls, or payment operations are added
events: []
consumers:
- MemberOrderList renders order status, safe payment-entry visibility, and localized payment progress states
- account.vue refreshes member order summaries on initial entry, route activation, focus, and visibility restoration
- checkout route remains the canonical server-revalidated payment flow
- All storefront and admin Vue routes consume shared app-level design tokens and global scroll styling
security_boundaries:
- Existing member-only GET /api/v1/orders ownership checks remain the source of private order data
- No payment authority or eligibility is added to the browser; checkout/API validation remains authoritative
invariants:
- OrderState and PaymentSummary remain separate server-owned facts
- A payment link is hidden for Processing, Unknown, Succeeded, positive confirmed collection, compensation, or missing payment summary
- Unknown or inconsistent payment projections never become a retry/payment affordance
- No price, order snapshot, payment attempt, collection, inventory reservation, or refund data is mutated
