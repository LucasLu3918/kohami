inputs:
- Remove member-claim API input; retain guest read/cancel/return inputs.
- Checkout continues to receive the member email from the active session.
outputs:
- Account page no longer renders guest-order claim controls.
- Cart labels the active member email as the order email.
data:
- Delete two approved kohami_local guest-origin orders and their linked Checkout,
  RefundCase, Collection, RefundUnit, Reservation and checkout idempotency records.
- Restore the one held inventory unit before removing its reservation, in the same
  SQL transaction.
events: []
consumers:
- Account route and useMemberOrders composable.
- Commerce endpoint registration, module contract routing, and Aftercare handler.
- Guest verification intent validation.
- Checkout UI consumer of member session email and server-side member checkout validation.
security_boundaries:
- Remove guest-order claim capability; preserve guest read/cancel/return verification
  and member ownership checks.
- Preserve authenticated-only checkout and exact server-side member email match.
invariants:
- Member order lists remain scoped to the authenticated member.
- Checkout owner and contact email remain derived/validated from authenticated member
  identity.
- Inventory available count is restored exactly once for the deleted held reservation.
