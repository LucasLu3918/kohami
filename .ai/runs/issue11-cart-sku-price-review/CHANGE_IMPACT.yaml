  summary: 'Issue 11: storefront 明確選擇 SKU、加入／更新／移除購物車、套用 DEMO15 並查看 TWD 報價；使用 dedicated synthetic
    SQL fixture 瀏覽器驗收冪等、ETag、價庫變動與錯誤流程，不延伸到正式付款或正式資料。'
  risk_class: api_contract
inputs:
- Published Catalog product/SKU details and current Commerce inventory price/availability.
- Existing Cart and Quote operations, the Issue 11 checklist, and OP-02–06 M1 contracts.
outputs:
- Product detail requires explicit color and garment-size SKU selection before add-to-cart.
- Cart route displays product/color/size, editable quantity, removable lines and a server-calculated TWD quote.
- Cart route applies or clears the single local DEMO15 promotion and displays server-calculated merchandise, discount, shipping and total.
- Additive OP-05 DELETE cart-line and promotion operations enforce ownership, CSRF, idempotency and current Cart ETag.
data:
- Existing demo_m0 Commerce Cart document and actor-scoped idempotency rows.
- Read-only Catalog published product details and current m0commerce.Inventory; no schema or migration change.
events: []
consumers:
- Nuxt homepage discovery and ProductDiscovery SKU selection.
- Nuxt product detail, cart route, same-origin API proxy and mock promotion selection.
- Existing checkout quote flow consumes the same versioned Cart and authoritative current SKU price/stock.
- Dedicated SQL fixture Playwright acceptance runner and Commerce service endpoint mappings.
security_boundaries:
- Cart operations resolve the current cart cookie and verify the server-side actor owner on every request.
- Mutations require Origin/CSRF validation, an actor/cart/SKU scoped idempotency key and If-Match.
- Cart reads and mutations remain no-store; no cart operation reserves inventory or exposes private Catalog rights metadata.
invariants:
- Product page never chooses a SKU by default; add-to-cart requires one active, available SKU.
- Stale ETags cannot overwrite or remove newer cart state; identical retries replay once and changed payloads conflict.
- Quantity stays within server validation; removal affects only the selected SKU in the caller's Cart.
- Quotes use server current inventory and fees; price/stock changes are shown as errors requiring shopper review, never silently accepted.
- Cart does not promise inventory reservation or a completed order.
compatibility:
  api_breaking: false
  migration_required: false
  reasons: []
tests:
- Issue 11 Playwright 4/4 on dedicated synthetic SQL fixture: explicit SKU selection, add/update/remove, DEMO15 quote, no inventory reservation, stale ETag, idempotent replay and price/stock conflict feedback.
- API/Commerce Release build, Storefront typecheck/build, runner unit tests and architecture tests. Broader Commerce SQL harness had a separate failing `sku_demo_01` availability assertion; see dated verification record.
observability:
- Existing problem code and traceId behavior; no new telemetry or event stream.
documentation:
- Resolve the local mock Issue 11 slice and refresh implementation plan, M1 Catalog/API trace, runbook and verification record; keep broader M1 partial cases explicit.
