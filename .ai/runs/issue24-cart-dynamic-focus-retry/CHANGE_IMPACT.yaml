version: 1
change:
  id: issue24-cart-dynamic-focus-retry
  target:
  - Return keyboard focus to the quantity input after cart quantity mutation settles.
  - Return keyboard focus to the quote action after quote success or failure.
  - Cover Japanese and English cart failures and retries with synthetic browser fixtures.
  target_paths:
  - apps/storefront/app/composables/useCommerceCart.ts
  - apps/storefront/app/pages/cart.vue
  - apps/storefront/tests/issue24-focus-stop-sweep.spec.ts
  - docs/issues/kohami/24-core-mobile-accessibility-performance.md
  summary: Extend Issue24 Japanese and English cart dynamic failure focus recovery
    for quantity update and quote refresh retries; preserve the quantity and quote
    action as keyboard recovery points after an error or success.
  risk_class: return_shape
inputs:
- path: apps/storefront/app/composables/useCommerceCart.ts
  description: Cart mutation pending state and quantity update behavior.
- path: apps/storefront/app/pages/cart.vue
  description: Quantity change handler, quote action, and localized error messages.
- path: apps/storefront/tests/issue24-focus-stop-sweep.spec.ts
  description: Existing focus sweep and synthetic localized cart/checkout API fixtures.
outputs:
- kind: storefront behavior
  description: Keyboard focus returns to the quantity field or quote action after
    request completion.
- kind: test evidence
  description: Japanese and English quantity and quote requests recover from synthetic
    503 and succeed on retry.
