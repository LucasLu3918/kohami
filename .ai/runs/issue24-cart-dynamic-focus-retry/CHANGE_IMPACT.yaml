    checkout failure sweep.
security_boundaries: []
invariants:
- Quantity update requests are not started while another cart mutation is pending.
- Failed quantity updates announce an error and return focus to the quantity field
  for correction or retry.
- Quote failures announce an error and leave focus on the quote action for retry.
- A successful quote retry displays the amount based on the current cart quantity.
- Browser fixtures use synthetic responses and do not call persistent API or SQL services.
