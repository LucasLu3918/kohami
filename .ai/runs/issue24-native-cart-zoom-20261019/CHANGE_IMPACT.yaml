tests:
- command: Manual desktop Chrome inspection of /zh-TW/cart at native browser zoom 200% and 400%, using keyboard quantity update and synthetic quote action.
  result: >-
    PASS for the bounded desktop cart interaction. Chrome native zoom indicator showed
    200% and 400%. At 200%, keyboard input changed quantity 2 to 3 and subtotal to TWD
    3000; Tab reached remove, promotion, delivery and quote controls; Enter produced a
    synthetic quote total of TWD 3060. At 400%, keyboard input changed quantity 3 to 4
    and subtotal to TWD 4000; the same controls remained reachable and Enter produced
    TWD 4060. The 400% screenshot showed a readable single-column flow with vertical
    scrolling and no obvious horizontal clipping in the captured viewport. No exact
    scrollWidth/clientWidth measurement was taken, and this is not a whole-site or WCAG
    conformance result. The temporary API and Nuxt HTTPS preview used localhost only and
    were stopped after acceptance; Chrome zoom was restored to 110%. No product source
    changed.
