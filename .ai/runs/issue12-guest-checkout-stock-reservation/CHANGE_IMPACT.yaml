version: 1

change:
  id: issue12-guest-checkout-stock-reservation
  target: [Storefront cart checkout consumer]
  target_paths:
    - .ai/runs/issue12-guest-checkout-stock-reservation/CHANGE_IMPACT.yaml
    - apps/storefront/app/composables/useCommerceCart.ts
    - apps/storefront/app/pages/cart.vue
    - apps/storefront/tests/issue12-guest-checkout.spec.ts
    - docs/architecture/VERIFICATION.md
    - docs/issues/kohami/12-guest-checkout-stock-reservation.md
    - docs/planning/kohami/delivery/IMPLEMENTATION_PLAN.md
  summary: Add guest checkout from the existing cart quote through the existing Commerce API; no server or SQL implementation changes.
  risk_class: api_contract

inputs:
  - Existing current cart, cart ETag and server-created quote from POST /checkout-quotes.
  - Guest-provided synthetic example.test email, delivery choice and explicit terms confirmation.
outputs:
  - Idempotent POST /checkouts using the current cart ETag and quote ID.
  - Navigation to the existing private checkout result page after a successful response.
data:
  - No persistence/schema change in this patch; the existing Commerce endpoint owns Order, Quote and Reservation writes.
events: []
consumers:
  - Existing POST /checkouts API consumer and existing private /checkout/[id] SSR result page.
security_boundaries:
  - Browser sends only the synthetic contact field and explicit confirmation; Commerce remains responsible for CSRF, authorization, ownership, quote validity and inventory checks.
invariants:
  - Checkout body must carry the current cart version, quote ID and selected delivery method.
  - A new quote or changed delivery choice invalidates the prior terms confirmation.
  - UI labels checkout and payment as mock; creating a pending order does not claim payment success.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
    - Existing endpoint request/response and SQL behavior are unchanged.
tests:
  - npm run typecheck in apps/storefront
  - npm run build in apps/storefront
  - Playwright Issue12 browser flow with API route mocks; this is not API/SQL acceptance.
observability:
  - Existing API errors remain visible to the shopper; stale quote and inventory failures require a new quote.
documentation:
  - docs/issues/kohami/12-guest-checkout-stock-reservation.md
  - docs/planning/kohami/delivery/IMPLEMENTATION_PLAN.md
  - docs/architecture/VERIFICATION.md

