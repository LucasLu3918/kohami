  evidence:
  - Docker bind source was an empty directory; container labels pointed to the removed /private/tmp/kohami-sql-bootstrap project.
  - Repository mssql.conf copied byte-for-byte to the broken temporary source; initial container start and read-only SQL probe succeeded.
  - New Compose config passed config --quiet; make sql-start recreated the container using repo config, with the exact existing kohami-sql_data, kohami-sql_backup and kohami-sql_tls volumes.
  - After recreation, container-internal sqlcmd with the configured CA completed SELECT 1; the default sqlcmd attempt without CA failed, consistent with strict TLS configuration.
  - Direct source review confirmed make sql-start feeds db-migrate and dev; lowercase makefile is a hard link to tracked Makefile.
  - The first full make dev reached LOCAL_PROFILE_INVALID because the target omitted KOHAMI_LOCAL_DIR; after setting .local/kohami-sql/identity, migration confirmed the DB was already current and ready.
  - The first app build failed with CS0012 because Commerce.Tests did not directly reference Catalog.Application; adding the project reference yielded a successful Release solution build.
  - Final make dev started API and Nuxt; loopback /health and /ready both returned the expected healthy/readiness JSON.
  - Restore attempt dotnet restore tests/Commerce/Commerce.Tests.csproj --locked-mode produced no output for over three minutes and was stopped; subsequent make dev built the project and full solution successfully with --no-restore.
