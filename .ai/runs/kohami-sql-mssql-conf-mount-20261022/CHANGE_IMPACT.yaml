invariants:
- Preserve SQL data/volumes, local port and strict TLS behavior.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Local host-side bind source type repair; no app/API or DB schema change.
verification:
- docker compose -f infra/kohami-sql/compose.yaml config --quiet.
- make sql-start recreated the container with the repository compose file.
- docker inspect confirmed it reuses kohami-sql_data, kohami-sql_backup and kohami-sql_tls and binds infra/foundation/mssql.conf.
- Container-internal sqlcmd with its configured CA and environment-provided password completed read-only SELECT 1.
- make dev migration reported the local Kohami target current and readiness verified.
- Commerce.Tests requires an explicit Catalog.Application reference because CommerceService exposes IPublishedSkuReader in its public constructor.
- Final make dev completed Native and solution Release builds, local account verification, and started API/Storefront.
- GET /health returned database-connected; GET /ready returned ready for kohami_local.
observability:
- Docker container state and SQL startup output; do not print env or credentials.
documentation:
- Makefile startup target and infra/kohami-sql/compose.yaml.
