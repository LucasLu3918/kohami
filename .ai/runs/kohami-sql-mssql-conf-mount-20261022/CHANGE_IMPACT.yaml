inputs:
- Existing kohami-sql-sqlserver-1 mount error reported by user.
- Repository-owned infra/foundation/mssql.conf and local container configuration.
- Direct source review found Makefile sql-start feeds db-migrate and dev.
- Docker inspection confirmed loopback port 14349, image, runtime limits and existing named volumes.
- Native FixtureLocal requires KOHAMI_LOCAL_DIR to select .local/kohami-sql/identity.
- Commerce.Tests compiles against CommerceService's public Catalog.Application type.
outputs:
- Restore expected file at the broken bind-mount source.
- Manage the existing kohami-sql container from a repository Compose file.
- Run db-migrate with the canonical local profile and make the solution build resolve Catalog.Application in Commerce.Tests.
