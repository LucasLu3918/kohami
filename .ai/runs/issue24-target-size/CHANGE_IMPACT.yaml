  id: issue24-target-size
  target:
  - Ensure locale-switcher links have at least 24 CSS px hit height.
  - Ensure the product back-to-catalog and account store/cart links have at least 24 CSS px hit height.
  target_paths:
  - apps/storefront/app/components/LocaleSwitcher.vue
  - apps/storefront/app/pages/products/[slug].vue
  - apps/storefront/app/pages/account.vue
  - apps/storefront/tests/issue24-target-size.spec.ts
  - docs/issues/kohami/24-core-mobile-accessibility-performance.md
  - docs/architecture/VERIFICATION.md
  summary: 'Issue24 desktop Lighthouse Accessibility target-size repair: increase
    shared storefront locale-switcher and navigation link hit areas to meet WCAG 2.2
    target-size (minimum 24x24 CSS px or adequate spacing) on product and account
    pages in zh-TW/ja/en; rerun the requested nine Lighthouse accessibility routes.
    No mobile/iPhone/VoiceOver scope expansion.'
