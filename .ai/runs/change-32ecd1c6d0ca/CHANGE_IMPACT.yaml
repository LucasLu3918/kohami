  summary: Fix checkout result read failure after transaction; replace mock simulation
    UI wording for backend/API/SQL-backed commerce operations with accurate transaction
    language; add checkout payment method selection.
inputs:
- Checkout id from the route and the read capability cookie
- Selected payment method, expected checkout version and card form values
outputs:
- Checkout status, trusted order/payment state and checkout snapshot
- Updated payment method and payment-attempt response
data:
- commerce.Documents Checkout and Order records
- commerce.PaymentAttempt and commerce.Outbox rows
events:
- Payment worker result updates Checkout and Order in one SQL transaction
consumers:
- Storefront checkout result SSR and status refresh
- Storefront payment form and card method selection
security_boundaries:
- Encrypted checkout read/pay capability cookies remain scoped to the checkout and owner
- Read capability retention may outlive payment eligibility; pay capability still expires at checkout deadline
- Card details remain validated and removed before idempotency persistence
invariants:
- Expired checkouts remain readable for the read capability retention period
- Expired checkouts cannot initiate payment
- Payment method changes only while checkout is AwaitingPayment and payment is Created or Failed
- Checkout and order snapshots, versions and selected payment method are updated atomically
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Payment-attempt accepts an optional selected card type; legacy requests keep the stored choice.
tests:
- Storefront checkout-result behavior for status retrieval and payment method selection
- Commerce SQL transaction behavior for method update and checkout/order version synchronization
