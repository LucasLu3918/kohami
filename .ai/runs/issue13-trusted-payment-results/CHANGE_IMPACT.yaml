version: 1
change:
  id: issue13-trusted-payment-results
  target:
    - Existing Storefront checkout result status consumer
    - Issue 13 local mock checkout result verification
  summary: 'Issue 13: add browser-refresh affordance to the guest checkout result
    page so the displayed order/payment state is reloaded from the existing authoritative
    checkout status endpoint; preserve the server-returned price snapshot.'
  target_paths:
    - .ai/intelligence/RETRIEVAL_INDEX.yaml
    - .ai/runs/issue13-trusted-payment-results/CHANGE_IMPACT.yaml
    - apps/storefront/app/pages/checkout/[id].vue
    - apps/storefront/tests/issue13-trusted-payment-results.spec.ts
    - docs/README.md
    - docs/architecture/VERIFICATION.md
    - docs/issues/kohami/13-trusted-payment-order-results.md
    - docs/planning/kohami/delivery/IMPLEMENTATION_PLAN.md
  risk_class: payment
inputs:
  - Existing private checkout status response from GET /checkouts/{id}/status.
  - Existing checkout price snapshot stored by Commerce.
outputs:
  - Updated order/payment state from the same server status endpoint.
  - Existing order merchandise, discount, shipping and total snapshot remain visible after refresh.
data:
  - No persistence, schema or ledger changes. Existing Commerce status read owns Checkout data.
events: []
consumers:
  - Storefront apps/storefront/app/pages/checkout/[id].vue.
  - Playwright consumer assertion in apps/storefront/tests/issue13-trusted-payment-results.spec.ts.
security_boundaries:
  - Uses the existing checkout browser read capability; the API continues to enforce ownership.
  - Browser cannot submit or declare a trusted payment outcome through this refresh.
invariants:
  - Displayed status is taken only from the server checkout status response.
  - A refresh failure retains the last server response and reports that refresh failed.
  - Catalog current price cannot replace the stored checkout snapshot in the result page.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
    - Existing GET route and response shape are unchanged; no payment write or storage behavior changed.
tests:
  - command: npm run typecheck (apps/storefront)
    result: PASS.
  - command: npm run build (apps/storefront)
    result: PASS.
  - command: Playwright Issue13 result status refresh test
    result: PASS 1/1 with API route mocks; verifies state update and snapshot display against a different current catalog price, not API/SQL acceptance.
  - command: KOHAMI_M0_TEST_CONFIG="$PWD/.local/m0/fixture-private.json" dotnet tests/Commerce/bin/Release/net10.0/Commerce.Tests.dll
    result: PARTIAL; payment deadline/compensation checks passed, then unrelated RefundAcceptance worker assertion failed with exit 134. Full harness not passed.
observability:
  - Refresh uses the existing private no-store API status path; errors keep the last response and show a localized alert.
