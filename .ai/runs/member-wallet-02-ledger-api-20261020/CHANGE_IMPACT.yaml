  summary: 'Deliver only member-wallet/02''s approved synthetic-only slice: dedicated
    demo_m0 synthetic credit acceptance with fail-closed replay/mismatch checks and
    ledger-derived projection verification; authenticated member-own balance and paginated
    ledger reads using a stable CreatedAt/EntryId cursor; and a mock-labeled read-only
    member account panel with browser acceptance. Do not add real funding, settlement,
    gift credit, refunds, direct balance mutation, or an Owner/public top-up route.'
  risk_class: api_contract
inputs:
- Existing demo_m0 synthetic fixture, WalletAccounts, WalletLedger, and wallet procedures.
- MemberAuthenticated identity resolved by the existing Commerce security port.
outputs:
- Member-own TWD wallet balance and descending ledger page with nullable nextCursor.
- Dedicated synthetic-credit acceptance proving at-most-once behavior and projection
  readback.
- Storefront account view showing mock balance and ledger with cursor pagination.
data:
- Existing WalletAccounts and WalletLedger only; no schema migration.
events: []
consumers:
- Commerce GET /api/v1/wallet/current module-contract endpoint.
- Storefront authenticated account page and wallet panel.
- Dedicated Commerce SQL/API acceptance harness.
- Storefront route-stub Playwright acceptance.
security_boundaries:
- Require MemberAuthenticated and derive UserId only from the resolved principal.
- Query only that UserId; never accept a user id from query or body.
- Cursor is validated and used as a parameterized keyset boundary.
- UI is read-only and explicitly labels all displayed wallet values as local synthetic/mock
  data.
invariants:
- Ledger ordering is stable descending by CreatedAt then EntryId; pages do not duplicate
  entries.
- Exact credit replay and source identity/payload mismatch fail closed without a second
  balance effect.
- Synthetic fixture balance projection equals SyntheticCredit minus CheckoutDebit;
  no gift/refund rows.
- Anonymous users do not request or retain private wallet state; logout clears it.
- No external funding, settlement, gift credit, refund execution, direct balance write,
  or top-up UI is introduced.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - The existing endpoint remains GET /api/v1/wallet/current; query parameters are
    additive and default to the existing full-read behavior's newest-first first page.
  - The adopted runtime core34 OpenAPI surface remains unchanged; this endpoint is
    already handled by the Commerce module contract.
tests:
- Dedicated Commerce SQL acceptance for synthetic credit replay, mismatch, concurrency,
  projection rebuild, member ownership, keyset page boundaries, and cursor rejection.
- Release build of tests/Commerce/Commerce.Tests.csproj and apps/api/Api.csproj.
- Storefront npm run typecheck.
- Dedicated route-stub Playwright acceptance for login, anonymous access, logout clearing,
  failures, localized labels, and pagination.
observability:
- Do not log cursor contents, session data, balances, or member identifiers in new
  acceptance output.
documentation:
- Issue 02 synthetic-only scope and evidence.
- Dated architecture verification and implementation plan status, updated only after
  evidence passes.
