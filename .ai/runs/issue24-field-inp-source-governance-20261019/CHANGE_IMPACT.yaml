version: 1
change:
  id: issue24-field-inp-source-governance-20261019
  target:
    - Issue24 field INP evidence source and observation design
  target_paths:
    - docs/issues/kohami/24-core-mobile-accessibility-performance.md
    - docs/architecture/VERIFICATION.md
  summary: >-
    Documentation-only decision record: prefer desktop URL-level CrUX for
    public indexable localized core pages, and defer private cart/checkout
    field evidence to first-party RUM only after privacy and operational
    governance. Record a proposed RUM sample floor and 28-day period while
    keeping all formal field acceptance unverified. No SDK, telemetry, product
    behavior, API, database, or visitor data changed.
  risk_class: docs_style_test
inputs:
  - Current Issue24 acceptance scope and desktop localhost synthetic evidence.
  - Current Storefront route/indexing configuration and dependency inventory.
  - Official Chrome UX Report API and History API documentation.
outputs:
  - Issue24 field INP evidence source, period, sample handling, RUM proposal, and governance prerequisites.
  - Architecture verification decision and current unverified status.
data: []
events: []
consumers:
  - Issue24 owners deciding when public field evidence is available and sufficient.
  - Storefront product/privacy/operations owners evaluating future RUM governance.
  - Readers of the Issue24 ticket and architecture verification record.
security_boundaries:
  - No RUM SDK or event collection was introduced; no visitor or account data was read.
  - Proposed RUM fields exclude user, session, order, payment identifiers, free text, full query strings, DOM content, and per-interaction names.
invariants:
  - Local synthetic Event Timing, rAF, and TBT evidence is never labeled field INP.
  - Missing CrUX URL-level data or insufficient RUM samples remain UNVERIFIED.
  - Issue24 remains claimed and its performance acceptance remains unchecked.
