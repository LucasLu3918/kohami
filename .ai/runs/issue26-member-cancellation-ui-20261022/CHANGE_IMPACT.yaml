version: 1
change:
  id: issue26-member-cancellation-ui-20261022
  target: Member cancellation UI for eligible AwaitingPayment member orders, using the existing cancellation endpoint; no return request UI.
  target_paths:
  - apps/storefront/app/pages/account.vue
  - apps/storefront/app/components/commerce/MemberOrderList.vue
  - apps/storefront/app/components/commerce/MemberOrderAftercare.vue
  - apps/storefront/app/composables/useMemberOrderDetails.ts
  - apps/storefront/tests/issue26-member-cancellation.spec.ts
  - docs/issues/kohami/26-core-store-delivery-readiness.md
  - docs/architecture/VERIFICATION.md
  - .ai/runs/issue26-member-cancellation-ui-20261022/CHANGE_IMPACT.yaml
  summary: Render cancellation only when the owner-scoped order detail allows Cancel; send detail.version with CSRF, strong If-Match and idempotency; refresh after accepted or stale responses.
  risk_class: low
inputs:
- Member order summary GET /api/v1/orders.
- Owner-scoped order detail GET /api/v1/orders/{id} with version and actions.
- CSRF token from GET /api/v1/auth/csrf.
outputs:
- Eligible member cancellation command and localized accessible pending/error feedback.
data:
- Existing owner-scoped order and checkout records only; no schema, fixture or SQL changes.
events: []
consumers:
- MemberOrderList consumes existing Commerce order summary/detail and cancellation APIs.
- Account page retains mounted order cards during refresh so detail and stale-error state remain visible.
security_boundaries:
- Server remains authoritative for ownership, eligibility, version and CSRF/Origin checks.
- UI only renders backend-provided Cancel availability; no guest action or return request.
invariants:
- Send expectedVersion equal to detail version and quoted strong If-Match.
- Submit once per user action; stale 409/412 refreshes state and never blindly retries.
- Accepted 202 refreshes order summary and detail.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Uses existing runtime cancellation route and read APIs.
