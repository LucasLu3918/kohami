consumers:
- Commerce Aftercare API projection and Storefront ShipmentTimeline.
- Commerce SQL acceptance command that reads persisted Order and Shipment documents.
security_boundaries:
- The runner accepts only the marker-verified dedicated loopback fixture and Owner
  session.
- Shipment creation requires the trusted paid Primary collection; browser inputs do
  not supply payment truth.
- Customer-facing reads use the synthetic order capability and omit employee/event/reason
  fields.
invariants:
- Only the paid synthetic order may be shipped; milestone timestamps are monotonic
  UTC values.
- API projection, persisted SQL documents, and rendered Storefront timeline describe
  the same shipment.
- Acceptance uses mock logistics and makes no real carrier or SLA claim.
