version: 1
change:
  id: issue23-inspected-return-closure
  target:
  - src/Modules/Commerce/Infrastructure/AftercareRetention.cs
  - src/Modules/Commerce/Infrastructure/Worker.cs
  - tests/Commerce/Issue23DataLifecycleSqlAcceptance.cs
  - tests/Commerce/RefundAcceptance.cs
  - docs/issues/kohami/23-minimal-reports-data-lifecycle.md
  - docs/planning/kohami/commerce/RECONCILIATION_DATA_PLAN.md
  - docs/architecture/VERIFICATION.md
  summary: >-
    After a linked refund succeeds, persist a minimal UTC closure marker on the inspected
    Return. After one year, redact that Return's personal and unit details while keeping
    an order-linked summary and preserving financial and inventory evidence.
  risk_class: db_schema
inputs:
- Inspected Return and linked inspection-created RefundCase
- Trusted successful RefundOperation result and inspection-linked InventoryMovement
- UTC refund-success processing time
outputs:
- Idempotent aftercare closure marker on a successfully refunded inspected Return
- One-year redaction to a minimal order-linked Return summary
- Updated Issue 23 lifecycle and verification records
data:
- commerce.Documents Return, RefundCase, RefundOperation, and InventoryMovement bodies
- No schema migration; source RefundCase, RefundOperation, and InventoryMovement remain unchanged
events:
- Existing trusted refund-result processing is the closure source; no public event is added
consumers:
- MockWorker refund settlement and daily retention cleanup
- Commerce customer/admin read projections consuming Return documents
- RefundAcceptance and Issue23DataLifecycleSqlAcceptance in the Commerce SQL harness
- Issue 23 and architecture verification documents
security_boundaries:
- Only worker-validated successful refund evidence closes an inspected Return
- Retention updates remain scoped to the configured kohami_local dataset and Return documents
- No API caller gains cleanup or SQL write authority
invariants:
- Return must be Inspected and its inspection must link the same RefundCase and RefundOperation
- The closure requires the linked RefundOperation to be Succeeded and InventoryMovement to be Applied
- Pending, failed, unknown, mismatched, missing-evidence, unclosed, or boundary-age records remain unchanged
- Redaction preserves order/status/count and closure evidence references; linked financial/inventory evidence is unchanged
- Duplicate refund results and repeated retention runs are idempotent
- No public API, OpenAPI, schema, or event contract changes
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Return gains an optional internal closure object; public API and event shapes stay unchanged
  - Historical inspected Returns without a recorded closure remain untouched
tests:
- TDD SQL acceptance covers closed, pending, unclosed, mismatched, and exact-boundary Returns
- Refund acceptance verifies UTC closure is recorded once after linked refund success
- Dedicated SQL Server fixture and complete Commerce SQL harness
- Commerce Release build and git diff check
observability:
- Closure is committed atomically with trusted refund settlement; existing retention failure retry applies
documentation:
- docs/issues/kohami/23-minimal-reports-data-lifecycle.md
- docs/planning/kohami/commerce/RECONCILIATION_DATA_PLAN.md
- docs/architecture/VERIFICATION.md
