version: 1
change:
  id: issue25-s4-local-security-20261020
  target:
    - Repeatable S4 local anonymous-authentication and Origin/CSRF negative acceptance
  target_paths:
    - scripts/foundation/run-issue25-local-security-acceptance.py
    - tests/foundation/test_issue25_local_security_runner.py
    - .ai/runs/issue25-s4-local-security-20261020/CHANGE_IMPACT.yaml
  summary: >-
    Migrate the local-only acceptance runner to the dedicated kohami-sql-test
    fixture. Require its exact fixture-private profile, localhost:14333/Kohami,
    Strict TLS, and a successful Native dedicated-marker check before starting
    the prebuilt API. Keep the 11 anonymous GET and middleware-rejected POST
    checks without creating users, grants, orders, or persistent business data.
  risk_class: security_boundary
inputs:
  - path: apps/api/bin/Release/net10.0/Api.dll
    description: Existing prebuilt local API binary; runner does not modify it.
  - path: docs/contracts/runtime/Core.openapi.json
    description: Runtime API contract used by the local API process.
  - path: .local/kohami-sql/foundation/runtime-private.json
    description: Obsolete prior target; rejected by the runner.
  - path: .local/kohami-sql-test/identity/fixture-private.json
    description: Exact private profile required by the runner; 14333/Kohami, strict TLS, and KohamiSqlTestDedicated marker flag are validated without printing secrets.
outputs:
  - kind: local acceptance result
    description: HTTP status-only PASS/FAIL summary for 11 local security checks.
data: []
events: []
consumers:
  - path: scripts/foundation/run-issue25-local-security-acceptance.py
    status: Starts and stops only its own prebuilt API child process on an isolated loopback port.
  - path: docs/issues/kohami/25-local-security-and-consistency-evidence.md
    status: Future Issue25/S4 evidence consumer; full Issue25 remains open and this change does not edit its status.
security_boundaries:
  - API authentication middleware rejects anonymous wallet and order reads.
  - API security middleware checks Origin and antiforgery token before executing POST handlers.
  - Runtime config must be exactly `.local/kohami-sql-test/identity/fixture-private.json`, with KohamiSqlTestDedicated=true, port 14333, localhost/Kohami, Strict TLS, TrustServerCertificate=False, and localhost certificate name.
  - Before API startup, the runner must pass Native `fixture-status` for the same repo/profile with `KOHAMI_FIXTURE_PURPOSE=kohami-sql-test`; output is discarded and any failure blocks execution.
invariants:
  - Only GET requests and POST requests expected to be rejected by security middleware are issued.
  - No login, session creation, member/grant provisioning, SQL mutation, migration, seed, reset, payment, or order operation is performed.
  - API child process output is discarded; runner output excludes tokens, cookies, configuration values, and response bodies.
  - Passing this subset does not claim authenticated cross-member ownership coverage or full Issue25 completion.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
    - Adds local verification tooling and unit coverage only; no API, database, or runtime product behavior changes.
tests:
  - command: python3 -B -m unittest discover -s tests/foundation -p 'test_issue25_local_security_runner.py' -v
    result: PASS 7/7; synthetic guards cover exact profile, dedicated marker flag, rejected old profile/remote/wrong-port/non-Strict settings, and fail-closed Native marker probe.
  - command: make sql-test-check
    result: PASS FIXTURE_TLS_STRICT encrypted=1 database=PRESENT dedicated-marker=verified; read-only check against the already-running dedicated kohami-sql-test service.
  - command: git diff --check
    result: PASS.
  - command: >-
      python3 -B scripts/foundation/run-issue25-local-security-acceptance.py
      --api-dll /Users/lucas/Coding/main/kohami/apps/api/bin/Release/net10.0/Api.dll
      --runtime-config /Users/lucas/Coding/main/kohami/.local/kohami-sql-test/identity/fixture-private.json
      --contract "$PWD/docs/contracts/runtime/Core.openapi.json"
    result: BLOCKED before API startup with RUNTIME_CRYPTO_MATERIAL_UNAVAILABLE because configured sessionRingPath is not a usable directory; no HTTP checks ran and no key ring was created/copied.
