version: 1
change:
  id: issue26-wallet-sql-acceptance
  target:
  - tests/Commerce/WalletSqlAcceptance.cs
  - tests/Commerce/Program.cs
  - docs/issues/kohami/26-core-store-delivery-readiness.md
  - docs/architecture/VERIFICATION.md
  - .ai/runs/issue26-wallet-sql-acceptance/CHANGE_IMPACT.yaml
  summary: 'Issue26 local development acceptance only: add a marker-verified localhost:14349/Kohami runner for insufficient wallet balance rollback, same-key replay, and concurrent debit; update the ticket and verification ledger with actual results. Use unique synthetic @example.test members and test credits, do not change maintenance, demo data beyond temporarily reserved inventory, payment providers, or unrelated records.'
  risk_class: data
inputs:
- Local private runtime profile and provisioner credential for the exact kohami-sql fixture.
- Existing migration 0014, wallet debit / synthetic credit procedures, and CommerceService.Pay.
outputs:
- Repeatable SQL-backed acceptance runner for the three Issue26 wallet invariants.
data:
- Only unique synthetic users, wallet entries, checkouts, orders, reservations, inventory units, collections and idempotency rows; finally cleanup and residue checks.
events: []
consumers:
- CommerceService.Pay wallet branch and CommerceStore serialized transaction.
- tests/Commerce manual CLI acceptance entry point.
- Issue26 ticket and verification evidence.
security_boundaries:
- Require private .local/kohami-sql/foundation profiles, loopback localhost:14349, Kohami/kohami_local and exact development fixture GUID plus instance fingerprint.
- Use kohami_migrator only for synthetic credit and scoped fixture rows; API service path performs debit.
- Abort when the maintenance gate is enabled; never change gate state.
invariants:
- Insufficient balance leaves wallet balance/ledger, order, checkout, collection and held reservation unchanged.
- Same idempotency key and request returns the same response and commits one debit/collection.
- Two concurrent orders with exactly one order amount of synthetic credit produce one success and one insufficient result; no overdraft or partial loser state.
- Cleanup removes only uniquely generated synthetic records and restores the exact number of inventory units reserved by this runner.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Acceptance-only runner and records; no runtime contract or schema change.
