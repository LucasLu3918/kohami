  - docs/architecture/VERIFICATION.md
  - docs/planning/kohami/delivery/IMPLEMENTATION_PLAN.md
  - docs/README.md
  summary: Complete the mock return-support case lifecycle with customer-safe classification,
    first-response/escalation UTC evidence, rejection recovery, and inspection tracking.
  risk_class: api_contract
inputs:
- Own confirmed order and eligible free refund units, accessed by member or verified guest return capability.
- Current `support.respond` or `return.inspect` grants scoped to the parent order.
- Existing return request, inspection, inventory movement and refund-unit semantics.
outputs:
- Return state transition response and own-order return projection with case classification,
  customer-safe timeline, first-response/escalation UTC instants and elapsed seconds.
- Storefront tracking timeline for rejection, escalation, receipt and inspection outcomes.
data:
- Existing `commerce.Documents` Return JSON records; no SQL table/schema change.
- Rejected requests release only their reserved return units so a fresh idempotency key can reopen a request.
events:
- Requested, Rejected, Escalated, Accepted, Received and Inspected UTC history milestones;
  escalation remains a manual support action and does not move inventory or start a refund.
consumers:
- Commerce own-order API projection and runtime Core OpenAPI contract.
- Nuxt aftercare page and ReturnSupportTimeline component.
- Commerce SQL integration harness and Storefront Playwright acceptance.
security_boundaries:
- Customer reads remain restricted to own member order or verified guest read capability.
- Return creation remains restricted to own order/guest action and a delivered order.
- Escalation/accept/reject require current `support.respond`; inspection requires current
  `return.inspect`; staff actor identifiers and internal escalation reason are excluded from customer timeline.
invariants:
- First response time is the first authorized support action after request; it never resets.
- Escalation requires a reason and is manual; no calendar deadline, legal return window, or SLA is inferred.
- Rejection requires a customer-readable reason and releases only that return's still-processing units.
- A rejected unit may be requested again only through a new idempotency operation; duplicate active claims remain denied.
- Inspection still controls the single inventory movement; refund execution remains a separate later issue.
- All exposed times normalize to UTC and elapsed seconds are null until the relevant milestone exists.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - The own-order response adds typed optional case/timeline/inspection fields and one return state;
    no persisted SQL schema or existing route is removed.
  - Legacy Return documents without the new fields are projected with compatible defaults.
tests:
- Commerce SQL integration verifies rejection reason, reservation release/re-request, manual escalation,
  first-response/escalation elapsed time, safe own-order projection and inspection outcome.
- Runtime OpenAPI response validation rejects incompatible projection shapes.
- Storefront Playwright verifies customer timeline, localized status/reason and service-failure feedback.
- Dedicated SQL fixture acceptance verifies persisted state and leaves no business fixture changes.
observability:
- Return history remains the UTC source of truth; projection derives response/escalation elapsed seconds.
- No employee id, internal escalation reason, or calendar-based SLA is included in customer projection.
documentation:
- Record Issue 19 implemented mock scope, evidence and limitations in the ticket and VERIFICATION.
- Advance implementation order and docs entry to Issue 20 after acceptance.
