    for M0-A Identity, without changing product behavior or overstating M0-AC08/09
  risk_class: docs_style_test
inputs:
- Current approved local core34/native4 M0 scope and Identity BIND-07 / M0-AC08/09 requirements.
- IdentityAccess Domain, Infrastructure, SQL grant/schema, presentation routes, and their tests at the checked-out candidate.
- Private dedicated synthetic fixture configuration; only allowlisted fixture identity metadata was inspected.
outputs:
- Source-to-test mapping and exact candidate-bound Identity test result with limitations.
- Updated issue, implementation status, and verification evidence; no runtime behavior change.
data:
- Tests insert uniquely identified synthetic User, Session, Grant, Challenge, RecoveryCode, and audit rows in the dedicated demo_m0 SQL fixture, then delete those rows and restore the prior Maintenance flag.
events: []
consumers:
- SecurityEndpoints exposes the existing auth/MFA operations through the API host.
- Identity SQL tests and M0 issue/status documentation consume the documented Identity behavior.
security_boundaries:
- Existing password-stage, TOTP proof, recovery/rebind, current permission/scope, session version, and SQL principal boundaries are exercised; production behavior is unchanged.
invariants:
- Password-verified admin stage receives no management permissions.
- A TOTP step and recovery code are each consumed at most once under concurrent attempts.
- Recovery rebind does not restore administrative grants; expired or stale-version sessions do not resolve.
- M0-AC08/09 remain PARTIAL for untested Origin/CSRF, cross-user/nonce, logout, and SSR actor/cache cases.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Documentation and generated Intelligence refresh only; no API, SQL schema, event, or product runtime changes.
