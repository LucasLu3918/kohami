security_boundaries:
- POST /checkouts requires MemberAuthenticated session in the service layer
- Order contact email is bound to the authenticated member account
invariants:
- Anonymous principals cannot create a new checkout or order
- A checkout email cannot differ from the authenticated member account email
- Existing anonymous carts and quotes remain available before sign-in
- Login return creates a fresh quote before displaying checkout confirmation
