version: 1
change:
  id: demo-p4-admin-frontend
  target_paths:
    - apps/storefront/app/app.vue
    - apps/storefront/app/pages/admin/catalog.vue
    - apps/storefront/app/components/admin/AdminProductList.vue
    - apps/storefront/app/components/admin/AdminProductDetail.vue
    - apps/storefront/app/composables/useAdminAuth.ts
    - apps/storefront/app/layouts/admin.vue
    - apps/storefront/app/layouts/default.vue
    - apps/storefront/app/middleware/admin-auth.global.ts
    - apps/storefront/app/pages/admin/catalog/index.vue
    - apps/storefront/app/pages/admin/catalog/[id].vue
    - apps/storefront/app/pages/admin/login.vue
    - apps/storefront/app/types/admin-catalog.ts
    - apps/storefront/playwright.admin-ui.config.ts
    - apps/storefront/playwright.admin.config.ts
    - apps/storefront/tests/issue-demo-p4-admin.spec.ts
    - apps/storefront/tests/issue-demo-p4-admin-http.spec.ts
    - scripts/m0/verify-local-demo-admin-http.py
    - .ai/runs/demo-p4-admin-frontend/CHANGE_IMPACT.yaml
  summary: >-
    Replace the existing editable admin catalog screen with a GRL-inspired
    password-only admin login and protected, read-only product list/detail pages
    that use the existing CSRF, session, and catalog.read API contract. The UI
    contains no product or stock write controls and does not change storefront
    shopping behavior. Add isolated UI-mocked browser tests and a strict-TLS
    real-HTTP browser test; parameterize the backend acceptance runner so it
    can validate the dedicated synthetic fixture in this worktree.
  risk_class: product_behavior
inputs:
  - kind: user_decision
    description: Password-only authentication; defer MFA; dedicated demo fixture; read-only admin product catalog.
  - kind: api_contract
    description: Existing /api/v1/auth/csrf, /api/v1/auth/session and /api/v1/admin/products endpoints.
  - kind: architecture
    description: Storefront Nuxt/Vue Composition API conventions, session authorization and dataset-scoped catalog.read policy.
outputs:
  - kind: storefront_routes
    description: Admin login, protected catalog list, published product details and session logout UI.
  - kind: tests
    description: API-mocked UI interaction coverage and strict-TLS real HTTP browser acceptance against dedicated synthetic fixture.
data:
  - Reads only admin session state and published product/SKU projection returned by existing APIs.
  - No writes to product, inventory, customer, order, wallet or payment data.
events: []
consumers:
  - kind: browser_user
    description: Synthetic demo administrator can log in, inspect published products, and log out.
  - kind: acceptance_runner
    description: Existing marker-verified HTTP runner accepts a profile path confined to the candidate checkout's ignored .local directory.
security_boundaries:
  - Every admin route except login is session-gated on server and client; unauthenticated users are redirected to login.
  - The backend remains authoritative for AdminAuthenticated and catalog.read authorization; the UI cannot grant access.
  - UI exposes no admin write controls; API-level write denial remains covered by mock and real HTTP tests.
  - Login uses the existing CSRF and session cookie contracts; logout revokes the session.
  - Real browser configuration keeps TLS verification enabled. Local CA trust has not been installed into system trust/keychain.
invariants:
  - No MFA, Owner role, admin write route, product write, inventory write, or storefront cart/checkout behavior is introduced.
  - The storefront home remains on the default layout; the admin shell is scoped to admin routes.
  - Browser UI test config keeps ignoreHTTPSErrors false.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
    - Uses existing backend endpoints and response contracts; only replaces the legacy admin UI route and adds frontend routes/components/tests.
tests:
  - command: npm run typecheck
    result: PASS.
  - command: npm run build
    result: PASS.
  - command: python3 scripts/m0/verify-local-demo-admin-http.py --local-dir .local/kohami-demo-admin-frontend/environment
    result: PASS; dedicated marker-verified local-demo fixture, login/session cookie, 15-item list, published-only detail, write denial, logout and revoked-session denial.
  - command: KOHAMI_STOREFRONT_ORIGIN=http://127.0.0.1:3008 ./node_modules/.bin/playwright test tests/issue-demo-p4-admin.spec.ts --config=playwright.admin-ui.config.ts --reporter=line --trace=off
    result: PASS; 5 UI-mocked Playwright cases cover anonymous redirect, noncatalog admin route redirect, login, list/detail, logout/revocation, write denial, and the login page skip-link target. Strict TLS validation setting retained.
  - command: KOHAMI_STOREFRONT_ORIGIN=https://localhost:3017 KOHAMI_ADMIN_CREDENTIALS_PATH=.local/kohami-demo-admin-frontend/environment/local-demo-admin-credentials.json ./node_modules/.bin/playwright test tests/issue-demo-p4-admin-http.spec.ts --config=playwright.admin.config.ts --reporter=line --trace=off
    result: BLOCKED; API accepts the local CA through process-scoped NODE_EXTRA_CA_CERTS, while Chrome rejects the local HTTPS certificate with ERR_CERT_AUTHORITY_INVALID. No trust-store mutation or TLS bypass was performed; repeat after approved local browser trust flow.
  - command: KOHAMI_STOREFRONT_ORIGIN=http://127.0.0.1:3008 ./node_modules/.bin/playwright test tests/issue-demo-p3-storefront.spec.ts --config=playwright.config.ts --reporter=line --trace=off
    result: BLOCKED; after correcting NUXT_API_ORIGIN from its default port 5080 to the live fixture API at 5096, SSR rendered 15 product cards without layout errors. The existing P3 spec then failed because its hard-coded mock product names (for example リネンフリルブラウス) do not exist in the P4 fixture's 15-item product set; P3 shopping regression remains unverified against its matching fixture.
observability:
  - Existing bounded API error responses are surfaced as login and catalog status messages; no credentials or tokens are logged.
documentation:
  - docs/planning/kohami/delivery/LOCAL_DEMO_RUNBOOK.md
impact_graph: /private/tmp/kohami-demo-p4-frontend/.ai/intelligence/IMPACT_GRAPH.yaml
unknowns:
  - id: local-browser-ca-trust
    description: >-
      The strict-TLS Playwright browser cannot validate this isolated fixture's
      localhost CA until the operating-system/browser trust flow is completed.
    disposition: ACCEPTED_LIMITATION
    resolution: >-
      Keep strict verification enabled. Obtain the user's approval for the
      documented local trust step, then rerun the real browser HTTP acceptance.
      API-level real HTTP acceptance and API-mocked browser interaction tests
      pass independently.
    evidence:
      - kind: repository_file
        path: docs/planning/kohami/delivery/LOCAL_DEMO_RUNBOOK.md
        sha256: d151e3fa755dfcbc80baa9e1f5312e7383aac95e6a0e65946b140fe72a7e541c
      - kind: repository_file
        path: apps/storefront/playwright.admin.config.ts
        sha256: 61da9c975b70247d6194ba147dec90fb311969e3f05e0c0284ec9d1ccfd2fe0a
    review:
      status: APPROVED
      reviewer: human
      approval_reference: Root reviewed and confirmed this is an unresolved local trust-flow blocker; do not mutate trust settings or bypass TLS before user decision.
      reviewed_at: '2026-10-21T14:30:00+08:00'
scope_review:
