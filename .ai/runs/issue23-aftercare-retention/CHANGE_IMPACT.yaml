  summary: >-
    Apply the approved Issue 23 aftercare retention subset: redact personal and
    operational details after evidence-backed UTC closure, retain a minimal order
    history summary, and preserve financial and inventory evidence.
  risk_class: db_schema
inputs:
- Commerce Shipment and Return documents plus their terminal state history
- Existing UTC retention targets: delivery 180 days; rejected customer-care return one year
- RefundCase and InventoryMovement links used to preserve aftercare evidence
outputs:
- Idempotent Worker redaction of expired delivered/returned Shipment details
- Idempotent redaction of explicitly Rejected Return details with no linked evidence
- Minimal order-linked status and timestamp summaries
- Issue 23 policy and verification records
data:
- m0commerce.Documents Shipment and Return JSON bodies; no schema migration
- Related RefundCase and InventoryMovement documents are read to guard against removal of evidence
events: []
consumers:
- MockWorker daily retention cleanup
- Commerce document read models using stable id/order/state fields
- Issue23DataLifecycleSqlAcceptance and full Commerce SQL harness
- Issue 23 planning and architecture verification documents
security_boundaries:
- Retention queries are scoped to configured demo_m0 dataset and terminal document kinds
- Worker performs updates using its existing document update authority
- No API user receives cleanup or SQL delete authority
invariants:
- Only a valid final UTC history event matching the terminal state proves closure
- Nonterminal, boundary-age, malformed-history and unclosed inspected-return records are retained
- Rejected Return with linked RefundCase or InventoryMovement retains all source details
- Order, Collection, payment, refund, invoice, inventory and audit evidence are unchanged
- Redaction retains the minimum history projection and is idempotent
- Public API/OpenAPI and event contracts remain unchanged
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Existing document shape is rewritten in place while preserving identifiers and order history summary fields
  - No public routes, database schema or event contracts changed
