inputs:
- User selected read-only storefront/admin display on demo-current plus headless
  acceptance on a separate dedicated fixture; interactive reusable credentials are
  out of scope.
- Existing member password session, CSRF API, cookie proxy, account returnTo behavior,
  and P5 browser/API/SQL acceptance contract.
outputs:
- Verified member login return navigation to the requested localized cart route.
- Sanitized browser evidence sufficient to distinguish route render failure from a
  delayed or failed client navigation.
data:
- One-run synthetic member and wallet data only in the dedicated local-demo SQL
  fixture; exact cleanup restores inventory and preserves maintenance.
- Passwords, session cookies, CSRF tokens and SQL connection strings remain private.
events: []
consumers:
- Storefront account and cart route components and their shared member-session state.
- Nuxt same-origin API proxy and ASP.NET session/CSRF handlers.
- P5 Playwright acceptance runner and its exact synthetic-member/SQL cleanup.
security_boundaries:
- No writes to demo-current or protected fixtures; live acceptance targets only the
  marker-verified dedicated fixture.
- Existing secure-cookie, CSRF, same-origin and session authorization behavior stays
  unchanged.
invariants:
- A successful login must render the localized return route before the browser test
  proceeds to catalog, cart, wallet payment and SQL assertions.
- Failed login must remain on the account page and must not issue checkout writes.
- Run cleanup removes only the synthetic actor's rows, restores the expected stock
  delta, and preserves maintenance and fixture catalog data.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - No API, cookie, SQL schema, event, or contract changes are in scope.
tests:
- Storefront P5 live Playwright login, localized return, wallet checkout, confirmation
  and API/SQL reconciliation against dedicated fixture.
- Storefront typecheck and build; P5 runner contract tests; complete Integration Gate
  when final candidate is fixed.
