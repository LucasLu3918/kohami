change:
  id: issue11-canonical-cart-acceptance
  target:
  - Issue11 acceptance runner, synthetic fixture helpers, and isolated browser tests.
  target_paths:
  - .ai/runs/issue11-canonical-cart-acceptance/CHANGE_IMPACT.yaml
  - apps/storefront/playwright.issue11.config.ts
  - apps/storefront/tests/issue11-cart.spec.ts
  - docs/issues/kohami/11-sku-cart-price-review.md
  - scripts/foundation/run-issue11-cart-acceptance.py
  - tests/Commerce/Issue11CartAcceptance.cs
  - tests/Commerce/Program.cs
  - tests/foundation/test_issue11_cart_runner.py
  summary: >-
    Make Issue11 acceptance run only against the marker-verified canonical SQL test fixture,
    fail closed before starting services when Maintenance is required, isolate API and
    storefront ports, restore and verify any synthetic inventory mutation, and cover cart
    retry behavior using browser-only API mocks. This changes test infrastructure, not
    storefront production behavior or runtime contracts.
  risk_class: private_leaf
inputs:
- canonical kohami-sql-test private profile, validated for dedicated marker and strict TLS
- synthetic API responses from Playwright route handlers
outputs:
- safe runner status indicating whether the canonical fixture is eligible for acceptance
- temporary private cart evidence and inventory state files, removed during cleanup
- browser assertions for retry behavior and cart state
data:
- No SQL write was executed in this run; fixture Maintenance was REQUIRED and runner preflight stopped before starting API, Nuxt, or Playwright.
- SQL helper mutations remain constrained to the canonical dedicated kohami-sql-test profile and kohami_local dataset, with readback verification and restoration.
events: []
consumers:
- scripts/foundation/run-issue11-cart-acceptance.py invokes the Commerce acceptance helper and isolated Playwright suite.
- tests/foundation/test_issue11_cart_runner.py covers fail-closed profile, maintenance, port, and private-path behavior.
- apps/storefront/tests/issue11-cart.spec.ts exercises cart behavior against synthetic browser route responses.
security_boundaries:
- Require the canonical localhost:14333 fixture marker and strict TLS before SQL helper access.
- Stop before launching runtime/browser services when Maintenance is REQUIRED.
- Bind only isolated loopback ports 5081 and 3001; never signal processes on occupied ports.
- Keep private runtime override, evidence, and inventory state files owner-only and remove runner-owned artifacts during cleanup.
invariants:
- No production checkout, cart, payment, identity, or API contract behavior changes.
- No guest or member order is created by the mock-only retry test.
- Any synthetic inventory mutation must be restored to the exact recorded original state and verified by direct SQL readback.
- A mock-only pass does not mark Issue11's SQL-backed acceptance complete.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Changes are limited to acceptance tooling, test helpers, test cases, and Issue11 evidence.
