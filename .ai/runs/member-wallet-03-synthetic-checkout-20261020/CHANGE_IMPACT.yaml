  summary: member-wallet/03 local synthetic-only atomic wallet checkout; verify authenticated
    ownership, server quote, SQL transaction, replay conflict, multi-process races,
    lost-response recovery, and browser/API path; no formal payment/refund
  risk_class: payment
inputs:
- Existing authenticated member identity, server-owned checkout snapshot and expected
  aggregate version.
- Existing dedicated, strict-TLS localhost:14349/KohamiM0/demo_m0 fixture and synthetic
  test-credit command. Real HTTP acceptance uses a newly provisioned, isolated
  localhost:14336-14399 SQL fixture under a unique ignored .local path and never
  changes the protected localhost:14349 fixture.
outputs:
- One committed mock wallet payment, ledger debit, collection, consumed reservation,
  confirmed order and idempotency response; or an unchanged transaction with no
  checkout, order, or inventory side effects.
data:
- WalletAccounts and append-only WalletLedger.
- Checkout, Order, Reservation, Collection, RefundUnits, WalletPayment and Idempotency.
events:
- Existing Commerce transaction persistence and Outbox behavior; no new event schema
  planned unless tests uncover a required contract gap.
consumers:
- Authenticated Commerce `POST /api/v1/checkouts` optional wallet payment mode; omission preserves the legacy mock checkout path.
- Storefront member checkout and payment result consumers.
- Dedicated Commerce SQL acceptance runner and Issue03 verification documentation.
- Isolated fixture provisioning and live HTTP acceptance runner; cleanup is scoped
  to the unique fixture directory and Compose project created by this run.
security_boundaries:
- Only the authenticated owner member may choose the atomic wallet checkout path;
  guests remain unable to spend a member balance.
- Synthetic test credit is only prepared by fixture tooling; API users cannot increase
  balances or write ledger entries directly.
- SQL tests must verify the exact fixture marker, loopback endpoint, strict TLS, private
  config permissions, cleanup and maintenance preservation.
- Live HTTP acceptance provisions a distinct synthetic-only fixture and preserves the
  existing protected fixture, its maintenance state and all existing rows.
invariants:
- Cart/quote/fee/SKU/stock validation, wallet debit, ledger, collection, refund-unit
  allocation, reservation consumption, checkout/order state and idempotency response
  commit in one SQL transaction.
- Insufficient balance and any downstream transaction failure leave no checkout, order,
  stock/reservation change, debit, collection, or confirmation.
- Same key/same request recovers the original result; same key/different request is
  rejected; concurrent requests cannot double debit, overdraw or oversell.
- Scope is local synthetic-only. No actual funding, formal legal/payment decision,
  production refund, external provider, deployment or collection.
compatibility:
  api_breaking: null
  migration_required: null
  reasons: []
tests:
  - "Dedicated live SQL/API handler: insufficient funds and post-debit downstream failure roll back all state; exact replay, conflicting replay, lost-response recovery and authenticated ownership are verified."
  - "Independent operating-system processes race for one account balance and one remaining stock unit; persisted state confirms a single winner and no partial loser writes."
  - "Storefront Chromium browser journey: member success, insufficient-balance display, and guest mock-payment preservation; API requests are route-mocked."
  - "Dedicated live HTTP/browser acceptance: synthetic member login cookie, CSRF and Origin enforcement, wallet checkout through API host, marker-guarded SQL readback and scoped cleanup."
  - "Release builds, Commerce contract/safety checks, Storefront typecheck/Playwright, relevant runner tests and git diff --check."
