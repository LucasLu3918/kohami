security_boundaries:
- Test uses only the migrator connection in the newly provisioned disposable SQL fixture; it creates no Owner, grant, or native authority.
- Temporarily disables table constraints only inside the disposable fixture to create adversarial other_dataset rows, then deletes those rows before checking constraints again.
- Fixture port selection cannot target remote hosts or ports outside 14336-14399; SQL remains Encrypt=Strict with certificate and hostname validation.
invariants:
- Reads remain scoped to demo_m0 when identical IDs exist under other_dataset.
- SQL constraints are revalidated after synthetic rows are removed.
compatibility:
