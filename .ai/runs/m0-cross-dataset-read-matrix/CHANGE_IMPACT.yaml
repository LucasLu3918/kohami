- Commerce dedicated SQL acceptance assertions for CheckoutStatus, product catalog, Order summary, reconciliation, and resource scopes
- Dedicated fixture status, SQL provisioning, bootstrap checks and generated test connection settings consistently use the selected port
- Selected fixture ports remain loopback-only and bounded to 14336-14399
data:
- Dedicated fixture only: temporary synthetic rows with the same resource IDs in demo_m0 and other_dataset
- Fixture cleanup deletes synthetic rows and revalidates/re-enables constraints in finally
- The user-approved provisioning workflow removes the created compose project, volumes and private fixture material after this acceptance run
events: []
consumers:
