  summary: 'Close authorized M0-AC08/09 Identity acceptance gaps: source-bound tests
    for Origin/CSRF, challenge actor/nonce/expiry, logout/revocation, and SSR persona/cache
    isolation. Preserve existing M0 scope, dedicated synthetic fixture, and any uncovered
    limitation.'
  risk_class: security_boundary
inputs:
- Existing M0 security contract and AC08/09 criteria in READINESS.md and SOURCE_BINDING_PLAN.md.
- API middleware, Identity SecurityService, SQL stored procedures, Nuxt SSR/proxy,
  existing dedicated-fixture runners.
outputs:
- API boundary probes and SQL-backed Identity regression cases.
- Browser logout, replayed-cookie rejection, and SSR back-navigation isolation evidence.
- Updated canonical verification and per-case status.
- Runbook entry for the bounded identity-only acceptance command.
data:
- Dedicated demo_m0 fixture only; random synthetic Identity rows, cleaned by fixture
  teardown.
- No reset, migration, or changes to retained fixture/volumes.
events:
- No external event/provider behavior is in scope.
consumers:
- ASP.NET Core API auth endpoints and middleware.
- IdentityAccess SQL procedures for sessions, challenges, grants and recent proofs.
- Nuxt SSR, same-origin API proxy, Playwright browser acceptance runner.
security_boundaries:
- Origin and antiforgery validation before mutating API handlers.
- Challenge binds current session, actor, nonce, intent and unexpired window.
- Logout/revocation invalidates prior session and proof material.
- SSR/browser history must not expose authenticated persona data after logout.
invariants:
- Password-only stage has no admin permission.
- Challenge failure never grants a session; a different actor or nonce cannot consume
  another session's proof.
- Expired challenge is rejected at expiry equality.
- Revoked session/proof cannot authorize a subsequent operation.
- Private API responses and SSR routes remain no-store.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - No wire-contract or schema change is intended; any behavior fix must preserve
    adopted API shapes.
tests:
- Dedicated Identity SQL suite with actor/nonce/expiry/logout/revocation cases.
- Real API middleware probes against the dedicated fixture for wrong Origin and missing
  antiforgery token.
- Real Playwright SSR/browser history check on the dedicated fixture.
observability:
- Record only pass/fail counts and fixed stage names; do not log credentials, cookies,
  TOTP values, or connection strings.
