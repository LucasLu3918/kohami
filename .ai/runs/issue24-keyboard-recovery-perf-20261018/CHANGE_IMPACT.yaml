  summary: >-
    Extend Issue24 with keyboard-driven browser acceptance for checkout status
    success, rejection, unknown, and failed-refresh recovery. Capture only bounded,
    local browser evidence; no payment processing or API behavior changes.
  risk_class: private_leaf
inputs:
  - Synthetic API status responses supplied by Playwright route mocks.
  - Existing Storefront checkout result route and localized skip navigation.
outputs:
  - Keyboard-operable checkout status refresh with accessible state/error announcements.
  - Issue24 and architecture verification evidence with explicit device and metric limits.
  - Local 30-navigation homepage diagnostic sample for LCP/CLS and keyboard Event Timing.
data:
  - No persistent application data; browser API responses are synthetic route mocks.
events: []
consumers:
  - apps/storefront/app/pages/checkout/[id].vue renders state and refreshes status.
  - apps/storefront/app/app.vue provides the shared skip link.
  - Playwright Issue24 acceptance consumes the rendered accessibility contract.
security_boundaries:
  - No payment provider, credentials, card data, SQL fixture, or real transaction is used.
  - Checkout state is provided by synthetic status API mocks; the test does not introduce trusted client results.
invariants:
  - A failed refresh preserves the last server result and transaction snapshot.
  - Unknown remains unconfirmed and does not recommend restarting payment.
  - The refresh control remains keyboard reachable and keeps focus through state updates.
