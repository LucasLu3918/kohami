- path: tools/native-operations/SqlProvision.cs
  status: SQL provisioning continues to use values loaded from private fixture files
    and parameterized query values.
security_boundaries:
- description: Generic-secret-assignment and all high-confidence credential detectors
    stay enabled; one exact path+detector+16-character SHA-256 prefix exception expires
    after 90 days, with no inline suppression or broad path exclusion.
  disposition: preserved
- description: Candidate scan remains strict, all-path, exact-tree and base..head
    history bound through Integration Gate candidate_context.
  disposition: required
- description: The 8,000,000-byte text ceiling remains finite and the existing 8 MiB
    media ceilings remain unchanged.
  disposition: bounded
- description: Private .local credential files are neither read nor included in the
    candidate.
  disposition: preserved
- description: Vendored AIPS scanner snapshot is versioned and bound by the Gate scanner
    hash; future scanner upgrades require an explicit project update and regression
    run.
  disposition: documented_limit
invariants:
- Secret scan policy contains only the approved exact expiring SQL DDL allowlist entry;
  no other exceptions are added.
- Existing generated_paths and lockfiles.path_patterns / disabled_detectors match
  the active AIPS policy.
- Scanner detector set and candidate history behavior match the active AIPS implementation
  at implementation time.
- Pinned Gate provenance identifies AIPS version 0.83.0 / source revision 6cfcdeb2edaf67b3e48aa70adbcfd8aebd416dbd;
  only repository-root resolution is changed, and unsupported optional evidence features
  must fail closed.
- SQL credentials remain sourced from private fixture config and passed as runtime
  values; no credential literal is added.
- Public API, SQL schema, SQL permissions, business data, events, session contract
  and checkout behavior do not change.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Scanner configuration and source-expression refactors do not change runtime API
    or persisted product data contracts.
