- path: tools/native-operations/SqlProvision.cs
  description: Dynamic private-fixture SQL credentials and generated demo passwords
    reported by the existing detector.
outputs:
- kind: validation_profile
  description: Project-owned docs/quality/VALIDATION_PROFILE.yaml binds exact candidate
    secret scan and relevant deterministic checks.
- kind: secret_scan_policy
  description: Project-owned copy of active AIPS policy raises only max_file_bytes
    to 8000000 and preserves detectors, generated paths, lockfile behavior, and empty
    allowlist.
- kind: scanner
  description: Project-owned pinned AIPS scanner and parsing helpers permit Gate repository
    binding without relying on an external scanner path.
- kind: regression_test
  description: Test validates strict profile/policy invariants and scan-size bound
    without embedding credential values.
- kind: source_refactor
  description: Thirteen false-positive dynamic assignments are expressed clearly while
    preserving runtime credential flow; one exact SQL DDL finding is covered by a
    temporary 90-day fingerprint exception.
- kind: fixed_validation_gate
  description: Project-owned, pinned Gate resolves repository root from Git and provides
    tested exact-candidate validation independent of the global AIPS installation.
- kind: minimum_coverage_contract
  description: The fixed Gate minimum contract requires Release build and M0 tests
    for src/** and apps/api/**, plus Nuxt typecheck/build for apps/storefront/**;
    contract omissions, weaker check paths, non-required checks, and skipped matching
    checks block.
- kind: strict_scan_root_binding
  description: Candidate scanner binding requires --root . from repository root, forbids
    narrowing --path, and retains all-path candidate_context.
- kind: coverage_regression_tests
  description: Examples prove API-only and storefront-only source candidates select
    their minimum required checks, while profile narrowing/removal or scanner root/path
    narrowing is rejected.
- kind: storefront_smoke_scope
  description: Existing Playwright browser flows remain deferred to P5 because they
    require a running HTTPS storefront, API fixture service, and local certificate
    material; P4 Gate adds deterministic Nuxt typecheck/build.
data:
- description: The change reads no local credential material and modifies no SQL fixtures,
    database rows, API dataset, or product state.
  classification: none
- description: Existing private fixture config remains the sole source for generated
    SQL credentials; generated user/session test credentials remain ephemeral.
  classification: synthetic_private_runtime_values
