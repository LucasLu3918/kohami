- path: python3 scripts/security/integration_gate.py
  status: Project-owned pinned Gate receives exact base/head and resolves the Git
    top-level as repository root before binding scanner/policy.
- path: project-owned exact-candidate secret scanner
  status: Scans committed head tree and every added/modified blob and commit message
    in base..head.
- path: tests/Commerce/Wallet03HttpAcceptance.cs
  status: Dynamic credential and token construction behavior must remain equivalent.
- path: tests/Commerce/Wallet03SqlAcceptance.cs
