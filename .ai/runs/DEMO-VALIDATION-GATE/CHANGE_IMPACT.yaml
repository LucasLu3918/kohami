version: 1
change:
  id: DEMO-VALIDATION-GATE
  target:
  - Add a project-owned Integration Gate validation profile and strict candidate scan
    policy.
  - Vendor the pinned AIPS scanner implementation and its bounded parsing helpers
    so the Gate can bind an in-repository scanner.
  - Refactor thirteen reviewed dynamic credential assignments and permit one exact,
    expiring SQL DDL finding by path, detector, fingerprint, reason, and 90-day expiry.
  - Vendor the minimum required AIPS Integration Gate and helper code at the pinned
    AIPS revision; resolve the repository root from Git rather than the installed
    script location.
  - Add regression coverage for exact allowlist scope, altered/unrelated findings,
    and repository-root discovery.
  - Enforce an immutable minimum coverage contract for API/server and storefront candidate
    paths; API/server sources require Release build plus M0 contract tests, and storefront
    sources require Nuxt typecheck and production build.
  - Bind strict candidate secret scanning to repository root and complete candidate
    paths; reject narrowed --root/--path arguments.
  - Add fail-closed regressions showing pure API/storefront source changes trigger
    required checks and narrowed or removed coverage/scanner scope blocks the Gate.
  target_paths:
  - docs/README.md
  - docs/quality/INTEGRATION_GATE.md
  - docs/quality/SECRET_SCAN_POLICY.yaml
  - docs/quality/VALIDATION_PROFILE.yaml
  - docs/quality/requirements-validation.txt
  - scripts/security/aips_common/__init__.py
  - scripts/security/aips_common/canonical.py
  - scripts/security/aips_common/paths.py
  - scripts/security/aips_common/patterns.py
  - scripts/security/check_secret_leakage.py
  - scripts/security/integration_gate.py
  - scripts/security/media_metadata.py
  - scripts/security/observed_stage.py
  - scripts/security/review_evidence.py
  - scripts/security/test_integration_gate.py
  - tests/Commerce/Wallet03HttpAcceptance.cs
  - tests/Commerce/Wallet03SqlAcceptance.cs
  - tests/Commerce/WalletSqlAcceptance.cs
  - tests/Identity/SqlIdentityTests.cs
  - tests/Native/SqlBaselineAdoptionAcceptance.cs
  - tests/Native/SqlMigrationAcceptance.cs
  - tests/m0/test_demo_validation_profile.py
  - tools/native-operations/Broker.swift
  - tools/native-operations/SqlProvision.cs
  summary: Make exact-candidate validation reproducible inside KOHAMI by binding the
    Gate to project-owned, version-pinned AIPS scanner and Integration Gate code.
    Keep every detector active, scan all paths and candidate history, permit only
    the approved exact SQL DDL fingerprint for 90 days, and remove verified dynamic-
    value false positives through clearer source structure.
  risk_class: standard
