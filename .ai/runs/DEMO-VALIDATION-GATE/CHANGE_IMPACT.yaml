- path: tests/Commerce/Wallet03SqlAcceptance.cs
  description: Dynamic synthetic SQL credential reads reported by the existing detector.
- path: tests/Commerce/WalletSqlAcceptance.cs
  description: Dynamic synthetic SQL credential reads reported by the existing detector.
- path: tests/Identity/SqlIdentityTests.cs
  description: Randomly generated identity test password reported by the existing
    detector.
- path: tests/Native/SqlBaselineAdoptionAcceptance.cs
  description: Dynamic dedicated-fixture credential read reported by the existing
    detector.
- path: tests/Native/SqlMigrationAcceptance.cs
  description: Dynamic dedicated-fixture credential read reported by the existing
    detector.
- path: tools/native-operations/Broker.swift
