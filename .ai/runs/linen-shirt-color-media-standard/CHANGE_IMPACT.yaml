version: 1
change:
  id: linen-shirt-color-media-standard
  target: Storefront 商品詳情頁的選色媒體呈現與 UX 契約
  target_paths:
  - apps/storefront/app/pages/products/[slug].vue
  - apps/storefront/app/utils/demo-api.ts
  - apps/storefront/app/utils/product-media-alt.ts
  - apps/storefront/public/demo-assets/products/color-variants/linen-shirt-powder_blue.png
  - apps/storefront/public/demo-assets/products/color-variants/linen-shirt-muted_sage.png
  - apps/storefront/public/demo-assets/products/color-variants/ASSET_MANIFEST.json
  - UX-CONTRACT.md
  - docs/planning/kohami/experience/VISUAL_SYSTEM.md
  summary: 棉麻襯衫商品顏色切換、商品單品圖與模特穿搭示意分流，並記錄商品媒體 UX 標準
  risk_class: private_leaf
inputs:
- Existing product SKU color order and selected color query
- Mock catalog media URL, colorId, kind, and concept metadata
outputs:
- Product-only gallery displays media for the selected color
- Outfit inspiration displays only matching-color concepts in a separate section
- Missing product media has a localized state; concept art is identified as non-photographic
- Color choices retain catalog order and garment sizes use common apparel ordering
- Only the selected SKU number and stock details appear in the purchase flow
data:
- Mock-only media role and concept metadata; no persistence or API schema migration
events:
- Shopper selects a color; route query and both media sections update to that color
consumers:
- Product detail page consumes catalog media and SKU variants
- Synthetic catalog provides the linen-shirt product and color-matched outfit images
- Product media alt helper localizes product and outfit image descriptions
- Product cards keep using the first media item; card behavior is unchanged
security_boundaries:
- Storefront presentation only; server remains authoritative for SKU availability, price, and cart writes
invariants:
- The main product gallery contains garments only and never model imagery
- A selected color never falls back to another color's product image
- Outfit concepts never imply verified SKU photography or actual fit
- Color selection preserves existing SKU and cart behavior
compatibility:
  api_breaking: false
  migration_required: false
  reasons: []
tests:
- command: npm run typecheck
  result: PASS
- command: npm run build
  result: PASS; existing Nitro ES2019 BigInt warnings remain
- command: Built Nuxt page reviewed in the in-app browser at 390px and 1280px; colors, matching media, image loads, overflow, and console output checked
  result: PASS; no console errors or warnings and no horizontal overflow
observability:
- No new telemetry or persistent runtime logging
documentation:
- UX-CONTRACT.md
- docs/planning/kohami/experience/VISUAL_SYSTEM.md
