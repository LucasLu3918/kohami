  summary: Finish the existing Issue 09 browser acceptance by correcting its visible
    stock assertion, then implement Issue 10 home search and filtering using the accepted
    M1 catalog contract. Include public search/query contract, same-SKU variant filtering,
    published-only visibility, loading/empty/failure/availability states, keyboard/mobile
    accessibility and targeted acceptance. Do not change payment/reservation or real
    commerce provider behavior.
  risk_class: medium
