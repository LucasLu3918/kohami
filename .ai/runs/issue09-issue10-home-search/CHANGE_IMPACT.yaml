outputs:
- GET /api/v1/products supports validated q, locale, variant, availability, sort and cursor inputs
- Homepage exposes search, filters, results, empty/error/loading and stock states with product links
data:
- Read-only filtering over identity_access.CatalogProducts, identity_access.CatalogProductSkus and commerce.Inventory
- No schema, seed, reservation, price-write or order snapshot change
events: []
consumers:
- Nuxt homepage product discovery and existing product detail route
