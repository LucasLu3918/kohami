version: 1
change:
  id: issue24-add-quote-cls-20261019
  target:
    - Desktop trilingual add-to-cart and checkout-quote error/retry CLS lab evidence
    - Issue24 ticket and canonical verification log update
  target_paths:
    - docs/architecture/VERIFICATION.md
    - docs/issues/kohami/24-core-mobile-accessibility-performance.md
  summary: >-
    Measure add-to-cart failure/retry and checkout quote failure/retry interaction
    layout shifts on the trilingual desktop shopping journey and record only
    evidence-supported findings. Browser API requests use Playwright route stubs
    against the isolated localhost production preview; no product, API, SQL,
    payment, visitor telemetry, or external service is changed. Preserve existing
    unrelated .ai work; Issue24 stays claimed and formal field metrics/SLA remain
    unverified.
  risk_class: docs_style_test
inputs:
  - kind: requirements
    description: N01 CLS P75 <= 0.1; confirmed desktop shopping/payment route scope; no RUM or production domain.
  - kind: local_measurements
    description: >-
      Playwright Chrome runner measures four synthetic stages in zh-TW, ja, and en;
      each locale/stage has 30 samples, expected 503 failures and 200 retries, raw
      layout-shift entries, hadRecentInput flags, and CLS session-window summaries.
outputs:
  - kind: documentation
    description: Issue24 ticket and verification log describe the run, conditions, interpretation, and limits.
  - kind: local_evidence
    description: Runner and raw metrics JSON saved under the new run directory; excluded from product commit.
data: []
events: []
consumers:
  - kind: storefront_documentation_reader
    description: Readers of Issue24 acceptance ticket and canonical verification log.
  - kind: validation_planner
    description: N01 owner assessing desktop lab coverage and unresolved field evidence.
  - kind: issue24_measurement_runner
    description: >-
      ProductDiscovery emits add-to-cart to apps/storefront/app/pages/index.vue,
      which calls the page cart mutation; checkout quote uses that same page's
      createQuote handler. Directly inspected ProductDiscovery.vue, index.vue,
      cart.vue, and useCommerceCart.ts. Quote lab interaction intentionally ran on
      the same home journey to avoid preview SSR state reset on navigation.
security_boundaries:
  - description: >-
      Browser API requests are intercepted by Playwright synthetic route stubs;
      browser origin is localhost only. No SQL, real API, payment, LAN, RUM, or
      visitor data is used.
invariants:
  - CLS excludes layout-shift entries with hadRecentInput=true and uses maximum session window with 1 second gap and 5 second cap.
  - A computed CLS of zero here does not mean there were no user-triggered layout shifts; raw excluded entries and limitation are recorded.
  - Lab results do not establish field CLS, INP, Core Web Vitals, or production SLA.
  - Issue24 remains claimed and the performance checkbox remains incomplete.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
    - Documentation and local measurement evidence only; no product behavior or contract change.
tests:
  - command: node --check .ai/runs/issue24-add-quote-cls-20261019/measurement.mjs
    result: PASS; measurement ES module syntax valid.
  - command: >-
      NO_PROXY='*' no_proxy='*' KOHAMI_STOREFRONT_ORIGIN=http://127.0.0.1:3002
      node .ai/runs/issue24-add-quote-cls-20261019/measurement.mjs
    result: >-
      PASS; 90 journeys, 360 stages, 12 locale/stage groups x 30 samples; 90 expected
      503 and 90 expected 200 responses for both API operations; raw metrics saved.
  - command: node --input-type=module -e '<metrics integrity assertion>'
    result: >-
      PASS; checked 90 journeys, 360 stages, 12 groups x 30, statuses and raw-entry
      hadRecentInput distribution. All recorded entries were excluded by CLS as
      recent-input shifts; this is explicitly documented and not interpreted as no movement.
  - command: git diff --check
    result: PASS; no whitespace errors in the documentation diff.
observability:
  - >-
    Raw layout-shift entries include startTime, value, hadRecentInput, and available
    source rectangles; metrics.json also records host/browser/viewport/CPU/network/sample
    method and run timestamps.
