    the existing shipment and DEMO receipt adjustment flows. Keep the wire shape,
    database schema, SQL atomicity and mock-only restrictions unchanged.'
  risk_class: private_leaf
inputs:
- User request: execute Issue 05 using docs/planning/kohami/delivery/IMPLEMENTATION_PLAN.md.
- docs/issues/kohami/05-logistics-invoice-contract-validation.md and accepted policy in docs/proposals/kohami/04-demo-commerce-policy.md.
- Existing Quote, Checkout, Shipment, receipt and refund adapter implementations plus Issue 01/02/04 acceptance evidence.
outputs:
- Versioned mock fee resolution used when a Quote snapshot is created.
- Regression evidence for supported/unsupported region, home/pickup fees, immutable fee snapshots, shipment transition replay/order, and receipt failure/unknown/retry.
data:
- Immutable in-code mock fee schedule; Quotes and Orders continue to store existing JSON snapshots in the dedicated kohami_local Commerce dataset.
events:
- Existing Shipment transition and DEMO receipt/adjustment worker jobs only; no new external or provider events.
consumers:
- Commerce Quote and Checkout endpoints, Storefront API proxy/UI, Commerce worker payment/refund/receipt flow, and Commerce acceptance harness.
security_boundaries:
- Preserve existing order ownership checks, shipment.manage and demo.control grants, and dedicated synthetic SQL fixture requirement.
- No carrier, payment, invoice, tax or email provider calls; no credential values in source or fixtures.
invariants:
- Unsupported method/region returns FEE_UNAVAILABLE; never default to zero or confirm a quote without a valid fee row.
- Quote and checkout/order snapshots retain the fee amount and version captured at quote creation.
- Currency remains integer TWD; pickup is explicitly zero fee under the same demo version.
- All delivery and receipt responses remain mock-only and explicitly state no real package tracking or tax effect.
- Refund state and receipt-adjustment state remain independent; retries query/update the same adjustment without repeating a refund.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Preserve current Quote request/response shape and fee_demo_v1 snapshot field; the mapping moves from inline constants to a typed immutable domain table.
  - No SQL schema or migration changes; snapshots continue using the existing Commerce Documents store and transactional write path.
tests:
- TDD: first add focused Commerce checks for fee table resolution/version and snapshot stability; observe expected compile/test failure before implementation.
- Commerce Release build and pure-rule checks without private SQL configuration.
- Dedicated synthetic SQL Commerce harness for the quote/order snapshot and shipment/receipt scenario assertions, only if the dedicated fixture is reachable and verified.
- Static OpenAPI/build checks only if a wire-shape change is discovered; no wire-shape change is planned.
