version: 1
change:
  id: catalog-colorway-image-gallery-20261026
  target:
    - Publish the approved four-image linen-shirt gallery with separate cream, powder-blue, and muted-sage views.
    - Filter product detail and catalog-card media by the selected SKU color.
    - Clearly disclose powder-blue and muted-sage images as concept recolors derived from the cream source.
  target_paths:
    - apps/storefront/app/utils/demo-api.ts
    - apps/storefront/app/pages/products/[slug].vue
    - apps/storefront/app/components/catalog/ProductCard.vue
    - apps/storefront/public/demo-assets/editorial/ASSET_MANIFEST.json
    - apps/storefront/public/demo-assets/editorial/outfits/linen-shirt-2026-10-26/
    - templates/creative/models/kohami-editorial-model-01/generation-runs/2026-10-26/qwen-image-2.1-product-outfits/linen-shirt/RUN_SUMMARY.json
  summary: >-
    Complete the explicitly approved linen-shirt display scope: four separate model
    images (cream twice, powder blue once, muted sage once), with the flat-lay and
    matching outfit images filtered by the selected color. The blue and sage images
    remain clearly labeled concept recolors rather than verified SKU photography.
    No catalog IDs, prices, inventory, API contracts, database, or payment behavior change.
  risk_class: private_leaf
inputs:
  - path: docs/todo/options.md
    description: OPT-18 local model generation and product-reference guard.
  - path: templates/creative/models/kohami-editorial-model-01/generation-runs/2026-10-26/qwen-image-2.1-product-outfits/linen-shirt/RUN_SUMMARY.json
    description: Four separately generated images, per-image output hashes and visual review.
  - path: User decision in this conversation
    description: Four total images, each color separate, cream used twice; blue and sage derived from cream for demo concepts; public-use authorization confirmed.
outputs:
  - kind: synthetic storefront gallery
    description: Four individual images imported to public static demo assets and color-bound in the gallery; powder blue and muted sage carry an on-page concept-color disclosure.
  - kind: provenance
    description: Asset manifest records model license name, user-attested public-use authorization, color, output hash, and review limits.
data:
  - path: apps/storefront/app/utils/demo-api.ts
    description: Synthetic mock product response media only; SKU identities, price, stock, and persisted data are unchanged.
events: []
consumers:
  - apps/storefront/app/pages/products/[slug].vue filters gallery media by selected color and displays its concept-color notice.
  - apps/storefront/app/components/catalog/ProductCard.vue previews media matching the currently selected SKU color.
  - apps/storefront/app/pages/checkout/[id].vue continues to use the first flat-lay media item.
security_boundaries:
  - Static local-generation outputs only; no customer data, external inference, API, SQL, or payment systems are involved.
  - The user represented that public-use authorization is confirmed. The Qwen Research License name and terms remain separately recorded and are not modified by this repository note.
invariants:
  - One image contains one model, one garment color, one pose, and one continuous frame.
  - Cream, powder blue, and muted sage remain separate files; no collage or mixed-color image.
  - Powder blue and muted sage are concept recolors; do not represent them as verified physical SKU photographs.
  - Product gallery, card preview, and alt text must stay aligned to the selected color.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
    - Optional media colorId is added only to the synthetic mock catalog response.
tests: []
observability: []
documentation:
  - apps/storefront/public/demo-assets/editorial/ASSET_MANIFEST.json
  - templates/creative/models/kohami-editorial-model-01/generation-runs/2026-10-26/qwen-image-2.1-product-outfits/linen-shirt/RUN_SUMMARY.json
unknowns:
