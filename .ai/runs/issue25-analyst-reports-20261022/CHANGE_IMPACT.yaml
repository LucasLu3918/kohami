  target: Verify Analyst reports.read authorization on the exact Report:operations scope, including wrong-scope and same-session grant revocation denial.
  target_paths:
  - tests/Commerce/Issue25AnalystReportsAcceptance.cs
  - tests/Commerce/Program.cs
  - scripts/foundation/run-issue25-analyst-reports-acceptance.py
  - tests/foundation/test_issue25_analyst_reports_contract.py
  - docs/issues/kohami/25-commerce-security-monitoring-recovery.md
  - docs/architecture/VERIFICATION.md
  summary: >-
    Adds a dedicated synthetic Analyst fixture helper and HTTP runner, dispatched from the
    Commerce.Tests Release binary. Exact scope allow, wrong scope deny, and grant-revocation
    deny were verified against only kohami-sql-test. Exact cleanup and full SecurityState /
    Maintenance restore passed. No product routes, schema migrations, or dev/prod state changed.
  risk_class: security_boundary
inputs:
- Exact synthetic Analyst login and one active reports.read grant scoped to Report:operations.
- Date bounded admin report query through the local API.
outputs:
- Report endpoint allow/deny status and stable error code for three scope/grant states.
- SQL readback of grant, active session, authorization audit, and unchanged business snapshot.
data:
- Creates one synthetic user, Report:operations grant, session, SecurityAudit, and ReportAccessAudit rows in kohami-sql-test.
- Cleans only this run's synthetic rows; reads business data snapshots before and after.
events: []
consumers:
- Issue25 security acceptance and verification documentation.
security_boundaries:
- Native fixture marker is verified before SQL operations; runner requires explicit fixture and maintenance acknowledgements.
- Temporary Maintenance window is opened and restored with Issue11 helper; no Owner or other privileged authority is created.
- SQL connections target only the private kohami-sql-test configuration; runner requires loopback API URLs.
- Test API uses explicit Secure cookie forwarding for HTTP loopback; no credential values are printed.
invariants:
- Valid Report:operations Analyst grant allows the reports route.
- Wrong Report scope and exact grant revocation deny the same route for the same active session.
- Business data snapshot is unchanged; SQL permission/audit readbacks agree with the HTTP outcomes.
- Cleanup removes all synthetic rows and restores complete SecurityState/Maintenance.
