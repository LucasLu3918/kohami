version: 1
change:
  id: issue24-document-coordinate-shift-20261020
  target:
    - Distinguish viewport auto-scroll from document-flow layout changes in the current Issue24 synthetic desktop journey
    - Record evidence and limitations in the Issue24 ticket and canonical verification log
  target_paths:
    - docs/issues/kohami/24-core-mobile-accessibility-performance.md
    - docs/architecture/VERIFICATION.md
  summary: >-
    Rebuilt an isolated current Storefront preview and repeated 90 synthetic
    trilingual desktop journeys with before/after scrollY and document-coordinate
    geometry. Cart geometry remained stable after the fixed feedback slot; quote
    panel insertion moved the downstream checkout section in document flow. This
    is evidence documentation only; no product behavior changed.
  risk_class: docs_style_test
inputs:
  - kind: repository_source
    description: Current committed homepage template and cart-feedback slot in index.vue.
  - kind: synthetic_measurement
    description: >-
      90 isolated localhost Playwright journeys, 360 stages, expected API stub
      outcomes, LayoutShift entries, callback scrollY, and before/after document
      geometry. Raw evidence and runner are in this run directory.
outputs:
  - kind: documentation
    description: Issue24 ticket and canonical verification log record the measured attribution and limits.
  - kind: local_evidence
    description: Reproduction runner, raw metrics JSON, and analysis are saved under .ai/runs.
data: []
events: []
consumers:
  - kind: storefront_documentation_reader
    description: Issue24 reviewers and implementers use the ticket and verification log to assess synthetic interaction behavior.
  - kind: validation_owner
    description: Issue24 acceptance review distinguishes lab diagnostics from field metrics.
security_boundaries:
  - description: Loopback-only preview; Playwright synthetic route stubs; no SQL, live API, payments, LAN, RUM, or visitor data.
invariants:
  - CLS excludes entries where hadRecentInput=true.
  - Local synthetic results are not field CLS/INP, Core Web Vitals, production SLA, or real visitor-impact evidence.
  - The older 210 entries lack scrollY and are not retroactively reattributed.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
    - Documentation and local test evidence only; no product code or external contract changed.
tests:
  - command: >-
      node .ai/runs/issue24-document-coordinate-shift-20261020/measurement.mjs
      with ISSUE24_SAMPLES=30 and isolated localhost preview
    result: >-
      PASS; 90 journeys / 360 stages, all expected 503/200 outcomes, n=30 for
      each locale-stage group, 12 CLS groups P75/max=0, and complete before/after
      geometry.
  - command: >-
      python3 inline aggregate of metrics.json: counts, expected stage outcomes,
      hadRecentInput flags, and document-coordinate deltas
    result: >-
      PASS; cart list/control document-coordinate delta zero throughout; quote
      retry checkout section delta 497.6/516.6/476.6 CSS px with scrollY delta
      zero; 90 observed ja entries all recent-input and excluded from CLS.
  - command: git diff --check
    result: PASS; no whitespace errors in canonical documentation changes.
observability:
