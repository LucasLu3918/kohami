change:
  id: foundation-ac01-dataset-isolation-20261016
  target: Prove dataset discriminator rejection, composite foreign-key dataset isolation, and existing cross-dataset read projections for Foundation Commerce; preserve existing SQL fixtures and only report verified cases.
  target_paths:
    - .ai/runs/foundation-ac01-dataset-isolation-20261016/CHANGE_IMPACT.yaml
    - .ai/runs/foundation-ac01-dataset-isolation-20261016/EVIDENCE.md
    - docs/architecture/VERIFICATION.md
    - docs/planning/kohami/delivery/technical-baseline/IMPLEMENTATION_STATUS.yaml
    - tests/Commerce/DatasetForeignKeyAcceptance.cs
    - tests/Commerce/Program.cs
  summary: Extend Foundation-AC01 acceptance with a complete source-bound matrix for every
    applicable foreign-Dataset FK and read boundary, using only synthetic data in
    a dedicated disposable fixture; preserve existing fixture and update status/evidence
    only for cases actually verified.
inputs:
  - docs/planning/kohami/delivery/technical-baseline/READINESS.md Foundation-AC01 cross-Dataset acceptance requirement.
  - src/Modules/Commerce/Infrastructure/Persistence/CommerceSchema.sql Dataset checks and composite foreign keys.
  - src/Modules/Commerce/Infrastructure/Persistence/Store.cs, ScopeResolver.cs and Commerce service/worker SQL queries.
  - Existing DatasetReadIsolationAcceptance and Identity SQL regression evidence.
outputs:
  - Deterministic SQL assertions for every Dataset-scoped Commerce table check and every composite Dataset foreign key.
  - Re-executed existing same-ID cross-Dataset Commerce read probes and recorded exact coverage/limitations.
  - Updated Foundation-AC01 status and source-bound evidence without claiming unrelated conditions.
data:
  - Use synthetic random IDs only in a dedicated SQL fixture with strict TLS.
  - Keep foreign-key constraints enabled during composite key rejection assertions; temporarily disable only table Dataset CHECK constraints required to stage synthetic foreign parent rows, then clean rows and restore/validate those CHECK constraints.
  - Preserve the existing Issue06 14336 fixture, its volumes, and all user/demo data.
events: []
consumers:
  - Commerce endpoint and worker SQL queries remain explicitly scoped to Dataset='kohami_local'.
  - Foundation readiness status remains PARTIAL unless all fixed-dataset, Identity, unknown-schema, and fresh-upgrade acceptance conditions are evidenced.
security_boundaries:
  - Foreign Dataset rows and IDs are synthetic, uniquely named, and removed by the acceptance harness.
  - Foreign-key enforcement stays enabled; only Dataset CHECK constraints are suspended temporarily while constructing synthetic foreign-parent rows.
  - No SQL fixture outside the run-owned disposable fixture may receive writes or schema changes.
invariants:
  - Dataset is part of each Commerce composite foreign key, preventing a child in kohami_local from resolving a foreign-Dataset parent by a colliding resource ID.
  - Every Commerce table with a Dataset column rejects values other than kohami_local under normal constraints.
  - Cross-Dataset read probes return configured-dataset results when identifiers collide, and exclude foreign-Dataset order/refund/receipt effects.
  - Existing health, API, Identity and migration behavior is unchanged.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
    - Test-only change plus evidence/status documentation; no product schema or endpoint change.
