version: 1
change:
  id: foundation-schema-baseline-adoption
  target: ["Native SQL migration adoption"]
  target_paths:
  - .ai/runs/foundation-schema-baseline-adoption/CHANGE_IMPACT.yaml
  - .ai/runs/foundation-schema-baseline-adoption/EVIDENCE.md
  - docs/planning/kohami/delivery/LOCAL_DEMO_RUNBOOK.md
  - tests/Native/Program.cs
  - tests/Native/SqlBaselineAdoptionAcceptance.cs
  - tools/native-operations/Program.cs
  - tools/native-operations/SqlBaselineAdoption.cs
  - tools/native-operations/SqlProvision.cs
  summary: >-
    Add an explicit local command to adopt an existing database only when a canonical
    SQL Server catalog fingerprint exactly matches the current fully migrated baseline.
    Fingerprint covers schema ownership, principals and role membership, objects,
    columns, constraints, indexes, module definitions, and database permissions. The
    command rejects existing history, partial objects, drift, and permission changes;
    successful validation creates the version history and records known migration hashes
    atomically. Verify positive and negative paths using this task's dedicated synthetic
    fixture and clean only resources created by this task.
  risk_class: db_schema

inputs:
  - Current migration manifest and source hashes in tools/native-operations/SqlMigrations.cs
  - SQL Server catalog metadata from the explicitly targeted Kohami database
outputs:
  - Explicit local-only schema baseline adoption command
  - Migration ledger populated atomically after exact catalog fingerprint validation
  - Acceptance evidence for matching baseline and rejected schema/permission drift
data:
  - SQL Server schema and principal metadata read for fingerprint comparison
  - ops.SchemaMigrations created and populated only after every validation succeeds
events: []
consumers:
  - Native SQL provisioning command dispatcher
  - Local operator following LOCAL_DEMO_RUNBOOK.md
  - Dedicated SQL migration acceptance harness
security_boundaries:
  - Adoption requires the exact repo-local private config and strict TLS endpoint guard
  - No API or worker credential can run adoption; only the local provisioning command
  - No remote or production endpoint is admitted by the command
  - Schema/history changes are in one transaction and are serialized by application lock
invariants:
  - Existing database state remains unchanged when fingerprint or history validation fails
  - All recorded migration IDs and hashes equal the checked-in current manifest
  - API and worker roles never receive schema-adoption authority
  - The system Impact Graph remains partial outside manually reviewed seed callers

compatibility:
  api_breaking: false
  migration_required: false
  reasons:
    - Existing migrate-native-local behavior remains fail-closed for an untracked existing schema.
    - The new command is opt-in and supports only exact matching schema baselines.
    - A future change to the initial baseline invalidates the pinned fingerprint and requires explicit re-review.

tests:
  - Native unit checks for deterministic fingerprint serialization and migration ledger validation
  - Dedicated SQL acceptance adopts an exact schema after history removal and verifies all migration IDs/hashes
  - Dedicated SQL acceptance rejects an existing ledger and changed migration source hash without modification
  - Dedicated SQL acceptance rejects schema-object drift without creating history
  - Dedicated SQL acceptance rejects database permission drift without creating history
  - Dedicated SQL acceptance restores original fixture history, drift object, and grant state
  - Native Release build and full Native test executable
observability:
  - Emit only an adoption success status or stable rejection code; never log SQL credentials or private config
documentation:
  - Document exact local command, accepted baseline restriction, fail-closed cases, and backup prerequisite
  - Record current fixture acceptance and known limitations in this change evidence

