tests:
- command: npx playwright test tests/issue24-zoom-core-pages.spec.ts --config=playwright.config.ts --headed --reporter=line --trace=off
  result: >-
    PASS 1/1 in headed Chrome; synthetic API route stubs only. Cart, checkout result, and member orders passed content/control visibility and no-horizontal-overflow assertions at 640px, 320px, and 160px CSS viewports. The first headed run exposed a test assertion mismatch (innerWidth 640, clientWidth 625 due to the vertical scrollbar); the helper was corrected and rerun passed. A later native Chrome 400% cart check initially measured document scrollWidth 214px against clientWidth 152px, caused by a text input wider than its parent. Cart text inputs/selects now use the parent width and may shrink; repeat native measurement passed with innerWidth 156, devicePixelRatio 8, clientWidth 152, document scrollWidth 152, and body scrollWidth 136. Checkout-result and member-orders native 400% scrollWidth are not yet individually measured. HTTP preview used an isolated synthetic API fixture; HTTPS certificate warnings were not bypassed.
- command: npx playwright test tests/issue24-zoom-core-pages.spec.ts --config=playwright.config.ts --reporter=line --trace=off
  result: Earlier headless launch failed with Chrome SIGABRT and cleanup kill EPERM before viewport assertions; superseded by the successful headed run above.
- command: npm run typecheck
  result: PASS.
- command: npm run build
  result: PASS; Nuxt production build completed.
