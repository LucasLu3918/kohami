invariants:
- Do not alter commerce behavior, authorization, API contracts, or payment behavior.
- 320px CSS viewport remains the standard 400% equivalent for a 1280px base viewport;
  native screenshots from a narrower window are supplemental evidence.
- Mobile Safari and VoiceOver remain excluded.
compatibility:
  api_breaking: false
  migration_required: false
