version: 1
change:
  id: issue24-native-zoom-400-reflow
  target:
  - Add narrow 160 CSS px supplementary reflow coverage after observing native Chrome
    400% zoom in the available desktop window; retain 640px/320px standard-equivalent
    assertions and improve only layout where a page overflows.
  target_paths:
  - apps/storefront/app/pages/cart.vue
  - apps/storefront/app/pages/checkout/[id].vue
  - apps/storefront/app/pages/account.vue
  - apps/storefront/app/components/commerce/MemberOrderList.vue
  - apps/storefront/tests/issue24-zoom-core-pages.spec.ts
  - docs/issues/kohami/24-core-mobile-accessibility-performance.md
  - docs/architecture/VERIFICATION.md
  summary: Fix narrow-screen layout overflow seen during native 400% zoom observation
    and add supplemental 160px regression coverage. Keep standard 320px 400%-equivalent
    results distinct from the narrower native window observation.
  risk_class: private_leaf
inputs:
- path: apps/storefront/app/pages/cart.vue
  description: Cart and quote layout using synthetic API test data.
- path: apps/storefront/app/pages/checkout/[id].vue
  description: Read-only checkout result layout using synthetic status data.
- path: apps/storefront/app/pages/account.vue
  description: Authenticated member orders layout and form.
- path: apps/storefront/app/components/commerce/MemberOrderList.vue
  description: Read-only order list rendered by the member account page.
outputs:
- kind: verification evidence
  description: Existing 640px/320px standard-equivalent checks plus 160px supplementary
    narrow viewport checks across cart, checkout result, and member order pages.
data:
- Synthetic Playwright route stubs only; no API, SQL, payment provider, account, or
  persistent fixture access.
