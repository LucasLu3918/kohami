version: 1
change:
  id: DEMO-P3-STOREFRONT
  target_paths:
    - apps/storefront/app/app.vue
    - apps/storefront/app/components/storefront/StorefrontHeader.vue
    - apps/storefront/app/components/storefront/StorefrontHero.vue
    - apps/storefront/app/components/storefront/StorefrontFooter.vue
    - apps/storefront/app/components/catalog/ProductCard.vue
    - apps/storefront/app/components/catalog/ProductDiscovery.vue
    - apps/storefront/app/pages/index.vue
    - apps/storefront/app/pages/products/[slug].vue
    - apps/storefront/app/pages/account.vue
    - apps/storefront/app/pages/cart.vue
    - apps/storefront/app/pages/checkout/[id].vue
    - apps/storefront/app/pages/policies.vue
    - apps/storefront/app/pages/support.vue
    - apps/storefront/tests/issue-demo-p3-storefront.spec.ts
  summary: >-
    Create a Japanese fashion retail storefront shell with announcement, centered
    brand/search/member/cart navigation, local-asset hero, searchable category
    links and new-arrivals catalog. Keep operational and checkout panels off the
    homepage; retain the existing cart/checkout, locale, SKU/stock contracts.
    No backend or admin/auth work.
  risk_class: private_leaf
inputs:
  - path: apps/storefront/app/pages/index.vue
    description: Existing public catalog API query, server-authoritative product/SKU/availability data and add-to-cart behavior.
  - path: apps/storefront/app/pages/products/[slug].vue
    description: Existing localized product detail endpoint, SKU/stock selection and cart mutation behavior.
  - path: apps/storefront/app/components/catalog/ProductDiscovery.vue
    description: Existing catalog presentation props/emits contract, query filters, pagination, SKU selection and add-to-cart action.
  - path: apps/storefront/app/utils/storefront-locale.ts
    description: Existing zh-TW/ja/en path normalization and localized route helper.
  - path: apps/storefront/app/components/LocaleSwitcher.vue
    description: Existing locale switching and query preservation behavior.
  - path: docs/planning/kohami/delivery/IMPLEMENTATION_PLAN.md
    description: DEMO-P3 scope excludes fake category/ranking actions and backend/API changes; category links use supported catalog search queries.
outputs:
  - kind: storefront-ui
    description: Shared announcement/header/footer, responsive local-image hero and searchable category navigation, new-arrivals catalog grid and responsive product detail surface.
data:
  - description: Read existing published products, translations, local product image URLs, SKU price and availability/stock from current APIs; reuse the existing cart mutation APIs for add-to-cart only.
events: []
consumers:
  - path: apps/storefront/app/pages/index.vue
    status: Public catalog and current add-to-cart consumer; preserve its API and commerce logic.
  - path: apps/storefront/app/pages/products/[slug].vue
    status: Localized detail and SKU/cart consumer; preserve its API and commerce logic.
  - path: apps/storefront/app/components/catalog/ProductDiscovery.vue
    status: Catalog card/grid presentation; props and emits remain compatible.
  - path: apps/storefront/app/components/LocaleSwitcher.vue
    status: Shared header uses the existing locale switcher without changing route semantics.
  - path: apps/storefront/app/composables/useCommerceCart.ts
    status: Existing cart API is reused by the product detail route; unchanged.
  - path: apps/storefront/server/api/v1/[...path].ts
    status: Existing same-origin API proxy; unchanged.
security_boundaries:
  - description: UI displays server-authoritative prices and stock; it does not calculate or authorize commerce outcomes.
    disposition: preserved
  - description: Admin routes, authentication, authorization, API, SQL, product seeds, schema, fixtures, runners and P2 model-pilot assets are outside target scope.
    disposition: excluded
  - description: Existing cart API remains the only write action; no client-side inventory or price mutation is introduced.
    disposition: preserved
invariants:
  - Three locales (zh-TW, ja, en), localized URLs and existing catalog/search query behavior remain functional.
  - Only in-stock SKU variants may be added; unavailable variants remain disabled and stock/SKU information stays visible on detail pages.
  - Product links, cart link and category/search links use existing routes and product API query behavior; no operational controls appear on the customer homepage.
  - The home/detail responsive layout stacks without horizontal overflow on narrow mobile viewports.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
    - Presentation-only changes reuse the existing API and component data contracts.
tests:
  - command: npm ci (apps/storefront)
    result: >-
      PASS on the candidate. Installed lockfile dependencies; npm reported 14 dependency advisories (12 high, 2 critical). No dependency files changed in this candidate.
  - command: npm run typecheck (apps/storefront)
    result: PASS; Nuxt typecheck completed on the candidate storefront source.
  - command: npm run build (apps/storefront)
    result: PASS; Nuxt production build completed on the candidate storefront source.
  - command: >-
      KOHAMI_STOREFRONT_ORIGIN=http://127.0.0.1:3197
      ./node_modules/.bin/playwright test tests/issue-demo-p3-storefront.spec.ts
      --config=playwright.config.ts --reporter=line --trace=off
    result: >-
      PASS 1/1 on the candidate storefront source. Used a dedicated loopback-only synthetic API for SSR with 15 products plus browser route mocks for cart writes. Verified 15 cards/images, unavailable SKU disabled, product detail and cart behavior, zh-TW/ja/en routes with query preservation, responsive layout without mobile overflow, and footer contrast >= 4.5:1.
  - command: npm run typecheck && npm run build (apps/storefront)
    result: >-
      PASS on the updated P3 candidate after homepage IA changes. Nuxt typecheck
      and production build both completed successfully.
  - command: >-
      KOHAMI_STOREFRONT_ORIGIN=http://127.0.0.1:3197
      KOHAMI_P3_VISUAL_REVIEW_PATH=/tmp/kohami-p3-home-updated.png
      ./node_modules/.bin/playwright test tests/issue-demo-p3-storefront.spec.ts
      --config=playwright.config.ts --reporter=line --trace=off
    result: >-
      PASS 1/1 on updated P3 candidate (2.6s). Dedicated loopback synthetic SSR
      API plus browser route mocks only. Verified announcement, local-asset hero,
      four searchable category links, no login/aftercare/reconciliation panels,
      15 product cards/images, add-to-cart and navigation to /ja/cart, product
      detail, zh-TW/ja/en routes with query preservation, mobile no-overflow, and
      footer contrast >= 4.5:1. Local mock screenshots were written outside Git
      at /tmp/kohami-p3-home-updated.png and /tmp/kohami-p3-home-updated-desktop.png.
  - command: >-
      KOHAMI_STOREFRONT_ORIGIN=http://127.0.0.1:3197
      ./node_modules/.bin/playwright test tests/issue-demo-p3-storefront.spec.ts
      --config=playwright.config.ts --reporter=line --trace=off
    result: >-
      TDD reproduction before implementation: FAIL at the new announcement-region
      assertion because the former homepage/header had no announcement region.
      This expected red run established the missing public-store IA behavior.
  - command: >-
      KOHAMI_STOREFRONT_ORIGIN=http://127.0.0.1:3197
      ./node_modules/.bin/playwright test tests/issue17-localized-routes.spec.ts
      --config=playwright.config.ts --reporter=line --trace=off
    result: >-
      INCOMPLETE: 1 passed, 2 failed, 1 interrupted, 5 not run. The two failures expected seeded demo-product and missing-translation records absent from the P3-only synthetic API; the interrupted cart case likewise expected seeded sku_demo_01 data. This run did not exercise the real dedicated demo API/SQL fixture. Preserve as a fixture limitation for P5 browser E2E, not a P3 product regression.
  - command: >-
      KOHAMI_LOCAL_DIR="$PWD/.local/demo-p3-regressions/foundation"
      KOHAMI_FIXTURE_ROOT="$PWD" /opt/homebrew/bin/python3
      scripts/foundation/run-issue06-aftercare-acceptance.py --cart-only
    result: >-
      PASS 4/4 Playwright cases on the original P3 source branch before Gate rebasing; dedicated synthetic SQL fixture provisioned and cleaned, inventory restored, synthetic rows/session removed. Not rerun here because this recovery candidate has no authorized local SQL fixture credentials.
  - command: >-
      KOHAMI_LOCAL_DIR="$PWD/.local/demo-p3-regressions-issue08/foundation"
      KOHAMI_FIXTURE_ROOT="$PWD" /opt/homebrew/bin/python3
      scripts/foundation/run-issue06-aftercare-acceptance.py --catalog-only
    result: >-
      Adjacent baseline limitation from the original P3 source-branch regression run: fresh dedicated SQL fixture and save-failure recovery passed; the following owner publish/update browser case failed because getByRole('status') matched two elements (empty SKU inventory status and “草稿已儲存”). A prior run observed a stale URL expectation; parent audit confirmed both were pre-existing test expectation issues. No Issue08 product/admin code was changed.
  - command: >-
      KOHAMI_LOCAL_DIR="$PWD/.local/demo-p3-regressions-issue10/foundation"
      KOHAMI_FIXTURE_ROOT="$PWD" /opt/homebrew/bin/python3
      scripts/foundation/run-issue06-aftercare-acceptance.py --search-only
    result: >-
      Adjacent baseline limitation from the original P3 source-branch regression run: search/SKU passed; offline read-error case failed after 15 seconds waiting for an alert absent from the page. The runner restored showcase stock and removed synthetic rows/session. Parent audit confirmed Issue10 alert markup/spec were unchanged by P3. P5 true-fixture browser acceptance remains outstanding.
