change:
  id: issue26-return-availability-ui-20261022
  target: Member return-request UI gated by backend eligibility and remaining RefundUnit availability, with immutable price snapshots preserved.
  target_paths:
  - src/Modules/Commerce/Domain/MemberOrderActionPolicy.cs
  - src/Modules/Commerce/Infrastructure/Legacy/Aftercare.cs
  - docs/contracts/runtime/Core.openapi.json
  - tests/Commerce/Issue26OrderActionAvailabilityContract.cs
  - tests/Commerce/Program.cs
  - apps/storefront/app/components/commerce/MemberOrderReturnRequest.vue
  - apps/storefront/app/components/commerce/MemberOrderAftercare.vue
  - apps/storefront/app/components/commerce/MemberOrderList.vue
  - apps/storefront/app/composables/useMemberOrderDetails.ts
  - apps/storefront/tests/issue26-member-return-request.spec.ts
  - tests/Commerce/Issue26AftercareHttpAcceptance.cs
  - tests/Commerce/Issue26CancellationHttpAcceptance.cs
  - tests/Commerce/Issue26OrderActionAvailabilityContract.cs
  - tests/foundation/test_issue26_aftercare_http_acceptance.py
  - docs/issues/kohami/26-core-store-delivery-readiness.md
  - docs/architecture/VERIFICATION.md
  summary: >-
    Derive Cancel and RequestReturn availability from existing mutation guards; expose remaining
    return units on the RequestReturn action while preserving immutable snapshots; add localized
    return-request UI, live HTTP/SQL evidence, and bounded documentation. Fixture SecurityState
    and Maintenance were restored after acceptance.
  risk_class: api_contract
inputs:
- Member order state and existing Commerce shipment/RefundUnit records used by owner-scoped detail.
- Member-provided orderLineId, quantity, and reason for POST /api/v1/orders/{id}/returns.
- CSRF token from GET /api/v1/auth/csrf.
outputs:
- Owner-scoped order detail returns Cancel and RequestReturn allowed/reasonCodes values.
- Member return request command using the active {orderLineId, quantity, reason} DTO.
- Refreshed member order detail and summary after accepted request or stale conflict.
data:
- Read-only projection queries Order state, Delivered Shipment existence, and Free RefundUnits grouped by OrderLineId.
- Existing RequestReturn endpoint continues to own unit claiming and mutation; the runtime response schema adds optional action returnableLines.
events: []
consumers:
- Storefront MemberOrderAftercare joins detail.actions.returnableLines with immutable snapshot.lines.
- MemberOrderList submits the existing Commerce return endpoint and refreshes details/list.
security_boundaries:
- UI renders RequestReturn only when the owner-scoped backend detail marks it allowed and limits quantity to server-projected available units.
- Authenticated Member ownership and CSRF/Origin remain enforced by the existing API route/middleware.
- Member RequestReturn skips GuestCapability verification in its authenticated owner path.
- UI sends same-origin credentials, CSRF and idempotency headers; it sends no unsupported If-Match.
invariants:
- Cancel is allowed only for AwaitingPayment, matching the cancellation endpoint state guard.
- RequestReturn is allowed only for Confirmed + at least one Delivered shipment + at least one Free RefundUnit.
- Client validates line selection, integer quantity 1..ordered line quantity and trimmed 1..500 reason.
- A 201 refreshes detail/list; 409/412 refresh without automatic retry; 422/generic errors preserve inputs.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Adds optional returnableLines to the action availability projection; CommerceSnapshotLine remains unchanged.
  - Uses the active additive RequestReturn route and its singular DTO; no canonical contract claim.
