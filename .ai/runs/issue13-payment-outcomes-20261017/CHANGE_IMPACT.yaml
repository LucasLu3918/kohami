  - .ai/runs/issue13-payment-outcomes-20261017/CHANGE_IMPACT.yaml
  summary: 'Issue13 completion: extend the dedicated local synthetic acceptance journey
    to exercise trusted declined, service-unavailable behavior, and Unknown payment
    outcomes across API, SQL persistence/worker state, and live Storefront browser
    results. Keep mock-only, no schema or production-provider change.'
  risk_class: db_schema
inputs:
- Dedicated localhost SQL fixture with synthetic Owner, command actor and authorized
  scenario operation
- Checkout, Order, PaymentAttempt and scenario Job created by the live mock API
- Live Storefront checkout result page and existing status API
outputs:
- Declined and Unknown outcomes confirmed through API and persisted SQL worker state
- Service-unavailable API interruption observed without converting it to a declined
  result
- Live browser result states and recovery from a temporary status refresh failure
- Updated Issue13 acceptance evidence and remaining scope
data:
- Synthetic Cart, Checkout, Order, PaymentAttempt, Payment and Scenario rows in the
  dedicated fixture
events:
- Mock scenario dispatch and trusted terminal or Unknown payment result
consumers:
- Issue06 acceptance runner's Issue13-specific payment outcome mode
- Commerce SQL acceptance verifier
- Storefront checkout result page and Issue13 Playwright acceptance
- Issue13 ticket, architecture verification and delivery plan
security_boundaries:
- Runner requires a dedicated localhost SQL fixture and uses only the recorded synthetic
  Owner/command identity
- Payment results are submitted through the authorized mock scenario API; no browser-supplied
  trusted result is introduced
- Any API stop/restart is scoped to the child process created by this runner
- Cleanup is limited to synthetic rows recorded under the fixture Owner
invariants:
- Declined is represented as Failed only after the mock worker applies the trusted
  declined scenario
- Unknown remains unconfirmed and is never rendered as a trusted decline
- An API outage does not create a payment result or change persisted state
- Rechecking an Unknown checkout does not create another PaymentAttempt or Collection
- Checkout result UI reads status from the live API and retains the last server result
  when refresh is unavailable
