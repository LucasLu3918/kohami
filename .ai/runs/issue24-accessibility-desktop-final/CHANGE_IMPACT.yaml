version: 1
change:
  id: issue24-accessibility-desktop-final
  target:
    - Storefront desktop responsive catalog filters
    - Storefront keyboard add-to-cart failure recovery
    - Issue 24 acceptance and verification documentation
  target_paths:
    - apps/storefront/app/components/catalog/ProductDiscovery.vue
    - apps/storefront/app/pages/index.vue
    - apps/storefront/tests/issue24-accessibility.spec.ts
    - docs/architecture/VERIFICATION.md
    - docs/issues/kohami/24-core-mobile-accessibility-performance.md
  summary: Reproduce and fix desktop reflow overflow at CSS viewport widths corresponding to the accepted zoom/reflow checks; record contrast, keyboard recovery, and interaction timing evidence. Physical iPhone Safari and VoiceOver remain deferred in the existing option.
  risk_class: private_leaf
inputs:
  - path: apps/storefront/app/pages/index.vue
    description: Only current page consumer of ProductDiscovery and owner of add-to-cart pending guard, confirmed with rg.
outputs:
  - kind: storefront responsive layout
    description: Filter controls wrap at compact desktop viewport widths without horizontal page overflow.
  - kind: storefront keyboard recovery
    description: Add-to-cart busy state preserves button focus and rejects duplicate cart mutations.
  - kind: acceptance evidence
    description: Reproducible localized viewport checks and scoped contrast / reflow observations.
