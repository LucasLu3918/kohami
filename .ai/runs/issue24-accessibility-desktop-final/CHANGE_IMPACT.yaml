  migration_required: false
  reasons: []
tests:
  - command: Playwright Issue 24 responsive reflow regression for localized storefront home pages at equivalent 200% and 400% viewport widths.
    result: Red reproduced 720px overflow at document widths 830 / 830 / 903px; after the 900px filter breakpoint, three locales pass at 720px and 320px with no horizontal overflow.
  - command: npx playwright test tests/issue22-policies-support.spec.ts tests/issue24-accessibility.spec.ts tests/issue24-checkout-keyboard.spec.ts tests/issue24-core-keyboard-journey.spec.ts tests/issue24-keyboard-error-aftercare.spec.ts --config=playwright.config.ts --reporter=line --trace=off
    result: PASS 10/10; synthetic API route stubs only, localhost Nuxt.
  - command: npm run typecheck
    result: PASS.
  - command: Temporary Headless Chrome computed-color sample over zh-TW / ja / en home, policies, and cart.
    result: 187 visible text nodes; zero sampled ratios below 4.5:1 normal / 3:1 large text. Supporting evidence only, not a complete WCAG audit.
  - command: Temporary Headless Chrome Event Timing probe; 30 attempts per locale and interaction for home search, policies skip link, and cart quantity update.
    result: 111/270 attempts had a >=16ms candidate; 193 distinct interaction candidates; observed per-group sample-max P75 16ms. Sub-16ms events are omitted; not complete INP.
