version: 1
change:
  id: storefront-member-cart-checkout-20261022
  target: Storefront cart and order creation flow
  target_paths:
    - apps/storefront/app/pages/cart.vue
    - docs/planning/kohami/SPEC.md
    - docs/planning/kohami/experience/EXPERIENCE_DESIGN.md
    - docs/planning/kohami/commerce/CHECKOUT_ORDER_PLAN.md
  risk_class: security_boundary
  summary: >-
    Remove the duplicate cart heading and duplicate error presentation. Guests may
    browse, modify carts and quote, but must sign in or register before an order
    is created. Return to the original localized cart after authentication and
    re-quote. Keep the existing guest API contract and use ordinary mock checkout
    so browser-owned guest carts do not require migration or synthetic wallet funds.
inputs:
  - path: apps/storefront/app/pages/account.vue
    description: Existing safe returnTo handling for member sign-in and redirect.
  - path: apps/storefront/app/pages/register.vue
    description: Existing safe returnTo handling after registration and sign-in.
  - path: apps/storefront/app/composables/useMemberSession.ts
    description: Storefront member authentication state and login behavior.
  - path: apps/storefront/app/composables/useCommerceCart.ts
    description: Existing cart, quote and checkout API calls; unchanged.
  - path: src/Modules/Commerce/Infrastructure/Legacy/CommerceService.cs
    description: Cart ownership checks and member-owned order creation through ordinary checkout.
outputs:
  - kind: storefront-cart-checkout
    description: >-
      One cart heading, one contextual error message, guest sign-in/register
      guidance, localized return to cart, and member-only order creation.
data:
  - description: >-
      Existing browser cart remains server-authoritative and is not copied or
      merged. Quote is regenerated after returning to the cart.
events: []
consumers:
  - path: apps/storefront/app/pages/account.vue
    status: Receives safe localized cart returnTo path; unchanged.
  - path: apps/storefront/app/pages/register.vue
    status: Receives safe localized cart returnTo path; unchanged.
  - path: apps/storefront/app/pages/checkout/[id].vue
    status: Continues existing mock payment flow after member-owned order creation; unchanged.
  - path: apps/storefront/app/composables/useCommerceCart.ts
    status: Existing APIs remain unchanged.
security_boundaries:
  - description: Storefront prevents anonymous order creation and directs to sign-in or registration.
    disposition: strengthened
  - description: API remains authoritative for cart ownership, order ownership, quote validation and inventory.
    disposition: preserved
  - description: Existing guest API contract and unrelated routes remain unchanged.
    disposition: preserved
invariants:
  - Guests can browse, edit the cart and request quotes.
  - Creating an order from the Storefront requires MemberAuthenticated state.
  - Authentication returns to the same localized cart path; the quote is refreshed before order creation.
  - A successful order created while authenticated belongs to the member; the existing API and SQL rules remain authoritative.
  - Guest carts are not silently merged or migrated to an account.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
    - Storefront-only checkout policy; no endpoint, schema, session or data contract changes.
tests: []
observability: []
documentation:
  - docs/planning/kohami/SPEC.md
  - docs/planning/kohami/experience/EXPERIENCE_DESIGN.md
  - docs/planning/kohami/commerce/CHECKOUT_ORDER_PLAN.md
