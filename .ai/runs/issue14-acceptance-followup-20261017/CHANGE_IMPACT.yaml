outputs:
  - Live API status and support order read assertions for late success.
  - SQL assertions for terminal order, one late collection/compensation, released reservation, and failed refund ledger release.
  - Storefront browser assertion for the server-backed late-compensation message.
data:
  - Dedicated loopback SQL Server synthetic fixture only; no schema or migration changes.
events:
  - Existing mock PaymentAttempt and RefundOperation scenario events; no event contract change.
consumers:
  - Existing checkout result page, authorized support Order API, and Commerce SQL acceptance runner.
security_boundaries:
  - Guest checkout status remains owner-capability scoped.
  - Support Order read uses existing orders.read permission scoped to the order.
  - Only the synthetic Owner with demo.control and refund.execute can enqueue scenarios/refunds.
invariants:
  - Late success keeps Cancelled/Expired terminal and does not restore reserved stock.
  - Duplicate and out-of-order event delivery cannot duplicate ledger effects or downgrade success.
  - Compensation failure releases only the failed mock refund pending amount, keeps the order terminal, and leaves compensation required.
  - Acceptance cleanup removes synthetic rows and restores inventory.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Acceptance-only work; production API and SQL contracts remain unchanged.
