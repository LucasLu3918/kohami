  id: issue06-ac06-payment-deadline-20261016
  target:
  - Issue 06 M0-AC06
  target_paths:
  - .ai/intelligence/SOURCE_REGISTRY.yaml
  - .ai/intelligence/topics/testing.md
  - tests/Commerce/PaymentDeadlineAcceptance.cs
  - tests/Commerce/Program.cs
  - docs/architecture/VERIFICATION.md
