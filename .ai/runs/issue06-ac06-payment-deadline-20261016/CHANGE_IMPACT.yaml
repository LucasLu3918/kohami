  - docs/planning/kohami/delivery/LOCAL_DEMO_RUNBOOK.md
  - docs/issues/kohami/06-commerce-technology-quality-baseline.md
  risk_class: security_boundary
  summary: M0-AC06 fixed-clock acceptance for payment cancellation, exact 15-minute
    expiration, late success, and consume/release exactly-once outcomes. Add dedicated
    SQL harness coverage only if existing behavior passes; modify Commerce transaction
    behavior only if evidence exposes a defect. Existing worker crash/restart matrix
    is out of scope because already recorded.
inputs:
- M0-AC06 and fixed 15-minute reservation semantics in READINESS.md, SOURCE_BINDING_PLAN.md, and CHECKOUT_ORDER_PLAN.md.
- CommerceService.Cancel, CommerceLifecycle.Expire/Release, MockWorker.PaymentResult, and the existing dedicated SQL harness.
outputs:
- Fixed-clock dedicated SQL evidence immediately before and at the 15-minute cutoff.
- Concurrent cancel/payment-success evidence for final order, payment, reservation, stock, collection, and compensation state.
- Updated canonical verification and per-case acceptance status, plus the reproducible runbook command.
data:
- Dedicated demo_m0 fixture only; synthetic checkout/order/payment/reservation rows with deterministic teardown and stock restoration.
- No fixture reset, schema migration, or changes to retained records.
events:
- Mock trusted payment result event only; provider networking and production callbacks are outside scope.
consumers:
- CommerceService.Cancel API handler.
- MockWorker payment result and reservation-expiration paths.
- SQL checkout/order documents, Reservations, Inventory, Inbox, Collections, RefundCase, and DEMO receipt/job records.
security_boundaries:
- Payment collection, reservation consume/release, and compensation remain inside Commerce SQL transaction boundaries.
- Dedicated localhost:14336 demo_m0 fixture and synthetic identifiers only.
invariants:
- At expiry equality, the held reservation is released once before a successful callback is recorded as late.
- A late success creates one collection and one compensation case without reviving the cancelled/expired order or decrementing stock again.
- Before expiry, success consumes the held reservation once and confirms at most one primary collection.
- A concurrent cancel and success has one serial outcome; it cannot both confirm and cancel/expire, double-release/consume, or duplicate collection/compensation.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Test-harness and verification-record changes only unless evidence exposes a product defect.
tests:
- Commerce Release build.
- Dedicated Commerce SQL harness on the pinned synthetic fixture.
- Commerce harness regression assertions and synthetic-row/stock teardown checks.
