  id: kohami-sql-test-centralization-20261022
  target:
  - Add one dedicated, clean kohami-sql-test service for future SQL verification and tests.
  - Route test configuration and operational documentation to the test service.
  - Preserve kohami-sql and its viewer; delete other KOHAMI fixture containers and volumes after successful verification.
  target_paths:
  - infra/sql-server/compose.yaml
  - infra/sql-server/manage.sh
  - infra/sql-server/README.md
  - infra/environments/README.md
  - Makefile
  - tools/native-operations/Program.cs
  - tools/native-operations/SqlMigrations.cs
  - tools/native-operations/SqlProvision.cs
  - scripts/foundation/prepare-kohami-sql-test.py
  - docs/planning/kohami/delivery/LOCAL_DEMO_RUNBOOK.md
  - .ai/runs/kohami-sql-test-centralization-20261022/CHANGE_IMPACT.yaml
  summary: Add reusable isolated kohami-sql-test SQL Server 2025 service, route future
    SQL acceptance/integration checks to its dedicated test database, update operational
    docs, and after fresh-service verification delete other KOHAMI fixture containers
    and volumes while preserving kohami-sql and viewer.
inputs:
- Existing OrbStack SQL/test fixture projects, Compose configuration, Native SQL provisioner, and ignored local SQL identity profile conventions.
- User decision to start a clean test database and delete legacy fixture data.
outputs:
- A reusable strict-TLS SQL Server 2025 test service on loopback port 14333 with a dedicated marker-verified Kohami database.
- One test-service data volume and its TLS/backup support volumes; all other KOHAMI fixture containers and volumes removed after successful verification.
data:
- Fresh synthetic schema and fixture marker in kohami-sql-test_data; no prior fixture database contents are imported.
events: []
consumers:
- .NET Identity and Commerce SQL test configuration.
- Local SQL test operators using make sql-test-*.
security_boundaries:
- The test endpoint is loopback-only and accepted by Native provisioning only for kohami-sql-test purpose.
- Daily kohami-sql at localhost:14349 and CloudBeaver viewer configuration remain outside the deletion target.
- Private credentials and TLS identity remain ignored mode-0600 local files.
invariants:
- Test runs use dedicated synthetic data, run serially, and clean their own rows without resetting the database.
- Stop retains the test volumes; old fixture data is discarded only under the user's explicit clean-start/delete-old-data decision.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Adds local developer tooling and changes SQL test target; does not change production API contracts or daily kohami-sql data.
