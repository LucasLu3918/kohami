version: 1
change:
  id: catalog-product-color-media-20261027
  target:
  - apps/storefront/app/utils/demo-api.ts
  - apps/storefront/tests/data-source.spec.ts
  - apps/storefront/public/demo-assets/products/color-variants/
  - apps/storefront/public/demo-assets/products/color-variants/ASSET_MANIFEST.json
  summary: 'Apply the approved product-color media standard to the full synthetic
    15-product catalog: add color-specific product-only image variants for each SKU
    color using its original product source; map each selected color to its matching
    product image without cross-color fallback; preserve outfit concept separation
    and label recolored previews as concept/non-product photos. This directly follows
    the user''s request to generate the other products'' color images after the linen-shirt
    standard.'
inputs:
- source: apps/storefront/public/demo-assets/products/demo-{slug}.png
  contract: Synthetic product-only catalog source image; local repository asset
outputs:
- target: apps/storefront/public/demo-assets/products/color-variants/{slug}-{colorId}.png
  contract: 1024x1024 local PNG color preview; source silhouette/texture retained; recolored previews labeled as concept images
- target: apps/storefront/public/demo-assets/products/color-variants/ASSET_MANIFEST.json
  contract: Source/output hashes, color mapping, local processing method, and concept-preview limitations
data:
- target: products[*].media
  contract: Existing demo product media contract with colorId, kind=product, and concept metadata
events: []
consumers:
- target: apps/storefront/app/pages/products/[slug].vue
  contract: Selected color filters product-only gallery media by matching colorId
security_boundaries:
- Synthetic catalog imagery only; local ComfyUI/core workflow and local vision masks; no cloud model, upload, credentials, or customer data
invariants:
- Product-color selection must display the same colorId product image and never fall back to another color
- Product gallery media remains product-only; model try-on imagery remains in outfit_concept media
- Recolored preview is labeled as a concept/non-product photo and is not asserted to represent a verified physical SKU
- Existing SKU IDs, prices, stock, cart and transaction rules remain unchanged
compatibility:
  api_breaking: null
  migration_required: null
  reasons: []
tests:
- Behavior: browser-check all 15 products and confirm each of the three colorIds loads its mapped 1024px product-only image and localized concept label
- Asset: verify each referenced local image exists, is a PNG, and has a recorded SHA-256
- Scope: frontend-only synthetic demo data and local static assets; no API or persistence schema change
observability: []
documentation:
- UX-CONTRACT.md: record the product-only color gallery and non-product concept label standard
