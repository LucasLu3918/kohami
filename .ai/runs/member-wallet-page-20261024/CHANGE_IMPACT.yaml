  summary: 會員中心顯示儲值餘額與導流按鈕；新增會員錢包頁承接加值流程；餘額帳本改為預設收合。
inputs:
- Existing authenticated member session and GET /api/v1/wallet/current projection.
- Existing CSRF and idempotent POST /api/v1/wallet/top-ups flow.
outputs:
- Account page shows the member's available TWD balance and a route link to /wallet.
- Wallet page contains the existing top-up form and wallet ledger.
- Public-demo generation includes the localized wallet route and route allowlist.
- Wallet ledger is a native disclosure closed by default.
data:
- No persistence or API contract changes; reads the existing member wallet snapshot and submits through the existing synthetic top-up endpoint.
events: []
consumers:
- Member account page consumes the wallet snapshot only for balance summary and wallet route navigation.
- Wallet page consumes the existing wallet composable and MemberWalletPanel for top-up and ledger display.
- Cart and checkout continue to consume the same wallet composable unchanged.
security_boundaries:
- Member session remains required; API retains ownership, CSRF and idempotency enforcement.
- Synthetic top-up notice remains visible; no real card data or payment processing is introduced.
invariants:
- Unauthenticated account users do not see wallet data; unauthenticated wallet route returns through account sign-in.
- Account summary never exposes ledger entries or top-up inputs.
- Ledger disclosure has no open attribute and starts collapsed.
compatibility:
  api_breaking: false
  migration_required: false
  reasons:
  - Existing storefront API operations and wallet data model remain unchanged.
