version: 1
change:
  id: m0-ac01-schema-readiness-20261016
  target: Add a read-only API schema-readiness probe and prove unknown/mismatched schema rejection plus fresh migration/seed stability on an isolated disposable SQL fixture.
  target_paths:
    - .ai/intelligence/PROJECT_INTELLIGENCE.yaml
    - .ai/intelligence/SOURCE_REGISTRY.yaml
    - .ai/intelligence/reviews/PROJECT_INTELLIGENCE_REVIEW.html
    - .ai/intelligence/topics/security.md
    - .ai/runs/m0-ac01-schema-readiness-20261016/CHANGE_IMPACT.yaml
    - .ai/runs/m0-ac01-schema-readiness-20261016/EVIDENCE.md
    - apps/api/Program.cs
    - docs/architecture/VERIFICATION.md
    - docs/planning/kohami/delivery/LOCAL_DEMO_RUNBOOK.md
    - docs/planning/kohami/delivery/technical-baseline/IMPLEMENTATION_STATUS.yaml
    - src/BuildingBlocks/Runtime/M0SchemaContract.cs
    - tests/Native/Program.cs
    - tests/Native/SqlMigrationAcceptance.cs
    - tools/native-operations/SchemaReadinessGrant.sql
    - tools/native-operations/SqlMigrations.cs
  summary: GET /ready returns 200 only when the read-only migration ledger exactly matches the supported migration IDs and source hashes; missing, unknown, incomplete, or mismatched ledger returns 503. /health remains a database-connectivity probe. Fresh setup and seeded upgrade evidence is isolated to a newly provisioned disposable loopback fixture.
inputs:
  - docs/planning/kohami/delivery/technical-baseline/READINESS.md M0-AC01 acceptance row.
  - docs/planning/kohami/delivery/LOCAL_DEMO_RUNBOOK.md fixture scope and migration commands.
  - tools/native-operations/SqlMigrations.cs ordered migration manifest and source-hash algorithm.
  - apps/api/Program.cs and src/BuildingBlocks/Runtime/Runtime.cs current health and SQL access behavior.
outputs:
  - Read-only GET /ready response contract with non-sensitive 200/503 results.
  - Shared supported migration ledger contract and regression coverage against migration source hashes.
  - Candidate-bound fresh-schema, mismatch, and seed-preservation SQL evidence or explicit blocker.
  - Updated M0-AC01 status retaining PARTIAL unless every acceptance condition is evidenced.
data:
  - Provision only a new isolated repository-owned disposable SQL fixture on an unused loopback port in 14336-14399.
  - Use synthetic fixture seed and test rows only; verify seed counts/keys before and after the synthetic upgrade.
  - Teardown only the newly created compose project/volumes and private config belonging to this run; preserve the existing Issue06 fixture and all other Docker projects/volumes.
events: []
consumers:
  - API/platform readiness consumers may use GET /ready to decide whether this runtime can serve requests.
  - Existing /health consumers retain its database-connectivity semantics.
  - SQL migration manifest and its source hashes remain the authority for supported schema versions.
security_boundaries:
  - GET /ready performs only SELECT against ops.SchemaMigrations and exposes no migration, schema, SQL exception, or credential details.
  - API principal receives SELECT only on the migration ledger; no DDL or write permission is added.
  - Migration mismatch never triggers automatic migration, seed, baseline adoption, or database repair.
  - SQL acceptance is limited to the new marked strict-TLS loopback fixture; existing Issue06 fixture and production data are out of scope.
invariants:
  - /health continues to indicate database connectivity only.
  - Readiness is true iff ledger IDs, order, and source hashes equal the supported migration plan exactly.
  - Unknown, missing, gapped, or changed migration history fails closed as HTTP 503.
  - Migration content changes require updating the shared expected source-hash contract and its test.
  - Preserve all pre-existing seeded business rows through an additive synthetic upgrade.
  - M0-AC01 remains PARTIAL while any required fixed dataset, cross-Dataset FK/read, Identity, unknown-schema, or seeded-upgrade condition is unverified.
compatibility:
  api_breaking: false
  migration_required: true
  reasons:
    - Adds GET /ready without changing existing /health or business endpoints.
    - Adds a SELECT grant for the API role on ops.SchemaMigrations in new/current migration application.
    - Existing schema installations require the next approved migration to apply the additional grant; no automatic startup migration is introduced.
