name: kohami-sql-test
services:
  tls-init:
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:2b5b581621126574f3d1f75e78d3eebe8d05aedb59ad0cfdf9aa42cb0634d726
    platform: linux/amd64
    user: "0:0"
    entrypoint: ["/bin/bash", "-c", "cp /source/server.pem /tls/server.pem && cp /source/server.key /tls/server.key && cp /source/ca.pem /tls/ca.pem && chown 10001:0 /tls/server.* /tls/ca.pem && chmod 600 /tls/server.key && chmod 644 /tls/server.pem /tls/ca.pem && chown 10001:0 /data /backup"]
    volumes:
      - ${KOHAMI_LOCAL_DIR:-../../.local/kohami-sql-test/identity}/sql-tls:/source:ro
      - tls:/tls
      - data:/data
      - backup:/backup
    restart: "no"
  sqlserver:
    hostname: localhost
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:2b5b581621126574f3d1f75e78d3eebe8d05aedb59ad0cfdf9aa42cb0634d726
    platform: linux/amd64
    user: "10001:0"
    depends_on:
      tls-init:
        condition: service_completed_successfully
    env_file: ${KOHAMI_LOCAL_DIR:-../../.local/kohami-sql-test/identity}/sql-container.env
    environment:
      HOME: /var/opt/mssql
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - data:/var/opt/mssql
      - tls:/var/opt/mssql/tls:ro
      - ../foundation/mssql.conf:/var/opt/mssql/mssql.conf:ro
      - backup:/var/opt/mssql/backup
    mem_limit: 4g
    cpus: 2
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "SSL_CERT_FILE=/var/opt/mssql/tls/ca.pem SQLCMDPASSWORD=\"$${MSSQL_SA_PASSWORD}\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -Ns -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 20s
volumes:
  data:
  backup:
  tls:
