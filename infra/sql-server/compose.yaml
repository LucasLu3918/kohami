name: kohami-sql-test
services:
  sqlserver:
    image: ${KOHAMI_SQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090}
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run infra/sql-server/manage.sh start}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - data:/var/opt/mssql
    mem_limit: 4g
    cpus: 2
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", 'SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null']
      interval: 10s
      timeout: 10s
      retries: 24
      start_period: 20s
volumes:
  data:
