<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1160" viewBox="0 0 390 1160" role="img" aria-labelledby="title"><title id="title">M2已驗證訪客訂單頁線框；付款Unknown，完整狀態與原明細，取消需另驗證</title><style>text{font-family:"PingFang TC","Microsoft JhengHei",sans-serif}</style><rect width="100%" height="100%" fill="#FAF7F2"/><rect x="0" y="0" width="390" height="43" rx="8" fill="#83334F" stroke="#83334F"/><text x="16" y="27" font-size="14" fill="white" font-weight="400">規劃線框 · 全流程模擬，無實際交易</text><text x="16" y="88" font-size="27" fill="#262326" font-weight="600">KOHAMI</text><text x="287" y="87" font-size="15" fill="#262326" font-weight="400">繁中 ▾</text><text x="16" y="144" font-size="29" fill="#262326" font-weight="600">訂單狀態</text><text x="16" y="174" font-size="14" fill="#5F5860" font-weight="400">示意訂單 DEMO-20261013-01</text><rect x="16" y="196" width="358" height="185" rx="8" fill="#F6EDF1" stroke="#B68899"/><text x="32" y="232" font-size="22" fill="#83334F" font-weight="600">模擬付款待確認</text><text x="32" y="264" font-size="15" fill="#262326" font-weight="400">尚未確認成功或失敗，請勿再次付款。</text><text x="32" y="293" font-size="15" fill="#262326" font-weight="400">庫存保留至 12:35（示意時間）</text><text x="32" y="322" font-size="14" fill="#5F5860" font-weight="400">後端持續查核，重新整理不會重複付款。</text><rect x="32" y="339" width="158" height="29" rx="8" fill="#FFFFFF" stroke="#83334F"/><text x="65" y="359" font-size="14" fill="#83334F" font-weight="400">查看同筆結果</text><text x="16" y="419" font-size="19" fill="#262326" font-weight="600">原交易明細</text><rect x="16" y="436" width="358" height="203" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><text x="32" y="470" font-size="16" fill="#262326" font-weight="400">柔織上衣 · 奶油白 / M × 1</text><text x="32" y="500" font-size="16" fill="#262326" font-weight="400">日常針織衫 · 灰色 / M × 2</text><text x="32" y="534" font-size="15" fill="#262326" font-weight="400">商品小計</text><text x="239" y="534" font-size="15" fill="#262326" font-weight="400">TWD 1,800</text><text x="32" y="564" font-size="15" fill="#262326" font-weight="400">示意優惠 / 運費</text><text x="236" y="564" font-size="15" fill="#262326" font-weight="400">−270 / +60</text><text x="32" y="608" font-size="20" fill="#262326" font-weight="600">原單總額</text><text x="236" y="608" font-size="20" fill="#262326" font-weight="600">TWD 1,590</text><text x="16" y="680" font-size="19" fill="#262326" font-weight="600">各流程分開顯示</text><rect x="16" y="696" width="358" height="179" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><text x="32" y="727" font-size="16" fill="#262326" font-weight="400">訂單</text><text x="235" y="727" font-size="15" fill="#5F5860" font-weight="400">待付款確認</text><text x="32" y="760" font-size="16" fill="#262326" font-weight="400">模擬配送</text><text x="235" y="760" font-size="15" fill="#5F5860" font-weight="400">尚未出貨</text><text x="32" y="793" font-size="16" fill="#262326" font-weight="400">模擬退款</text><text x="235" y="793" font-size="15" fill="#5F5860" font-weight="400">尚未發起</text><text x="32" y="826" font-size="16" fill="#262326" font-weight="400">模擬憑證</text><text x="235" y="826" font-size="15" fill="#5F5860" font-weight="400">尚未建立</text><text x="32" y="854" font-size="13" fill="#5F5860" font-weight="400">付款確認前不可出貨，其他狀態不自動完成。</text><rect x="16" y="901" width="358" height="52" rx="8" fill="#83334F" stroke="#83334F"/><text x="112" y="933" font-size="17" fill="white" font-weight="400">重新驗證後申請取消</text><rect x="16" y="967" width="358" height="48" rx="8" fill="#FFFFFF" stroke="#D8D0D5"/><text x="141" y="997" font-size="16" fill="#83334F" font-weight="400">聯繫客服（示意）</text><text x="16" y="1048" font-size="14" fill="#5F5860" font-weight="400">此頁為已驗證單筆查閱的狀態。</text><text x="16" y="1074" font-size="14" fill="#5F5860" font-weight="400">查閱權不直接授予取消／退款操作。</text><text x="16" y="1130" font-size="13" fill="#83334F" font-weight="400">SCR-05B · 靜態規劃，不執行付款或取消</text></svg>